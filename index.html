    const q = f * 4;
    lists[vSite[f * 3]].push(fN[q], fN[q + 1], fN[q + 2], fN[q + 3]);
    lists[vSite[f * 3 + 1]].push(fN[q], fN[q + 1], fN[q + 2], fN[q + 3]);
    lists[vSite[f * 3 + 2]].push(fN[q], fN[q + 1], fN[q + 2], fN[q + 3]);
  }
  const CREASE = 0.5;                     // cos 60°
  const out = new Float32Array(nV * 3);
  for (let i = 0; i < nV; i++) {
    const b = i * 3, q = ((i / 3) | 0) * 4;
    const ax = nor[b], ay = nor[b + 1], az = nor[b + 2];
    if (ax * fN[q] + ay * fN[q + 1] + az * fN[q + 2] < 0.999) {
      // authored-smooth vertex: use it as-is
      out[b] = ax; out[b + 1] = ay; out[b + 2] = az;
      continue;
    }
    // flat-authored: crease-filtered one-ring star average
    const fx = fN[q], fy = fN[q + 1], fz = fN[q + 2];
    const L = lists[vSite[i]];
    let sx = 0, sy = 0, sz = 0;
    for (let j = 0; j < L.length; j += 4) {
      if (fx * L[j] + fy * L[j + 1] + fz * L[j + 2] > CREASE) {
        sx += L[j] * L[j + 3]; sy += L[j + 1] * L[j + 3]; sz += L[j + 2] * L[j + 3];
      }
    }
    const l = Math.hypot(sx, sy, sz) || 1;
    out[b] = sx / l; out[b + 1] = sy / l; out[b + 2] = sz / l;
  }
  geo.setAttribute('aSNormal', new THREE.Float32BufferAttribute(out, 3));
  // PN-triangle coefficients for the organic shade class: each vertex
  // carries the triangle's three corner shade normals plus the three
  // precomputed mid-edge normals (m_ij = n_i + n_j − v̄(P_j−P_i),
  // v̄ = 2(P_j−P_i)·(n_i+n_j)/|P_j−P_i|²) so the normal pass can
  // evaluate a QUADRATIC normal field per pixel — the shade value
  // curves inside every triangle instead of being piecewise-linear,
  // which is what plateaus the hard-shade isoline on coarse meshes.
  // World-space is fine: the view transform is rigid.
  const cA = new Int8Array(nV * 4), cB = new Int8Array(nV * 4), cC = new Int8Array(nV * 4);
  const mA = new Int8Array(nV * 4), mB = new Int8Array(nV * 4), mC = new Int8Array(nV * 4);
  const mid = (i0, i1, dst, off) => {
    const ex = pos[i1 * 3] - pos[i0 * 3], ey = pos[i1 * 3 + 1] - pos[i0 * 3 + 1],
          ez = pos[i1 * 3 + 2] - pos[i0 * 3 + 2];
    const nsx = out[i0 * 3] + out[i1 * 3], nsy = out[i0 * 3 + 1] + out[i1 * 3 + 1],
          nsz = out[i0 * 3 + 2] + out[i1 * 3 + 2];
    const e2 = ex * ex + ey * ey + ez * ez;
    const v = e2 > 1e-12 ? 2 * (ex * nsx + ey * nsy + ez * nsz) / e2 : 0;
    let x = nsx - v * ex, y = nsy - v * ey, z = nsz - v * ez;
    const l = Math.hypot(x, y, z) || 1;
    dst[off] = Math.round(x / l * 127);
    dst[off + 1] = Math.round(y / l * 127);
    dst[off + 2] = Math.round(z / l * 127);
  };
  const put4 = (dst, off, src, i) => {
    dst[off] = Math.round(out[i * 3] * 127);
    dst[off + 1] = Math.round(out[i * 3 + 1] * 127);
    dst[off + 2] = Math.round(out[i * 3 + 2] * 127);
  };
  for (let f = 0; f < nT; f++) {
    const v0 = f * 3, v1 = v0 + 1, v2 = v0 + 2;
    for (let c = 0; c < 3; c++) {
      const o = (v0 + c) * 4;
      put4(cA, o, out, v0); put4(cB, o, out, v1); put4(cC, o, out, v2);
      mid(v0, v1, mA, o); mid(v1, v2, mB, o); mid(v2, v0, mC, o);
    }
  }
  geo.setAttribute('aSNA', new THREE.Int8BufferAttribute(cA, 4, true));
  geo.setAttribute('aSNB', new THREE.Int8BufferAttribute(cB, 4, true));
  geo.setAttribute('aSNC', new THREE.Int8BufferAttribute(cC, 4, true));
  geo.setAttribute('aSM0', new THREE.Int8BufferAttribute(mA, 4, true));
  geo.setAttribute('aSM1', new THREE.Int8BufferAttribute(mB, 4, true));
  geo.setAttribute('aSM2', new THREE.Int8BufferAttribute(mC, 4, true));
}

function finishScene() {
  const { merged, mergedGlass, stats } = mergeBagArray(bag);
  bag = [];
  glassVertCount = stats.glassVerts;
  triCount = stats.tris;
  edgeCount = stats.edges;
  regionCount = stats.regions;
  hasGlow = stats.hasGlow;
  bakeSmoothNormals(merged);
  merged.computeBoundingSphere();
  sceneSphere = merged.boundingSphere;   // drives the adaptive far plane
  if (glassVertCount) {                  // expand it to cover the glass mesh
    mergedGlass.computeBoundingSphere();
    const gs = mergedGlass.boundingSphere;
    if (merged.attributes.position.count === 0) sceneSphere = gs;
    else {
      const reach = sceneSphere.center.distanceTo(gs.center) + gs.radius;
      if (reach > sceneSphere.radius) sceneSphere.radius = reach;
    }
  }
  sceneRoot = new THREE.Mesh(merged, idMaterial);
  sceneRoot.frustumCulled = false;
  scene.add(sceneRoot);
  glassRoot = new THREE.Mesh(mergedGlass, idMaterial);
  glassRoot.frustumCulled = false;
  scene.add(glassRoot);
  volDirty = true;   // stencil shadow volumes mirror the merged mesh
  markDirty();
}

/* ============================================================
   Player + hoverbike: dynamic actors on top of the merged scene.
   Actors are built with put() so they carry the baked face-ID /
   size / paint attributes idMaterial needs, then merged into their
   OWN mesh and moved as normal Object3Ds — the shaders transform by
   modelViewMatrix, so only the scene merge required world-space
   baking, not the materials.
   ============================================================ */
// ---- ground query: swappable flat-vs-raycast implementations ----
let groundDatum = 0;               // per-scene walk height, set by buildScene()
const _rayDown = new THREE.Vector3(0, -1, 0);
const _rayOrg = new THREE.Vector3(), _rayDir = new THREE.Vector3();
const _ray = new THREE.Raycaster();
function groundHeightFlat(x, z, curY) { return groundDatum; }
// full collision: rays against the merged scene mesh. O(triangles) per ray
// (no BVH), so it's opt-in; this hook is the seam where a baked heightfield
// or three-mesh-bvh drops in if it ever gets too slow.
function groundHeightRay(x, z, curY) {
  if (!sceneRoot) return groundDatum;
  _ray.set(_rayOrg.set(x, curY + 2.5, z), _rayDown);
  const hit = _ray.intersectObject(sceneRoot, false)[0];
  return hit ? hit.point.y : groundDatum;
}
let groundHeight = groundHeightFlat;
function resolveMoveFree(pos, dx, dz, out) { return out.set(dx, 0, dz); }
function resolveMoveBlocked(pos, dx, dz, out) {
  out.set(dx, 0, dz);
  const len = Math.hypot(dx, dz);
  if (!sceneRoot || len < 1e-6) return out;
  // knee-height ray along the move: stop at walls and machinery
  _ray.set(_rayOrg.set(pos.x, pos.y + 0.45, pos.z),
           _rayDir.set(dx / len, 0, dz / len));
  _ray.far = len + 0.4;
  const hit = _ray.intersectObject(sceneRoot, false)[0];
  _ray.far = Infinity;
  if (hit) out.set(0, 0, 0);
  return out;
}
let resolveMove = resolveMoveFree;
function swapGroundImpl() {
  groundHeight = P.collision ? groundHeightRay : groundHeightFlat;
  resolveMove = P.collision ? resolveMoveBlocked : resolveMoveFree;
}

// ---- dynamic actor factory ----
const actors = [];
function buildActor(builderFn, seed) {
  // swap the merge globals out so the scene's bag/crng/paint streams
  // are untouched no matter when an actor gets built
  const prevBag = bag, prevCrng = crng;
  const pc = currentPaint, pa = currentAlpha, pg = currentGlow;
  const ps = currentSoft, pk = currentContour, pb = currentPBlend;
  const pu = currentUnlit, pn = currentNoCast, po = currentOrganic;
  bag = []; crng = mulberry32(seed);
  builderFn();
  const mine = bag;
  bag = prevBag; crng = prevCrng;
  currentPaint = pc; currentAlpha = pa; currentGlow = pg;
  currentSoft = ps; currentContour = pk; currentPBlend = pb;
  currentUnlit = pu; currentNoCast = pn; currentOrganic = po;
  const { merged, mergedGlass } = mergeBagArray(mine, { timing: false });
  bakeSmoothNormals(merged);
  mergedGlass.dispose();               // actors are opaque-only
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(merged, idMaterial);
  mesh.frustumCulled = false;
  group.add(mesh);
  scene.add(group);
  const a = { group, mesh };
  actors.push(a);
  volDirty = true;   // actor casters join the stencil volume scene
  return a;
}

// ---- the two actors + their state ----
// player state machine: 'onFoot' <-> 'riding', transitions only in
// tryMountToggle(). yaw 0 faces -z, matching the fly convention.
const player = { state: 'onFoot', pos: new THREE.Vector3(6, 0, 8), yaw: 0, speed: 0, bobT: 0 };
const bike = { pos: new THREE.Vector3(10, 0, 2), yaw: 0.6, speed: 0, hoverT: 0 };
let playerActor = null, bikeActor = null;
const _mv = new THREE.Vector3(), _seat = new THREE.Vector3();
const UP_Y = new THREE.Vector3(0, 1, 0);
const BIKE_HOVER = 0.55;

// primitive placeholder robot: ~1.8 units tall, feet at y=0, facing -z
function buildPlayerGeom() {
  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  withPaint(PAL.slate, () => {
    put(null, B(0.20, 0.72, 0.26), -0.14, 0.36, 0, 0, 0, 0, 0.7);      // legs
    put(null, B(0.20, 0.72, 0.26), 0.14, 0.36, 0, 0, 0, 0, 0.7);
    put(null, B(0.15, 0.55, 0.18), -0.43, 1.12, 0, 0, 0, 0.08, 0.7);   // arms
    put(null, B(0.15, 0.55, 0.18), 0.43, 1.12, 0, 0, 0, -0.08, 0.7);
  });
  withPaint(PAL.deepSlate, () => {
    put(null, B(0.46, 0.20, 0.30), 0, 0.82, 0, 0, 0, 0, 0.7);          // hips
    put(null, B(0.24, 0.10, 0.36), -0.14, 0.05, -0.03, 0, 0, 0, 0.7);  // feet
    put(null, B(0.24, 0.10, 0.36), 0.14, 0.05, -0.03, 0, 0, 0, 0.7);
  });
  withPaint(PAL.peri, () => {
    put(null, B(0.54, 0.60, 0.32), 0, 1.24, 0, 0, 0, 0, 0.8);          // torso
    put(null, new THREE.SphereGeometry(0.13, 10, 8), -0.36, 1.5, 0, 0, 0, 0, 0.6);
    put(null, new THREE.SphereGeometry(0.13, 10, 8), 0.36, 1.5, 0, 0, 0, 0, 0.6);
  });
  withPaint(PAL.sand, () => {
    put(null, B(0.40, 0.32, 0.05), 0, 1.28, -0.17, 0, 0, 0, 0.65);     // chest plate
    put(null, new THREE.SphereGeometry(0.17, 12, 9), 0, 1.70, 0, 0, 0, 0, 0.65); // head
  });
  withPaint(PAL.cyan, () =>
    put(null, B(0.24, 0.07, 0.06), 0, 1.72, -0.15, 0, 0, 0, 0.6));     // visor
}
// the rideable craft is models/speeder.obj (modeled nose -x), scaled
// from its 16-unit authored size to bike scale and rotated so the nose
// faces -z like every other actor. Unlike the showcase this keeps a
// FIXED scale — the bike has to stay the size the player straddles.
function buildBikeGeom() {
  setPaint(null);                       // color by material name
  const t = modelText('speeder.obj');
  if (!t) return;                       // library not in yet; spawnActors retries
  const g = parseOBJ(t);
  g.applyMatrix4(new THREE.Matrix4().makeScale(0.28, 0.28, 0.28));
  withContours(() => put(null, g, 0, 0, 0, 0, -Math.PI / 2, 0, 0.55));
}

function applyActorTransforms() {
  if (!playerActor) return;
  bikeActor.group.position.copy(bike.pos);
  bikeActor.group.rotation.set(0, bike.yaw, 0);
  if (player.state === 'riding') {
    _seat.set(0, 0.85, 0.35).applyAxisAngle(UP_Y, bike.yaw);
    playerActor.group.position.copy(bike.pos).add(_seat);
    playerActor.group.rotation.set(0, bike.yaw, 0);
  } else {
    const bob = Math.sin(player.bobT * 8) * 0.05 * Math.min(1, player.speed / 2);
    playerActor.group.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
    playerActor.group.rotation.set(0, player.yaw, 0);
  }
}

// a scene is a field of models with gaps between them, so no fixed spawn
// point is safe: spiral outward probing with a down-ray until the probe
// lands at ground height instead of on top of a model.
// One-time cost (spawn / rebuild only) — never per frame.
function findClearSpot(x, z) {
  for (let ring = 0; ring < 6; ring++) {
    const n = Math.max(1, ring * 8);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const cx = x + Math.cos(a) * ring * 4.75, cz = z + Math.sin(a) * ring * 4.75;
      if (groundHeightRay(cx, cz, 40) <= groundDatum + 0.3) return { x: cx, z: cz };
    }
  }
  return { x, z };
}

function placeActorsAtSpawn() {
  const ps = findClearSpot(6, 8);
  player.pos.set(ps.x, groundDatum, ps.z);
  player.state = 'onFoot';
  const bs = findClearSpot(ps.x + 4.75, ps.z - 4.75);
  bike.pos.set(bs.x, groundDatum + BIKE_HOVER, bs.z);
  bike.speed = 0;
  bike.yaw = Math.atan2(-(bs.x - ps.x), -(bs.z - ps.z)) + Math.PI / 2; // parked side-on
  applyActorTransforms();
}

function regroundActors() {
  if (!playerActor) return;
  // scene changed under us: if the old spot is now inside machinery,
  // respawn somewhere clear; otherwise just re-seat on the new datum
  // while riding, player.pos is stale (transforms come from the bike) —
  // keep the pair together before probing
  if (player.state === 'riding') { player.pos.x = bike.pos.x; player.pos.z = bike.pos.z; }
  if (groundHeightRay(player.pos.x, player.pos.z, 40) > groundDatum + 0.3) {
    placeActorsAtSpawn();               // respawns on foot at a clear spot
    return;
  }
  if (player.state !== 'riding' &&
      groundHeightRay(bike.pos.x, bike.pos.z, 40) > groundDatum + 0.3) {
    const bs = findClearSpot(player.pos.x + 4.75, player.pos.z - 4.75);
    bike.pos.set(bs.x, groundDatum + BIKE_HOVER, bs.z);
  }
  player.pos.y = groundHeight(player.pos.x, player.pos.z, player.pos.y + 1);
  bike.speed = 0;
  bike.pos.y = groundHeight(bike.pos.x, bike.pos.z, bike.pos.y + 1) + BIKE_HOVER;
  applyActorTransforms();
}

// The player is the one shape still built in code — a placeholder for
// the character controller, not scene content. The bike is a real
// model, so spawning waits for the library: setModels() calls back here
// once it lands, and player mode entered beforehand just has no actors
// for a moment rather than a bike with no mesh.
function spawnActors() {
  if (playerActor || !modelText('speeder.obj')) return;
  playerActor = buildActor(buildPlayerGeom, 0xB0B0 ^ P.seed);
  bikeActor = buildActor(buildBikeGeom, 0x51CE ^ P.seed);
  placeActorsAtSpawn();
}

function tryMountToggle() {
  if (!playerActor) return;
  if (player.state === 'riding') {
    player.state = 'onFoot';
    // dismount to the bike's right side
    player.pos.set(bike.pos.x + Math.cos(bike.yaw) * 2, 0,
                   bike.pos.z - Math.sin(bike.yaw) * 2);
    player.pos.y = groundHeight(player.pos.x, player.pos.z, bike.pos.y);
    player.yaw = bike.yaw;
    player.speed = 0;
  } else if (player.pos.distanceTo(bike.pos) < 3.5) {
    player.state = 'riding';
  }
  applyActorTransforms();
  markDirty();
}

buildScene();

/* ============================================================
   Render targets: ID color + depth in one, view normals in another
   ============================================================ */
// TWO target sets: a 1x set for interactive frames and (when
// supersample > 1) a full-scale set for refined stills. Keeping both
// alive means switching costs nothing per frame — no pass logic or
// shader behavior changes between them, only buffer size.
let targetsLo = null, targetsHi = null, rtScreen = null;
let rtEdges = null, rtWeights = null;   // smaa intermediates, screen res
function makeTargetSet(scale) {
  const s = renderer.getPixelRatio() * scale;
  const w = Math.floor(innerWidth * s);
  const h = Math.floor(innerHeight * s);
  const depthTexture = new THREE.DepthTexture(w, h);
  depthTexture.type = THREE.UnsignedIntType;
  const glassDepth = new THREE.DepthTexture(w, h);
  glassDepth.type = THREE.UnsignedIntType;
  return {
    scale,
    // MRT: attachment 0 = face-ID + size, attachment 1 = paint (watercolor).
    // WebGLMultipleRenderTargets is the r160 API (pinned by the importmap);
    // WebGLRenderTarget({count: 2}) is the newer form and silently yields
    // zero textures on r160 — do not switch until three is upgraded.
    rtID: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture, depthBuffer: true,
    }),
    // the translucent layer: same shape, its OWN depth so the compose
    // step can decide per pixel whether glass sits in front
    rtGlass: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture: glassDepth, depthBuffer: true,
    }),
    // glass again with front faces culled: the nearest BACK faces, so
    // interior edges can be drawn through the glass
    rtGlassBack: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture: (() => { const d = new THREE.DepthTexture(w, h); d.type = THREE.UnsignedIntType; return d; })(),
      depthBuffer: true,
    }),
    // two attachments: [0] flat facet normals, [1] smoothed shade
    // normals (same r160 MRT API caveat as rtID above). Every geometry
    // buffer is single-sampled: the ink is detected from the ID buffer
    // and antialiased by the stroke stage + SMAA, so hardware MSAA on
    // these attachments bought nothing but memory.
    rtNormal: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      // keeps its depth buffer: unlike every other target below, real
      // geometry is rasterized into this one and must depth-sort
    }),
    // stage A of the line pass: the 1px boundary skeleton
    // (R = ink strength, G/B = glass, A = speckle fill).
    // LINEAR filter is load-bearing: the stroke stage samples this at
    // -0.5-texel offsets so each forward-diff boundary mark (written on
    // the left/bottom pixel of its texel pair) spreads bilinearly
    // across BOTH pixels — the two-sided half-intensity line profile,
    // re-centered on the boundary. Texel-center reads (the alpha
    // passthrough, the max-downsample) are exact under bilinear.
    rtSkel: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // quarter-res MAX-downsample of the skeleton RGB (max, not mip
    // average — an average would quantize thin lines to zero): the
    // stroke stage rejects empty neighborhoods with a few cheap taps
    rtSkelLo: new THREE.WebGLRenderTarget(w >> 2, h >> 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // stage B output: the stroked lines the compose reads. Same
    // channel semantics as the skeleton, at final width.
    rtLines: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // materialized shadow mask (MASK_PASS): R = binary shadow-region
    // membership, G = the compose's AA'd cast fill — computed once per
    // frame instead of ~7x per pixel. LINEAR filter is load-bearing:
    // skelShadow's RGSS sub-offset reads interpolate the binary R into
    // coverage grays (texel-center reads stay exact under bilinear).
    rtSMask: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // the composed image, when it needs a filtered resample before it
    // reaches the canvas (supersampling and/or post AA)
    rtInk: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // quarter-res ping-pong pair for the emissive halo blur
    rtGlowA: new THREE.WebGLRenderTarget(w >> 2, h >> 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    rtGlowB: new THREE.WebGLRenderTarget(w >> 2, h >> 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    // half-res ping-pong pair for the cast-shadow silhouette smoothing
    // (mask -> blur -> re-threshold) and for the shade-field blur.
    // Linear filter so the main pass upsamples smoothly; HALF FLOAT is
    // load-bearing for the shade field — an 8-bit field re-plateaus the
    // shallow gradients whose staircase this exists to remove
    rtMaskA: new THREE.WebGLRenderTarget(w >> 1, h >> 1, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: THREE.HalfFloatType,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
    rtMaskB: new THREE.WebGLRenderTarget(w >> 1, h >> 1, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: THREE.HalfFloatType,
      depthBuffer: false,   // never depth-tested; the default RB is pure cost
    }),
  };
}
function disposeSet(t) {
  if (t) {
    t.rtID.dispose(); t.rtGlass.dispose(); t.rtGlassBack.dispose();
    t.rtNormal.dispose(); t.rtSkel.dispose(); t.rtSkelLo.dispose();
    t.rtLines.dispose(); t.rtSMask.dispose(); t.rtInk.dispose();
    t.rtGlowA.dispose(); t.rtGlowB.dispose();
    t.rtMaskA.dispose(); t.rtMaskB.dispose();
  }
}
function makeTargets() {
  disposeSet(targetsLo); disposeSet(targetsHi);
  if (rtScreen) rtScreen.dispose();
  if (rtEdges) rtEdges.dispose();
  if (rtWeights) rtWeights.dispose();
  targetsLo = makeTargetSet(1);
  targetsHi = P.superSample > 1 ? makeTargetSet(P.superSample) : null;
  const sw = Math.floor(innerWidth * renderer.getPixelRatio());
  const sh = Math.floor(innerHeight * renderer.getPixelRatio());
  // screen-res intermediate so post AA can run AFTER the downsample
  rtScreen = new THREE.WebGLRenderTarget(sw, sh, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false,   // fullscreen blits only
  });
  // smaa's two intermediates, also screen res (edge flags, blend weights)
  const smaaOpts = {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false,
  };
  rtEdges = new THREE.WebGLRenderTarget(sw, sh, smaaOpts);
  rtWeights = new THREE.WebGLRenderTarget(sw, sh, smaaOpts);
  markDirty();
}
makeTargets();

/* ============================================================
   Stencil shadow volumes — pixel-exact hard cast shadows via
   per-triangle depth-fail volumes (Carmack's reverse), ported
   from the FunWithShadows project. Every light-facing triangle
   emits its own closed volume, so the kitbashed, interpenetrating,
   non-manifold merged scene casts correctly with no watertight
   requirement: side quads on interior shared edges are coincident
   with opposite windings and cancel exactly in stencil counting.
   The result is a screen-space binary mask (rtStencil.texture.r,
   1 = shadowed) — the one and only cast-shadow source.
   ============================================================ */
// Per source triangle: 6 unique verts (3 on the surface, 3 extruded
// to the ideal point in the shader) and 24 indices — near cap, far
// cap reversed, and an outward-wound side quad per edge. Positions
// are welded first (~1e-5) so exported duplicates produce identical,
// cancelling side quads; the weld keeps the first occurrence's exact
// floats, so near caps still rasterize bit-identical to the depth
// prepass (the acne-avoidance contract, see volume materials below).
// The flat normal rides an int8-normalized vec4 with the extrude
// flag in w — the facing test only needs ~1° accuracy.
// Triangles flagged no-cast (ID color blue bit 1) emit nothing.
function buildVolumeGeometry(source) {
  const pos = source.attributes.position;
  const col = source.attributes.color;
  const idx = source.index;
  const vertCount = pos.count;
  const inv = 1e5;                        // 1/weld tolerance
  const keyMap = new Map();
  const welded = [];
  const remap = new Uint32Array(vertCount);
  for (let i = 0; i < vertCount; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const key = Math.round(x * inv) + '_' + Math.round(y * inv) + '_' + Math.round(z * inv);
    let w = keyMap.get(key);
    if (w === undefined) {
      w = welded.length / 3;
      keyMap.set(key, w);
      welded.push(x, y, z);
    }
    remap[i] = w;
  }
  const srcAt = i => idx ? idx.getX(i) : i;
  const triCountSrc = (idx ? idx.count : vertCount) / 3;
  const outPos = [], outN = [], outIdx = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  const read = (w, v) => v.set(welded[w * 3], welded[w * 3 + 1], welded[w * 3 + 2]);
  let emitted = 0;
  for (let t = 0; t < triCountSrc; t++) {
    const s0 = srcAt(t * 3);
    if (col && (Math.round(col.getZ(s0) * 255) & 2)) continue;   // no-cast
    const i0 = remap[s0], i1 = remap[srcAt(t * 3 + 1)], i2 = remap[srcAt(t * 3 + 2)];
    if (i0 === i1 || i1 === i2 || i2 === i0) continue;   // degenerate after weld
    read(i0, A); read(i1, B); read(i2, C);
    ab.subVectors(B, A); ac.subVectors(C, A); n.crossVectors(ab, ac);
    if (n.lengthSq() < 1e-14) continue;                  // zero-area
    n.normalize();
    const nx = Math.round(n.x * 127), ny = Math.round(n.y * 127), nz = Math.round(n.z * 127);
    const base = outPos.length / 3;
    for (const v of [A, B, C]) { outPos.push(v.x, v.y, v.z); outN.push(nx, ny, nz, 0); }
    for (const v of [A, B, C]) { outPos.push(v.x, v.y, v.z); outN.push(nx, ny, nz, 127); }
    outIdx.push(base, base + 1, base + 2,               // near cap
                base + 5, base + 4, base + 3);          // far cap, reversed
    for (let e = 0; e < 3; e++) {                       // side quads, outward
      const i = base + e, j = base + (e + 1) % 3;
      outIdx.push(j, i, i + 3, j, i + 3, j + 3);
    }
    emitted += 8;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(outPos, 3));
  g.setAttribute('aVolN', new THREE.Int8BufferAttribute(outN, 4, true));
  g.setIndex(outIdx);
  g.userData.shadowTriCount = emitted;
  return g;
}

// Extrusion vertex shader. uLightDir = direction the light TRAVELS
// (i.e. -lightWorld), world space. Light-facing triangles keep their
// near cap on the surface and send flagged verts to the ideal point
// vec4(uLightDir, 0) — needs the infinite-far projection. Back-facing
// triangles extrude ALL verts and collapse to zero area. The
// non-extruded branch uses EXACTLY the built-in materials' transform
// expression (projectionMatrix * (modelViewMatrix * position)) so near
// caps rasterize at bit-identical depth to the prepass; with depthFunc
// LESS, equal-depth cap fragments then z-fail on BOTH volume passes and
// the increment/decrement cancel — no self-shadow acne, no bias.
const VOL_VERT = /* glsl */`
  attribute vec4 aVolN;   // xyz = flat normal (int8 norm), w = extrude flag
  uniform vec3 uLightDir;
  void main() {
    vec3 nWorld = mat3(modelMatrix) * aVolN.xyz;   // uniform scales only
    float e = dot(nWorld, uLightDir) < 0.0 ? aVolN.w : 1.0;
    if (e > 0.4) {
      gl_Position = projectionMatrix * (viewMatrix * vec4(uLightDir, 0.0));
    } else {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
    }
  }`;
const volUniforms = { uLightDir: { value: new THREE.Vector3(0, -1, 0) } };
const volCommon = {
  uniforms: volUniforms,
  vertexShader: VOL_VERT,
  fragmentShader: 'void main() { gl_FragColor = vec4(1.0); }',
  colorWrite: false, depthWrite: false, depthTest: true,
  depthFunc: THREE.LessDepth,      // strict: equal-depth caps must z-fail
  stencilWrite: true,
  stencilFunc: THREE.AlwaysStencilFunc, stencilRef: 0,
  stencilFuncMask: 0xff, stencilWriteMask: 0xff,
  stencilFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp,
};
// depth-fail: back faces increment on z-fail, front faces decrement.
// Wrap ops are mandatory — nested volumes exceed a count of 1.
const volBackMat = new THREE.ShaderMaterial({
  ...volCommon, side: THREE.BackSide, stencilZFail: THREE.IncrementWrapStencilOp });
const volFrontMat = new THREE.ShaderMaterial({
  ...volCommon, side: THREE.FrontSide, stencilZFail: THREE.DecrementWrapStencilOp });
// depth prepass into rtStencil: same transform expression and same
// DoubleSide rasterization as idMaterial, color left at the clear value
const volDepthMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide, colorWrite: false,
  vertexShader: /* glsl */`
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
    }`,
  fragmentShader: 'void main() { gl_FragColor = vec4(0.0); }',
});
// fullscreen extract: write 1 where stencil != 0. stencilWrite must be
// true even though every op is Keep — three.js gates the whole stencil
// state (including the func test) behind it.
const stencilExtractMat = new THREE.ShaderMaterial({
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
  depthTest: false, depthWrite: false,
  stencilWrite: true,
  stencilFunc: THREE.NotEqualStencilFunc, stencilRef: 0,
  stencilFuncMask: 0xff, stencilWriteMask: 0,
  stencilFail: THREE.KeepStencilOp,
  stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp,
});

// volume meshes live in their own scene; actor volumes share the source
// mesh's matrixWorld by reference so animation is free. Rebuilt lazily
// (volDirty, declared near shadowDirty) — only when stencil mode renders.
const volScene = new THREE.Scene();
let volTriCount = 0, volBytes = 0, lastVolBuildMs = 0;
const volLinks = [];   // { mesh, srcRoot } for per-frame visibility sync
function rebuildShadowVolumes() {
  const t0 = performance.now();
  for (const l of volLinks) { l.mesh.geometry.dispose(); volScene.remove(l.mesh); }
  volLinks.length = 0;
  volTriCount = 0; volBytes = 0;
  const addCaster = (srcMesh, srcRoot) => {
    if (!srcMesh || !srcMesh.geometry.attributes.position ||
        srcMesh.geometry.attributes.position.count === 0) return;
    const g = buildVolumeGeometry(srcMesh.geometry);
    const m = new THREE.Mesh(g, volBackMat);
    m.matrixAutoUpdate = false;
    m.matrixWorldAutoUpdate = false;
    m.matrixWorld = srcMesh.matrixWorld;   // shared reference
    m.frustumCulled = false;               // extrusion happens in the shader
    volScene.add(m);
    volLinks.push({ mesh: m, srcRoot });
    volTriCount += g.userData.shadowTriCount;
    volBytes += g.attributes.position.count * 16 + g.index.count * 4;
  };
  addCaster(sceneRoot, sceneRoot);         // the translucent layer casts nothing
  for (const a of actors) addCaster(a.mesh, a.group);
  volDirty = false;
  lastVolBuildMs = performance.now() - t0;
}

// screen-space mask target (color + packed depth24/stencil8), sized to
// whichever target set is rendering. Linear filter: the binary mask's
// one-texel bilinear ramp re-hardens into an antialiased edge downstream.
let rtStencil = null;
function ensureStencilTarget(w, h) {
  if (rtStencil && rtStencil.width === w && rtStencil.height === h) return;
  if (rtStencil) rtStencil.dispose();
  rtStencil = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: true, stencilBuffer: true,
  });
}

// far plane at infinity (epsilon trick), patched in place: the ideal
// point (w = 0) rasterizes at depth ~1-ε instead of clipping. Restored
// with camera.updateProjectionMatrix() after the volume passes.
function applyInfiniteProjection(cam) {
  const e = cam.projectionMatrix.elements;   // column-major
  e[10] = 1e-5 - 1;
  e[14] = (1e-5 - 2) * cam.near;
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
}

/* ============================================================
   Post pass — where the ink happens
   ============================================================ */
const post = new THREE.ShaderMaterial({
  uniforms: {
    tID:        { value: null },
    tNormal:    { value: null },
    tNormalS:   { value: null },   // smoothed shade normals (or flat when off)
    tDepth:     { value: null },
    resolution: { value: new THREE.Vector2() },
    cameraNear: { value: camera.near },
    cameraFar:  { value: camera.far },
    lightDir:   { value: new THREE.Vector3() },
    inkColor:   { value: new THREE.Color(P.inkColor) },
    paperColor: { value: new THREE.Color(P.paperColor) },
    idThreshold: { value: 0 },
    lineWidth: { value: 0 }, distanceFalloff: { value: 0 },
    wobbleAmp: { value: 0 }, wobbleFreq: { value: 0 },
    shadeOn: { value: 1 }, shadeThreshold: { value: 0 }, coreThreshold: { value: 0 },
    shadeNoise: { value: 0 }, shadeNoiseScale: { value: 1 },
    softShade: { value: 0 }, shadowAmount: { value: 0 },
    shadowLine: { value: 0 }, shadowLineWidth: { value: 1 },
    paperGrain: { value: 0 }, grainScale: { value: 1 }, ssScale: { value: 1 },
    oneSided: { value: 0 }, coverage: { value: 0 },
    edgeToAlpha: { value: 0 }, softContact: { value: 0 }, groundY: { value: 0 },
    horizonColor: { value: new THREE.Color(P.skyHorizon) },
    cloudAmt: { value: 0 }, speckleAmt: { value: 0 },
    skyGradHeight: { value: 0.30 }, cloudScale: { value: 5.5 }, cloudFade: { value: 0.10 },
    cloudStretch: { value: 1 }, cloudDir: { value: 0 },
    speckleSize: { value: 1 }, speckleFade: { value: 0 },
    sunDir: { value: new THREE.Vector3(0, 1, 0) },
    sunSize: { value: 0 }, sunColor: { value: new THREE.Color(P.sunColor) },
    sunCore: { value: 0.4 },
    minFeature: { value: 0 }, invFovScale: { value: 1 }, keepSil: { value: 0 },
    // watercolor
    tPaint:     { value: null },
    skyColor:   { value: new THREE.Color(P.skyColor) },
    colorOn:    { value: 1 },
    washAmount: { value: 0 }, washScale: { value: 1 }, poolAmount: { value: 0 },
    inkTint: { value: 0 }, aerialFade: { value: 0 },
    poolRadius: { value: 3.5 }, aerialNear: { value: 0.18 }, aerialFar: { value: 0.9 },
    paperFiber: { value: 0.35 }, paperFleck: { value: 0.5 },
    invViewProj: { value: new THREE.Matrix4() },
    viewToWorldN: { value: new THREE.Matrix3() },
    // glass & glow
    tGlassID: { value: null }, tGlassPaint: { value: null }, tGlassDepth: { value: null },
    tGlassBackID: { value: null }, tGlassBackDepth: { value: null },
    tGlow: { value: null },
    tLines: { value: null },   // the line pass's output (compose only)
    tSkel: { value: null },    // stage A skeleton (stroke stage only)
    tSkelLo: { value: null },  // quarter-res max of tSkel (gate)
    glassTint: { value: 0 }, glassLine: { value: 0 }, glassBackLine: { value: 0 },
    glowLift: { value: 0 }, haloStrength: { value: 0 },
    contourLine: { value: 0 }, contourCos: { value: 0 },
    castOn: { value: 0 },
    tCastMask: { value: null }, castSmoothOn: { value: 0 }, castPxScale: { value: 0 },
    tStencilMask: { value: null }, stencilWobW: { value: 0 },
    tSMask: { value: null },   // MASK_PASS output: R = shadow region, G = cast fill
    tShadeField: { value: null }, shadeFieldOn: { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tID, tNormal, tNormalS, tDepth;
    uniform vec2 resolution;
    uniform float cameraNear, cameraFar;
    uniform vec3 lightDir, inkColor, paperColor;
    uniform float idThreshold, lineWidth, distanceFalloff,
                  wobbleAmp, wobbleFreq, shadeOn, shadeThreshold, coreThreshold,
                  shadeNoise, shadeNoiseScale,
                  softShade, shadowAmount, shadowLine, shadowLineWidth,
                  paperGrain, grainScale, ssScale, oneSided, coverage, minFeature, invFovScale, keepSil,
                  edgeToAlpha, softContact, groundY, cloudAmt, speckleAmt, sunSize,
                  skyGradHeight, cloudScale, cloudFade, cloudStretch, cloudDir,
                  speckleSize, speckleFade,
                  sunCore, paperFiber, paperFleck;
    uniform vec3 horizonColor, sunDir, sunColor;
    uniform sampler2D tPaint;
    uniform vec3 skyColor;
    uniform float colorOn, washAmount, washScale, poolAmount, inkTint, aerialFade,
                  poolRadius, aerialNear, aerialFar;
    uniform mat4 invViewProj;
    uniform mat3 viewToWorldN;
    uniform sampler2D tGlassID, tGlassPaint, tGlassDepth, tGlow, tLines, tSkel, tSkelLo;
    uniform sampler2D tGlassBackID, tGlassBackDepth;
    uniform float glassTint, glassLine, glassBackLine, glowLift, haloStrength;
    uniform float contourLine, contourCos;
    uniform float castOn;
    uniform sampler2D tCastMask;            // blurred + re-thresholded shadow mask
    uniform float castSmoothOn, castPxScale;
    uniform sampler2D tStencilMask;         // stencil-volume mask, screen space
    uniform float stencilWobW;              // wobble amplitude in world units
    uniform sampler2D tSMask;               // MASK_PASS: R = shadow region, G = cast fill
    uniform sampler2D tShadeField;          // blurred continuous shade value
    uniform float shadeFieldOn;

    // ---- helpers -------------------------------------------------
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float vnoise(vec2 p) {              // value noise, for wobble + grain
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
                 mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
    }
    // vnoise plus its analytic gradient (same 4 hashes): x = value,
    // yz = d/dp. Needed where fwidth is unreliable (divergent loops).
    vec3 vnoiseG(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      vec2 du = 6.0 * f * (1.0 - f);
      float a = hash(i), b = hash(i + vec2(1,0)), c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
      float k = a - b - c + d;
      return vec3(mix(mix(a, b, u.x), mix(c, d, u.x), u.y),
                  (b - a + k * u.y) * du.x,
                  (c - a + k * u.x) * du.y);
    }
    float hash3(vec3 p) {
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
    }
    float vnoise3(vec3 p) {             // 3D value noise, for world-anchored pigment
      vec3 i = floor(p), f = fract(p);
      vec3 u = f * f * (3.0 - 2.0 * f);
      float a = mix(mix(hash3(i), hash3(i + vec3(1,0,0)), u.x),
                    mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), u.x), u.y);
      float b = mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), u.x),
                    mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), u.x), u.y);
      return mix(a, b, u.z);
    }
    // ---- cloud dome -------------------------------------------------
    // stereographic mapping shared by EVERY cloud consumer (compose
    // fill, line-pass rims, region view, glow occlusion) so the shapes
    // can never disagree. cloudStretch elongates features along
    // cloudDir; the mapping continues below the horizon so clouds wrap
    // all the way around, compressing toward the down-pole like a
    // vanishing point.
    vec2 cloudP(vec3 rd) {
      vec2 cp = rd.xz / (1.0 + max(rd.y, -0.98)) * cloudScale;
      float cA = cos(cloudDir), sA = sin(cloudDir);
      return vec2((cp.x * cA + cp.y * sA) / max(cloudStretch, 1.0),
                  -cp.x * sA + cp.y * cA);
    }
    float cloudBand(vec3 rd) {
      // only the stereographic singularity near straight-down is
      // masked; cloudFade > 0 restores the old horizon fade-in
      float band = smoothstep(-0.95, -0.75, rd.y);
      if (cloudFade > 0.001)
        band *= smoothstep(0.02, max(cloudFade, 0.04), max(rd.y, 0.0));
      return band;
    }
    // world position from the depth buffer — pigment must live ON the
    // surfaces, not on the picture plane, or it swims when the camera moves
    vec3 worldAt(vec2 uv) {
      float z = texture2D(tDepth, uv).x;
      vec4 w = invViewProj * vec4(uv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
      return w.xyz / w.w;
    }
    // one octave of zero-mean pigment noise, faded out once its features
    // shrink below a few pixels so distant surfaces don't shimmer
    float pigment(vec3 wp, float freq, float wpx) {
      return (vnoise3(wp * freq) - 0.5) *
             smoothstep(3.0, 10.0, 1.0 / max(freq * wpx, 1e-6));
    }
    float linDepth(vec2 uv) {           // linear view-space distance
      float z = texture2D(tDepth, uv).x;
      float ndc = z * 2.0 - 1.0;
      return (2.0 * cameraNear * cameraFar) /
             (cameraFar + cameraNear - ndc * (cameraFar - cameraNear));
    }
    // decodes renormalize: the buffers hold quantized bytes, so a
    // decoded normal is never quite unit length (the guard keeps a
    // degenerate opposite-pair finite)
    vec3 renorm(vec3 n) { return n * inversesqrt(max(dot(n, n), 1e-8)); }
    vec3 normalAt(vec2 uv) { return renorm(texture2D(tNormal, uv).xyz * 2.0 - 1.0); }
    // shade normal: the smoothed attachment when smooth shading is on,
    // the flat one otherwise (the JS binds whichever applies)
    vec3 snormalAt(vec2 uv) { return renorm(texture2D(tNormalS, uv).xyz * 2.0 - 1.0); }
    // the lighting term. When the shade-field path is active it reads a
    // screen-space BLURRED copy of the continuous shade value: Gouraud
    // lighting is piecewise-linear per triangle, so on coarse meshes the
    // hard-shade isoline snaps to per-triangle plateaus (staircase);
    // smoothing the field first makes the boundary PATH smooth while the
    // threshold afterwards keeps the edge razor-hard.
    float shadeAt(vec2 p) {
      return shadeFieldOn > 0.5 ? texture2D(tShadeField, p).r
           : clamp(dot(snormalAt(p), normalize(lightDir)), 0.0, 1.0);
    }
    float linDepthG(vec2 uv) {          // same, for the glass layer's depth
      float z = texture2D(tGlassDepth, uv).x;
      float ndc = z * 2.0 - 1.0;
      return (2.0 * cameraNear * cameraFar) /
             (cameraFar + cameraNear - ndc * (cameraFar - cameraNear));
    }
    float linDepthGB(vec2 uv) {         // and the glass BACK-face layer
      float z = texture2D(tGlassBackDepth, uv).x;
      float ndc = z * 2.0 - 1.0;
      return (2.0 * cameraNear * cameraFar) /
             (cameraFar + cameraNear - ndc * (cameraFar - cameraNear));
    }
    // RGSS: rotated-grid sub-pixel offsets. Only meaningful against
    // linearly-FILTERED inputs — in practice the shadow path's mask and
    // field textures (skelShadow uses the RG1/RG3 diagonal pair).
    // Against the nearest-filtered ID/depth/normal buffers all four
    // sub-positions (< 0.5px) snap to the SAME texels as the fixed
    // ±1-texel skeleton taps, so an RGSS average there returns four
    // identical values: the geometry and glass skeletons run a single
    // evaluation, and their coverage AA comes from the stroke stage's
    // half-texel recentering instead (see STAGE B).
    #define RG1 vec2(-0.375, -0.125)
    #define RG2 vec2( 0.125, -0.375)
    #define RG3 vec2( 0.375,  0.125)
    #define RG4 vec2(-0.125,  0.375)
    float lum(vec3 c) { return c.r + c.g + c.b; }

    // ---- paper tooth ------------------------------------------------
    // one octave of value noise reads as low-res fog, so the paper is a
    // small material model instead: a rotated two-octave fBm base, two
    // crossed anisotropic octaves for pressed-felt fiber direction, and
    // a band-passed fleck layer thresholded into discrete granules.
    // Still all value noise — no textures. Output stays ~[0,1] with a
    // ~0.5 mean so the existing amount math is unchanged.
    float paperTooth(vec2 sp) {
      vec2 p2 = mat2(0.8, -0.6, 0.6, 0.8) * sp;
      float base = vnoise(sp * 0.55) * 0.55 + vnoise(p2 * 1.13) * 0.30;
      float fib = vnoise(sp * vec2(0.23, 1.05) + 31.7)
                * vnoise(sp * vec2(1.05, 0.23) + 77.3);
      float bp = vnoise(sp * 0.9 + 13.1) - vnoise(sp * 1.02 + 57.9);
      float fleck = smoothstep(0.10, 0.22, bp);
      return clamp((base + fib * paperFiber) * 0.75 + fleck * paperFleck, 0.0, 1.0);
    }

    // ---- feature LOD --------------------------------------------
    // the ID buffer's alpha carries each shape's world size (log
    // encoded). Divided by distance it gives the shape's apparent
    // size as a FRACTION of screen height — not pixels, so the
    // result is identical in the interactive 1x frame and the
    // refined supersampled one. Callers divide 'dist' by the facet's
    // view-space |n.z| (clamped) so the gate acts on the PROJECTED
    // size: a floor grate at a grazing angle compresses sub-pixel far
    // sooner than its radial distance implies, and un-gated sub-pixel
    // ink is exactly what shimmers.
    float lodGain(float enc, float dist) {
      if (minFeature <= 0.0) return 1.0;
      float frac = exp2(enc * 15.0 - 7.0) * invFovScale / max(dist, 1e-4);
      return smoothstep(minFeature, minFeature * 2.0, frac);
    }

    // ink contributed toward ONE neighbor. In one-sided mode the line
    // only draws on the NEARER surface (or, for coplanar seams, on the
    // arbitrarily-but-consistently brighter face) — halving line width
    // for free. The LOD gain uses the SMALLER of the two shapes the
    // edge separates, so a shrinking detail fades away completely
    // rather than leaving an outline around nothing.
    float dirInk(vec4 c, vec2 uv, vec2 su, float dC, float gC, vec3 nC) {
      vec4 cn = texture2D(tID, su);
      float diff = distance(c.rgb, cn.rgb);
      if (diff <= 0.0) return 0.0;
      float ink = smoothstep(idThreshold, idThreshold * 1.8, diff);
      if (ink <= 0.0) return 0.0;
      // soft-root contact suppression: if either side carries the soft
      // flag (ID red LSB), predict the neighbor's depth from this
      // pixel's tangent plane and fade the line where actual depth
      // matches the prediction — surfaces in geometric contact lose
      // their line, true occlusion silhouettes keep it. The tolerance
      // scales with depth and slope, so unlike a raw depth threshold
      // it reads identically at every distance.
      if (softContact > 0.0) {
        float fS = max(mod(floor(c.r * 255.0 + 0.5), 2.0),
                       mod(floor(cn.r * 255.0 + 0.5), 2.0));
        if (fS > 0.5) {
          float tanH = 0.5 / invFovScale;
          vec2 Tv = vec2(tanH * resolution.x / resolution.y, tanH);
          vec3 rayC = vec3((uv * 2.0 - 1.0) * Tv, -1.0);
          vec3 rayN = vec3((su * 2.0 - 1.0) * Tv, -1.0);
          float dN = linDepth(su);
          // the line paints pixels on BOTH sides of the boundary, so
          // test the crossing from both planes and take the stronger
          // suppression — a grazing plane (tiny denominator) on one
          // side can't unsuppress what the other side confirms
          // tolerance = a relative-depth floor plus ~3 PIXELS of the
          // predicting surface's own depth slope (capped so distant
          // silhouettes are never eaten). The slope term is what makes
          // a grazing ground generous: an overhanging base edge sits a
          // big along-ray gap from the sand behind it, but only a
          // couple of pixels from the contact curve — perceptually
          // that IS contact, and pixels are distance-independent.
          float fade = 1.0;
          float denC = dot(nC, rayN);
          if (abs(denC) > 0.08) {
            float dExp = dot(nC, rayC) * (dC / denC);
            float tol = (dC * 0.012 + min(3.0 * abs(dExp - dC), dC * 0.08)) * softContact;
            fade = min(fade, smoothstep(tol, tol * 2.5, abs(dN - dExp)));
          }
          vec3 nN = normalAt(su);
          float denN = dot(nN, rayC);
          if (abs(denN) > 0.08) {
            float dExp = dot(nN, rayN) * (dN / denN);
            float tol = (dN * 0.012 + min(3.0 * abs(dExp - dN), dN * 0.08)) * softContact;
            fade = min(fade, smoothstep(tol, tol * 2.5, abs(dC - dExp)));
          }
          // the artist's rule on top of the geometric one: near the
          // ground, ink simply fades out (the reference taper). Round-
          // bottomed roots hide their true contact under the bulge, so
          // the visible silhouette IS separated from the sand — the
          // plane test rightly keeps it, but the look wants it gone.
          // World height is view- and distance-independent.
          float hMax = max(worldAt(uv).y, worldAt(su).y) - groundY;
          fade = min(fade, smoothstep(0.15 * softContact, 0.9 * softContact, hMax));
          ink *= fade;
          if (ink <= 0.0) return 0.0;
        }
      }
      if (oneSided > 0.5 || minFeature > 0.0) {
        float dN = linDepth(su);
        float eps = 0.012 * dC + 0.02;
        if (oneSided > 0.5) {
          bool keep = (dN > dC + eps) || (abs(dN - dC) <= eps && lum(c.rgb) > lum(cn.rgb));
          if (!keep) return 0.0;
        }
        // an edge with a big depth step across it is a silhouette —
        // optionally exempt, so distant objects keep an outline.
        // nC's |z| carries the caller's grazing compression (adjacent
        // pixels share the surface, so the center normal is a fine
        // proxy for the neighbor's projection factor)
        bool sil = abs(dN - dC) > eps;
        if (minFeature > 0.0 && !(keepSil > 0.5 && sil))
          ink *= min(gC, lodGain(cn.a, dN / max(abs(nC.z), 0.05)));
      }
      return ink;
    }
    // self-overlap contour: inside a single region the ID colors agree
    // across a fold, but the visible surface orientation jumps
    // discontinuously — smooth interiors step by fractions of a degree
    // per pixel and never reach the angle threshold
    float contourTest(vec2 uv, vec2 o) {
      vec3 n = normalAt(uv);
      float dmin = dot(n, normalAt(uv + vec2(o.x, 0.)));
      dmin = min(dmin, dot(n, normalAt(uv - vec2(o.x, 0.))));
      dmin = min(dmin, dot(n, normalAt(uv + vec2(0., o.y))));
      dmin = min(dmin, dot(n, normalAt(uv - vec2(0., o.y))));
      return smoothstep(contourCos, contourCos - 0.15, dmin);
    }
    // the whole face-ID detector, callable at sub-pixel offsets.
    // smoothstep is monotonic, so thresholding per direction and then
    // taking the max is identical to the other order — it just lets
    // each direction carry its own LOD gain.
    float inkTest(vec2 uv, vec2 o, float dC) {
      vec4 c = texture2D(tID, uv);
      // centre normal: the soft-root plane test needs it, and the LOD's
      // grazing term reads its view-space |z| (normal pass is
      // guaranteed on whenever either is active)
      vec3 nC = (softContact > 0.0 || minFeature > 0.0)
              ? normalAt(uv) : vec3(0.0, 0.0, 1.0);
      float gC = lodGain(c.a, dC / max(abs(nC.z), 0.05));
      float d =        dirInk(c, uv, uv + vec2(o.x, 0.), dC, gC, nC);
      d = max(d, dirInk(c, uv, uv - vec2(o.x, 0.), dC, gC, nC));
      d = max(d, dirInk(c, uv, uv + vec2(0., o.y), dC, gC, nC));
      d = max(d, dirInk(c, uv, uv - vec2(0., o.y), dC, gC, nC));
      // self-overlap contours ride the same LOD gain as the region's
      // lines — but only on objects that opted in (ID green LSB):
      // hard-surface machinery has no self-overlap, and folds there are
      // real face boundaries the ID test already inks
      if (contourLine > 0.0 && mod(floor(c.g * 255.0 + 0.5), 2.0) > 0.5)
        d = max(d, contourTest(uv, o) * contourLine * gC);
      return d;
    }

    // cast-shadow test: the screen-space stencil-volume mask, sampled at
    // this pixel. The lookup is wobbled by the same surface-anchored
    // noise the shade boundary uses, so cast shapes read as hand-painted.
    // Returns 1 = blocked. This is the BINARY membership test — it feeds
    // shadowMaskAt, which steps it anyway, so the shadow-line skeleton
    // stays pinned to the 50% crossing. The compose FILL must use
    // castAtAA below instead: a single bilinear tap at a texel center
    // returns the raw binary mask value (there is no ramp for a
    // re-hardening smoothstep to re-harden), so building the fill on
    // this test rendered every cast-shadow edge as a hard per-pixel
    // stair — the aliasing that survived the line-pass coverage fix.
    //
    // wobble is in screen UV, amplitude anchored to a fixed WORLD size at
    // this pixel's depth (worldSize * invFov / viewZ = UV along y). The
    // vnoise3 pair only runs when the dial is up — at the default
    // shadeNoise 0 it produced ~16 hash evaluations that were multiplied
    // by zero and discarded, in the hottest helper.
    vec2 castWobble(vec2 p, vec3 w) {
      if (shadeNoise <= 0.0) return vec2(0.0);
      float hnfS = 0.35 / shadeNoiseScale;
      vec2 wob = (vec2(vnoise3(w * hnfS), vnoise3(w * hnfS + 40.0)) - 0.5)
               * shadeNoise * stencilWobW * invFovScale / max(linDepth(p), 0.2);
      wob.x *= resolution.y / resolution.x;
      return wob;
    }
    float castAt(vec2 p, vec3 w) {
      if (castOn < 0.5) return 0.0;
      return step(0.5, texture2D(tStencilMask, p + castWobble(p, w)).r);
    }
    // compose-fill variant: SUB-PIXEL EDGE COVERAGE. The hard shade
    // mode deliberately joins the cast term by max OUTSIDE its step so
    // an antialiased edge fraction survives — this supplies one. 4
    // bilinear taps at the pixel's quarter-diagonal corners average to a
    // 3x3 tent of the binary mask — a ~2px ramp (0, .25, .75, 1 across a
    // straight edge) that matches the ink lines' soft profile and grades
    // along diagonal stairs.
    float castAtAA(vec2 p, vec3 w) {
      if (castOn < 0.5) return 0.0;
      vec2 q = p + castWobble(p, w);
      vec2 h = 0.5 / resolution;
      return 0.25 * (texture2D(tStencilMask, q + h).r
                   + texture2D(tStencilMask, q - h).r
                   + texture2D(tStencilMask, q + vec2(h.x, -h.y)).r
                   + texture2D(tStencilMask, q + vec2(-h.x, h.y)).r);
    }

    // smoothed-silhouette path: the blurred + re-thresholded mask field.
    // The 50% level-set of a smooth field is a smooth curve — small
    // features are gone and corners are rounded before we ever get here;
    // the narrow band just re-hardens the edge with ~a pixel of AA.
    float castMaskAt(vec2 p) {
      // AA band from the melt's per-pixel on-screen radius (G channel =
      // contact-hardening radius / uMaxR, blurred along with the mask):
      // the re-hardening band has to track the blur that made the field
      // (band ~ 1.2/r), per pixel now that the radius varies per shadow
      vec4 cm = texture2D(tCastMask, p);
      float rpx = clamp(cm.g * castPxScale / max(linDepth(p), 1e-3), 3.0, 66.0);
      float band = min(0.45, 1.2 / rpx);
      return smoothstep(0.5 - band, 0.5 + band, cm.r);
    }

    // the shading test as a reusable mask, so shadow boundaries can be
    // edge-detected exactly like the face-ID buffer: evaluate at neighbor
    // taps, any disagreement is a line. Includes the cast term, so cast
    // shadow shapes get ink outlines from the same detector.
    float shadowMaskAt(vec2 p) {
      vec3 w = worldAt(p);
      float castS = castSmoothOn > 0.5 ? castMaskAt(p) : castAt(p, w);
      // hard mode on the smoothed path: the melt mask already contains
      // the terminator — re-deriving it here would ink the jagged
      // per-facet edge instead of the rounded one
      if (castSmoothOn > 0.5 && softShade < 0.5)
        return step(0.5, castS);
      // unlit surfaces have no terminator — their mask is cast-only,
      // so shadow shapes still get outlines on flat paper grounds
      if (mod(floor(texture2D(tID, p).b * 255.0 + 0.5), 2.0) > 0.5)
        return step(0.5, castS);
      float shade = shadeAt(p);
      shade = min(shade, 1.0 - castS);
      float sn = shadeNoise > 0.0
        ? (vnoise3(w * (0.35 / shadeNoiseScale)) - 0.5) * shadeNoise * 0.3 : 0.0;
      return step(shade + sn, shadeThreshold);
    }

    // ---- ground speckle membership ------------------------------
    // which blob (if any) owns a point on the ground sheet. The blob's
    // lattice cell is its IDENTITY — for the line detector a speckle is
    // just another region, like a face color in the ID buffer. r is the
    // normalized radial distance to the nearest blob (r < 1 = inside);
    // rx and the per-blob rim strength ride along for the fill/rim.
    struct Blob { float r; vec2 grad; };
    Blob speckleBlobAt(vec2 scc) {
      vec2 sCell = floor(scc);
      Blob b; b.r = 1e5; b.grad = vec2(0.0);
      for (int cy = -1; cy <= 1; cy++)
      for (int cx = -1; cx <= 1; cx++) {
        vec2 c = sCell + vec2(float(cx), float(cy));
        vec3 h = fract(sin(vec3(dot(c, vec2(127.1, 311.7)),
                                dot(c, vec2(269.5, 183.3)),
                                dot(c, vec2(419.2, 371.9)))) * 43758.5453);
        // patchy scatter: low-freq noise makes some stretches of
        // sand busy and others bare instead of an even grid
        float patchy = smoothstep(0.2, 0.8, vnoise(c * 0.37 + 9.1));   // 'patch' is a GLSL reserved word
        if (h.z > speckleAmt * 1.5 * patchy) continue;
        vec2 ctr = c + 0.2 + h.xy * 0.6;    // jittered centre
        // long-tailed sizes: mostly small flecks, the odd big lozenge
        float u2 = fract(h.z * 9.7);
        float rx = 0.03 + 0.17 * u2 * u2;
        float ry = rx * (0.45 + 0.4 * fract(h.x * 5.1));   // aspect
        // random orientation
        float sAng = h.x * 6.2832;
        float ca = cos(sAng), sa = sin(sAng);
        vec2 dd = scc - ctr;
        dd = vec2(dd.x * ca - dd.y * sa,
                  dd.x * sa + dd.y * ca);
        vec2 d = dd / vec2(rx, ry);
        // domain-warp the rim so each blob is a lumpy potato,
        // not a perfect ellipse (gradient version — see below)
        vec3 w1 = vnoiseG(scc * 6.0 + h.y * 43.0);
        vec3 w2 = vnoiseG(scc * 6.0 + h.z * 91.0);
        d += (vec2(w1.x, w2.x) - 0.5) * 0.9;
        float r = length(d);
        if (r < b.r) {
          b.r = r;
          // EXACT analytic gradient of r in scc units:
          // d = S^-1 R (scc - ctr) + W(scc), so
          // grad r = R^T S^-1 d-hat + J_W^T d-hat, with the warp
          // Jacobian rows = 0.9 * 6 * vnoiseG gradients. Skipping the
          // warp term made big blobs' rims vary up to ~2x in width
          // (the warp slope rivals the ellipse slope when rx is large).
          vec2 dh = d / max(r, 1e-4);
          vec2 gs = vec2(dh.x / rx, dh.y / ry);
          b.grad = vec2(gs.x * ca + gs.y * sa, -gs.x * sa + gs.y * ca)
                 + 5.4 * (w1.yz * dh.x + w2.yz * dh.y);
        }
      }
      return b;
    }

#ifdef SKEL_PASS
    // one geometry-skeleton detection at position p: forward +x/+y
    // taps from BOTH sides' perspectives (union = the old detector's
    // keep/LOD/soft-contact semantics; the neighbor-perspective eval
    // keeps skylines alive despite the sky side's meaningless LOD
    // data), plus the self-overlap contour. Evaluated ONCE per pixel:
    // every input is nearest-filtered and the taps are fixed at ±1
    // texel, so RGSS sub-offsets read identical texels — coverage AA
    // for these boundaries lives in the stroke stage's recentering.
    float skelGeo(vec2 p, float dCp) {
      vec2 px2 = 1.0 / resolution;
      vec4 c = texture2D(tID, p);
      // the normal doubles as the LOD's grazing term (|n.z| divides the
      // distance so lodGain gates on projected size), so it's fetched
      // whenever either consumer is active
      vec3 nC = (softContact > 0.0 || minFeature > 0.0)
              ? normalAt(p) : vec3(0.0, 0.0, 1.0);
      float gC = lodGain(c.a, dCp / max(abs(nC.z), 0.05));
      bool skyC = dCp > cameraFar * 0.99;
      float ink = 0.0;
      for (int i = 0; i < 2; i++) {
        vec2 su = i == 0 ? p + vec2(px2.x, 0.0) : p + vec2(0.0, px2.y);
        if (!skyC)
          ink = max(ink, dirInk(c, p, su, dCp, gC, nC));
        float dN = linDepth(su);
        if (dN < cameraFar * 0.99) {
          vec4 cn = texture2D(tID, su);
          vec3 nN = (softContact > 0.0 || minFeature > 0.0)
                  ? normalAt(su) : vec3(0.0, 0.0, 1.0);
          ink = max(ink, dirInk(cn, su, p, dN,
                    lodGain(cn.a, dN / max(abs(nN.z), 0.05)), nN));
        }
      }
      if (!skyC && contourLine > 0.0 && mod(floor(c.g * 255.0 + 0.5), 2.0) > 0.5) {
        vec3 n = normalAt(p);
        float dmin = min(dot(n, normalAt(p + vec2(px2.x, 0.0))),
                         dot(n, normalAt(p + vec2(0.0, px2.y))));
        ink = max(ink, smoothstep(contourCos, contourCos - 0.15, dmin)
                     * contourLine * gC);
      }
      return ink;
    }
    float skelGlassF(vec2 p) {          // glass front-face boundaries
      vec2 px2 = 1.0 / resolution;
      vec3 gc = texture2D(tGlassID, p).rgb;
      float gd = max(distance(gc, texture2D(tGlassID, p + vec2(px2.x, 0.0)).rgb),
                     distance(gc, texture2D(tGlassID, p + vec2(0.0, px2.y)).rgb));
      return smoothstep(idThreshold, idThreshold * 3.0, gd);
    }
    float skelGlassBk(vec2 p) {         // glass back-face boundaries
      vec2 px2 = 1.0 / resolution;
      vec3 gc = texture2D(tGlassBackID, p).rgb;
      float gd = max(distance(gc, texture2D(tGlassBackID, p + vec2(px2.x, 0.0)).rgb),
                     distance(gc, texture2D(tGlassBackID, p + vec2(0.0, px2.y)).rgb));
      return smoothstep(idThreshold, idThreshold * 3.0, gd);
    }
    // shadow-boundary skeleton: forward diffs of the MATERIALIZED mask
    // (tSMask R, computed once per pixel by the MASK_PASS — previously
    // each probe re-derived shadowMaskAt, the priciest helper in the
    // shader, ~6x per pixel with coverage on). tSMask is linear-
    // filtered, so RGSS sub-offset reads interpolate the binary R and
    // the step re-binarizes at the true 0.5 crossing — sub-sample
    // diversity survives on plain texture reads. Probes are vUv-based:
    // the mask pass already applied the wobble, once.
    float skelShadow(vec2 p) {
      vec2 px2 = 1.0 / resolution;
      float m0 = step(0.5, texture2D(tSMask, p).r);
      vec2 so = px2 * shadowLineWidth * ssScale;   // display px -> texels
      float sl =      abs(step(0.5, texture2D(tSMask, p + vec2(so.x, 0.0)).r) - m0);
      return max(sl, abs(step(0.5, texture2D(tSMask, p + vec2(0.0, so.y)).r) - m0));
    }
#endif

    void main() {
      vec2 px = 1.0 / resolution;

      // hand-drawn wobble: perturb WHERE we look, so every line inherits it
      vec2 uv = vUv;
      if (wobbleAmp > 0.0) {
        // both amplitude and frequency are display-pixel anchored, the
        // same way paperTooth's grain is, so a supersampled still keeps
        // the hand-drawn character instead of shrinking it
        vec2 wp = vUv * resolution * wobbleFreq / ssScale;
        uv += (vec2(vnoise(wp), vnoise(wp + 71.3)) - 0.5) * wobbleAmp * ssScale * 2.0 * px;
      }

      float dC = linDepth(uv);
      bool sky = dC > cameraFar * 0.99;

      // line width in pixels, attenuated with distance so far detail
      // collapses into fine lines instead of mush. Falloff 0..1 blends
      // width thinning (original behavior); 1..3 additionally fades
      // distant ink toward paper, past the width floor.
      // ssScale converts DISPLAY pixels to render-target texels: every
      // width below is measured in texels, so without it a supersampled
      // frame would draw every line thinner than the 1x frame it refines
      float atten = mix(1.0, clamp(14.0 / dC, 0.25, 1.6), min(distanceFalloff, 1.0));
      float w = ssScale * max(lineWidth * atten, 0.5);
      vec2 o = px * w;

      // world anchor shared by the shade noise and the pigment: surface
      // position from the depth buffer, and the world size of one pixel there
      vec3 wp = worldAt(uv);
      float wpx = dC / (invFovScale * resolution.y);

#ifdef MASK_PASS
      // ============== THE SHADOW-MASK PASS =========================
      // shadowMaskAt and the compose's cast fill are pure functions of
      // pixel position, but were re-derived up to ~7x per pixel across
      // the skeleton's probes and the compose branches. Computed ONCE
      // here instead: R = the binary shadow-region mask (the line
      // detector and domain view step it at 0.5), G = the compose
      // fill's cast term (the melt mask when melting, castAtAA's
      // sub-pixel coverage otherwise). The wobble is applied here,
      // once — every consumer reads at vUv-based coordinates.
      // (#else, not a return: the compose branch reads tSMask, and if it
      // compiled into THIS program the sampler would alias the render
      // target — a draw-time feedback error that code reachability
      // does not excuse)
      gl_FragColor = vec4(shadowMaskAt(uv),
        castSmoothOn > 0.5 ? castMaskAt(uv) : castAtAA(uv, wp), 0.0, 1.0);
#else
#ifdef LINE_PASS
      // ================= THE LINE PASS =============================
      // every ink line in the image — geometry edges, glass edges,
      // shadow boundaries, speckle rims — drawn here by ONE detector
      // with one width/attenuation/wobble/AA rule, into
      // R = main ink, G = glass front edge, B = glass back edge.
      // The compose pass only reads the result: line families cannot
      // drift apart because there is nowhere else to draw one.

#ifdef DOMAIN_VIEW
      // ---- REGION DOMAIN VIEW ------------------------------------
      // the complete "coloring book" the detector runs on, sampled at
      // the same wobbled uv: every color boundary in this view is
      // where a line gets drawn. Compiled from the SAME source as the
      // line pass, so it cannot drift from what the detector sees.
      vec3 dom;
      if (sky) {
        dom = skyColor;
        if (colorOn > 0.5) {
          vec2 dndc = uv * 2.0 - 1.0;
          vec4 dra = invViewProj * vec4(dndc, -1.0, 1.0);
          vec4 drb = invViewProj * vec4(dndc, 1.0, 1.0);
          vec3 drd = normalize(drb.xyz / drb.w - dra.xyz / dra.w);
          if (sunSize > 0.0 && dot(drd, sunDir) > cos(sunSize)) dom = sunColor;
          if (cloudAmt > 0.0 && cloudBand(drd) > 0.5) {
            vec2 dcp = cloudP(drd);
            float dn = vnoise(dcp) * 0.65 + vnoise(dcp * 2.7 + 19.1) * 0.35;
            if (dn > 1.0 - cloudAmt * 0.42) dom = vec3(0.985);
          }
        }
      } else {
        dom = texture2D(tID, uv).rgb;
        // shadow region: same gates as the shadow-boundary ink,
        // read from the materialized mask (vUv: wobble applied there)
        if (shadeOn > 0.5 && shadowLine > 0.0 &&
            texture2D(tSMask, vUv).r > 0.5) dom *= 0.55;
        // speckle blob region: same gates as the rims
        if (speckleAmt > 0.0) {
          vec3 dwn = viewToWorldN * normalAt(uv);
          if (dwn.y > 0.85 && abs(wp.y - groundY) < 0.6 &&
              speckleBlobAt(wp.xz / (3.2 * speckleSize)).r < 1.0)
            dom = mix(dom, vec3(1.0), 0.75);
        }
      }
      // glass layer on top (front-face IDs), where it wins the depth test
      if (linDepthG(uv) < dC * 0.999)
        dom = mix(dom, texture2D(tGlassID, uv).rgb, 0.45);
      gl_FragColor = vec4(dom, 1.0);
      return;
#endif

#ifdef SKEL_PASS
      // ================ STAGE A: THE SKELETON ======================
      // find every boundary at 1-PIXEL precision and record only its
      // STRENGTH — no widths here. The stroke stage below dilates this
      // skeleton with a round nib, so line thickness is exact in every
      // direction for every family. Boundaries are detected between a
      // pixel and its +x / +y neighbors from BOTH sides' perspectives
      // (union = the old detector's keep/LOD/soft-contact semantics,
      // and skylines survive the sky side's meaningless LOD data).
      // ---- face-ID boundaries ------------------------------------
      // ONE evaluation, deliberately no RGSS: tID/tDepth/tNormal are
      // nearest-filtered and skelGeo's taps are fixed at ±1 texel, so
      // the four < 0.5px sub-offsets snap to identical texels and the
      // average was four copies of the same value (measured no-op at
      // 4x the cost). The partial-coverage grays come from the stroke
      // stage instead: it recenters this 1px skeleton onto the
      // boundary and spreads it across the texel pair bilinearly.
      float ink = skelGeo(uv, dC);

      // ---- shadow boundaries -------------------------------------
      // shadowLineWidth scales the probe (≈ extra width after
      // stroking, exact no-op at 1). Probes read the materialized mask
      // at vUv-based positions — the mask pass already applied the
      // wobble; probing at the wobbled uv would apply it twice. FULL
      // 4-sample RGSS: now that each sample is a texture read (the old
      // 2-sample pair existed because re-deriving shadowMaskAt 4x cost
      // ~2 ms), diagonal shadow lines get 5-level coverage again.
      if (shadeOn > 0.5 && !sky && shadowLine > 0.0) {
        float sl = coverage > 0.5
          ? 0.25 * (skelShadow(vUv + px * RG1) + skelShadow(vUv + px * RG2)
                  + skelShadow(vUv + px * RG3) + skelShadow(vUv + px * RG4))
          : skelShadow(vUv);
        // lamps have no terminator to outline
        ink = max(ink, sl * shadowLine * texture2D(tPaint, uv).a);
      }

      // ---- speckle rims + fill -----------------------------------
      float sfill = 0.0;   // blob interior coverage -> alpha channel
      if (speckleAmt > 0.0 && !sky) {

          // screen-space Jacobian of the ground sheet (two depth taps)

          vec2 sdx = (worldAt(uv + vec2(px.x, 0.0)).xz - wp.xz) / sCellW;

// flow: wiggles round off, large shapes barely move)

  uniforms: { tDiffuse: { value: null }, uBand: { value: 0.15 } },

  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uBand;

  depthTest: false, depthWrite: false,
});

// FIELD before the compose thresholds it. G carries the ORGANIC class
// bit (ID blue bit 2) so the blur picks its radius per pixel.

  uniforms: {
    tNormal: { value: null }, tID: { value: null },
    lightDir: { value: new THREE.Vector3() },

  vertexShader: blitVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tNormal, tID;
    uniform vec3 lightDir;
    void main() {
      vec3 n = texture2D(tNormal, vUv).xyz * 2.0 - 1.0;
      n *= inversesqrt(max(dot(n, n), 1e-8));   // int8 decode, renormalized
      float bb = texture2D(tID, vUv).b;
      float org = mod(floor(bb * 255.0 + 0.5) / 4.0, 2.0) >= 1.0 ? 1.0 : 0.0;

  depthTest: false, depthWrite: false,

// per-class variable blur: the 9-tap gaussian with its step chosen by
// the CENTER pixel's class — organic radius for plants/terrain, hard
// radius (default 0 = identity) for machinery. G passes through so the
// second axis still knows the class.
const shadeBlurMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null }, uAxis: { value: new THREE.Vector2() },
    uOrgStep: { value: 0 }, uHardStep: { value: 0 },

  vertexShader: blitVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform vec2 uAxis;
    uniform float uOrgStep, uHardStep;
    void main() {
      vec4 c0 = texture2D(tDiffuse, vUv);

      r += (texture2D(tDiffuse, vUv + d).r       + texture2D(tDiffuse, vUv - d).r)       * 0.194;
      r += (texture2D(tDiffuse, vUv + d * 2.0).r + texture2D(tDiffuse, vUv - d * 2.0).r) * 0.121;
      r += (texture2D(tDiffuse, vUv + d * 3.0).r + texture2D(tDiffuse, vUv - d * 3.0).r) * 0.054;

const dbgClassMat = new THREE.ShaderMaterial({
  uniforms: {
    tID: { value: null }, tDepth: { value: null },
    cameraNear: { value: 0.1 }, cameraFar: { value: 1000 },

  vertexShader: blitVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tID, tDepth;

const dbgDepthMat = new THREE.ShaderMaterial({
  uniforms: {
    tDepth: { value: null },
    cameraNear: { value: 0.1 }, cameraFar: { value: 1000 },

  vertexShader: blitVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDepth;
    uniform float cameraNear, cameraFar;
    void main() {
      float ndc = texture2D(tDepth, vUv).x * 2.0 - 1.0;

// the COMPLETE ink sheet: rtLines resolved exactly the way the compose
// consumes it — R plus the glass channels at their slider strengths
// under the same depth gating — shown as black lines on white paper
const dbgInkMat = new THREE.ShaderMaterial({
  uniforms: {
    tLines: { value: null }, tDepth: { value: null },
    tGlassDepth: { value: null }, tGlassBackDepth: { value: null },
    cameraNear: { value: 0.1 }, cameraFar: { value: 1000 },
    glassLine: { value: 1 }, glassBackLine: { value: 0.4 },

  vertexShader: blitVert,
  fragmentShader: /* glsl */`
    precision highp float;

    void main() {
      vec4 l = texture2D(tLines, vUv);

const blitScene = new THREE.Scene();

/* ============================================================
   Minimal orbit controls (no examples/jsm dependency)
   ============================================================ */
// radius/target are placeholders: frameScene() fits them to whatever
// the scene actually contains as soon as this section is reached
const orbit = { theta: 0.8, phi: 1.12, radius: 46, target: new THREE.Vector3(0, 5, 0) };
cameraReady = true;
frameScene();
// free-flight state. yaw 0 looks down -z, matching three's default camera;
// pitch is positive looking up.
const fly = { pos: new THREE.Vector3(), yaw: 0, pitch: 0 };
// third-person chase camera: same spherical convention as orbit, but the
// target eases after the player instead of being dragged directly
const chase = { theta: 0.8, phi: 1.15, dist: P.camDist };
const camTarget = new THREE.Vector3();
let camEasing = false;
const keys = new Set();
const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _at = new THREE.Vector3();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function flyForward(out) {
  const cp = Math.cos(fly.pitch);
  return out.set(-Math.sin(fly.yaw) * cp, Math.sin(fly.pitch), -Math.cos(fly.yaw) * cp);
}
// switching modes must not move the view: entering flight adopts the orbit
// camera's exact position and heading; leaving it drops the orbit target
// straight ahead at the current radius, which reproduces the same frame.
function syncCameraMode(toFly) {
  if (toFly) {
    fly.pos.copy(camera.position);
    _at.subVectors(orbit.target, camera.position).normalize();
    fly.pitch = Math.asin(clamp(_at.y, -1, 1));
    fly.yaw = Math.atan2(-_at.x, -_at.z);
  } else {
    orbit.target.copy(fly.pos).addScaledVector(flyForward(_fwd), orbit.radius);
    _at.subVectors(fly.pos, orbit.target);
    const r = _at.length() || 1;
    orbit.phi = clamp(Math.acos(clamp(_at.y / r, -1, 1)), 0.08, Math.PI / 2 - 0.02);
    orbit.theta = Math.atan2(_at.x, _at.z);
  }
}

let flyBox = null, inFly = false;
let playerBox = null, inPlayer = false;
function refreshHint() {
  const h = document.getElementById('hint');
  if (h) h.textContent = P.playerMode
    ? 'wasd = move · e = mount/dismount · shift = run · drag = orbit cam · wheel = zoom · p = exit'
    : P.flyMode
      ? 'wasd = move · q/e = down/up · shift = fast · drag = look · wheel = dolly · f = orbit'
      : 'drag = orbit · shift-drag = pan · wheel = zoom · drop .obj to load · f = fly · p = player';
}
function setFlyMode(on) {
  on = !!on;
  if (on && P.playerMode) setPlayerMode(false);   // modes are exclusive
  P.flyMode = on;
  if (on === inFly) return;               // already there; don't re-sync the view
  syncCameraMode(on);                     // read the OLD mode's camera first
  inFly = on;
  if (flyBox) flyBox.checked = on;
  keys.clear();
  refreshHint();
  markDirty();
}
// entering player mode seeds the chase orbit from wherever the camera is
// so the cut is seamless; leaving hands the pose back to orbit, focused
// where the player was — the same no-jump contract as fly<->orbit.
function seedChaseFromCamera() {
  const focus = player.state === 'riding' ? bike.pos : player.pos;
  camTarget.set(focus.x, focus.y + P.camHeight, focus.z);
  _at.subVectors(camera.position, camTarget);
  const r = _at.length() || 1;
  // direction comes from the current camera (no view jump), but the
  // DISTANCE zooms straight in: close enough that the character fills
  // ~85% of the view height, instead of inheriting a wide orbit radius
  const frameH = 2.0 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5);
  chase.dist = clamp(1.9 / (0.85 * frameH), 2.5, 40);
  P.camDist = chase.dist;
  chase.phi = clamp(Math.acos(clamp(_at.y / r, -1, 1)), 0.15, Math.PI / 2 - 0.02);
  chase.theta = Math.atan2(_at.x, _at.z);
}
function setPlayerMode(on) {
  on = !!on;
  P.playerMode = on;
  if (on === inPlayer) { if (playerBox) playerBox.checked = on; return; }
  if (on) {
    if (P.flyMode) setFlyMode(false);
    spawnActors();
    seedChaseFromCamera();
  } else {
    const focus = player.state === 'riding' ? bike.pos : player.pos;
    orbit.target.set(focus.x, focus.y + P.camHeight, focus.z);
    orbit.theta = chase.theta; orbit.phi = chase.phi; orbit.radius = chase.dist;
  }
  inPlayer = on;
  if (playerBox) playerBox.checked = on;
  keys.clear();
  refreshHint();
  markDirty();
}

const typingIn = t => t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
addEventListener('keydown', e => {
  if (typingIn(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') { setFlyMode(!P.flyMode); return; }
  if (k === 'p') { setPlayerMode(!P.playerMode); return; }
  if (P.playerMode && k === 'e') { if (!e.repeat) tryMountToggle(); return; }
  if ('wasdqe'.includes(k) && k.length === 1) { keys.add(k); markDirty(); }
  if (k === 'shift') keys.add('shift');
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys.delete(k === 'shift' ? 'shift' : k);
});
addEventListener('blur', () => keys.clear());   // don't fly off when focus leaves

let dragging = false, panning = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; panning = e.shiftKey || e.button === 2; lx = e.clientX; ly = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  if (P.playerMode) {                    // orbit the chase camera around the player
    chase.theta -= dx * 0.005;
    chase.phi = clamp(chase.phi - dy * 0.005, 0.15, Math.PI / 2 - 0.02);
  } else if (P.flyMode) {                // drag to look; same sign as orbit
    fly.yaw -= dx * 0.004;
    fly.pitch = clamp(fly.pitch - dy * 0.004, -1.5, 1.5);
  } else if (panning) {
    const s = orbit.radius * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    orbit.target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
  } else {
    orbit.theta -= dx * 0.005;

renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();

    chase.dist = clamp(chase.dist * (1 + Math.sign(e.deltaY) * 0.09), 2.5, 40);
    P.camDist = chase.dist;              // the slider tracks the wheel
  } else if (P.flyMode) {                // dolly along the view, so the wheel
    const step = flySpeedUnits() * 0.35; // still reads as "zoom"
    fly.pos.addScaledVector(flyForward(_fwd), -Math.sign(e.deltaY) * step);
