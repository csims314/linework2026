import * as THREE from 'three';

/* ============================================================
   Params — everything the control panel drives
   ============================================================ */
const P = {
  // edge extraction — face-ID only: every face boundary is a line
  idThreshold: 0.005,
  // region grouping: neighbors that share a color draw no line between them
  regionGroup: true, similarity: 0.5,
  // debug: draw the face-ID buffer itself instead of the ink
  showIDs: false,
  // feature LOD: fade a line when the shapes it separates are small on screen.
  // minFeature is a % of screen height; 0 disables the whole feature.
  minFeature: 0.4, lodMetric: 'area', lodUnit: 'region', keepSilhouettes: false,
  // near plane as a fraction of the orbit distance — raise it to buy depth
  // precision (less z-fighting), lower it if close geometry starts clipping
  nearFactor: 0.02,
  // drop loaded-model faces sealed inside another part (assembled models)
  cullBuried: false,
  // line look
  lineWidth: 0.5, distanceFalloff: 1.25,
  wobbleAmp: 1.1, wobbleFreq: 0.08,
  // hatching
  hatchOn: false, hatchThreshold: 0.0, crossThreshold: 0.02,
  hatchSpacing: 10.0, hatchWidth: 0.05, hatchAngle: 45,
  // colors
  inkColor: '#1d1a17', paperColor: '#f6f2e6', paperGrain: 0.05,
  // watercolor (raster mode only): per-kind fills baked at rebuild,
  // wash/pooling/tint/fade applied in the compose step. colorOn off
  // must render pixel-identical to the pre-color build.
  colorOn: true, skyColor: '#d8efec',
  washAmount: 0.09, poolAmount: 0.01, inkTint: 1, aerialFade: 0.81,
  // per-region value drift baked into aPaint — adjacent panels read as
  // separately mixed brush pools (rebuilds on change)
  regionJitter: 0.07,
  // thin lines & AA
  oneSided: false, coverageAA: true, superSample: 1,
  msaa: true, fxaa: true, vectorMode: false, progressive: false,
  // vector style (only affects vector mode)
  overshoot: 0.05, inkVary: 0.3,
  // camera: orbit around a target, or free-floating WASD/QE flight
  flyMode: false, flySpeed: 1,
  // scene
  scene: 'yard', perQuad: true, autoRotate: false, seed: 7, density: 2.5,
};

/* ============================================================
   Seeded RNG
   ============================================================ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(P.seed);
// Face colors draw from their OWN stream. They used to share `rng` with the
// procedural builders, which meant any option changing how many colors get
// rolled — per-quad, region grouping, similarity — also reshuffled the greeble
// layout. Same seed, separate stream: color options now only change color.
let crng = mulberry32(P.seed ^ 0x9e3779b9);
// Paint jitter draws from a THIRD stream: it must consume neither rng
// (greeble layout) nor crng (ID colors), or adding color would reshuffle
// the scene and break the colorOn-off pixel-identity guarantee.
let prng = mulberry32(P.seed ^ 0x5f356495);

/* ============================================================
   Watercolor palette — sampled from reference-watercolor.png
   ============================================================ */
// RAW hex bytes, deliberately bypassing THREE.Color: ColorManagement
// would convert to linear-sRGB, but the post shader writes its output
// unencoded, so raw display bytes are what come back out of the screen
// unchanged. (Verified: routing through THREE.Color renders the sky
// visibly darker/more saturated than the palette hex.)
const hex2u8 = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const PAL = {
  sky:       hex2u8('#D8EFEC'),  // pale ice — aerial fade target
  sand:      hex2u8('#EDE6D4'),  // cream — ground, plates, dishes
  pink:      hex2u8('#E0B4B0'),  // dusty pink — plinths, distance
  rose:      hex2u8('#C98F94'),
  mauve:     hex2u8('#C090A8'),  // tanks, soft forms
  peri:      hex2u8('#8F9AC8'),  // periwinkle — machine bodies
  slate:     hex2u8('#7890A8'),  // vents, grates, hardware
  deepSlate: hex2u8('#7880B0'),  // rivets, bolts
  cyan:      hex2u8('#6FBEDC'),  // secondary accent — portholes, glass
  celadon:   hex2u8('#9CC4A4'),  // pipes
  mint:      hex2u8('#BFD8B4'),  // AC boxes
  red:       hex2u8('#C94F4A'),  // THE accent — one hero object per scene
  shadow:    hex2u8('#4A4C6E'),  // cables, railings, ladders

  [/phosphor|crt|screen|glass|window|canopy/i,   PAL.cyan],
  [/wood|plank|floor|linen|plaster|paper|card/i, PAL.sand],
  [/cloth|velour|sofa|jacket|fabric|curtain/i,   PAL.mauve],
  [/duct|steel|iron|metal|fitting|pipe|vent/i,   PAL.slate],
  [/cable|wire|rubber|tire|shadow/i,             PAL.shadow],
  [/armor|plate|hull|panel/i,                    PAL.peri],
  [/skin|face|hand|flesh/i,                      PAL.pink],
  [/plant|leaf|moss|grass/i,                     PAL.celadon],
  [/sky|city|backdrop/i,                         PAL.sky],
];
// hash fallback cycles the quiet hues only — red and cyan stay rare
const MTL_FALLBACK = [PAL.pink, PAL.rose, PAL.mauve, PAL.peri,

function paintForName(name) {
  for (const [re, c] of MTL_PAINT) if (re.test(name)) return c;
  let h = 5381;
  for (let i = 0; i < name.length; i++) h = (h * 33 ^ name.charCodeAt(i)) >>> 0;

}
// deterministic per-region wash drift in [-1, 1) — an integer hash, not
// a stream, so it can never disturb the rng/crng call ordering

  let x = (i + Math.imul(P.seed, 131071) + 1) | 0;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return ((x >>> 0) / 4294967296) * 2 - 1;
}

let currentObjText = EMBEDDED_OBJ;

// scenes discovered from a user-picked Models folder:
// each subdirectory = one scene showcasing every .obj inside it
let modelScenes = [];   // [{ name, files: [{ name, text }] }]

/* ============================================================
   Face-ID coloring — YOUR technique:
   random color per face -> edge detect the color buffer.
   perQuad=true colors triangle *pairs* (most three.js primitives
   emit quads as consecutive tri pairs) so quads don't get a
   diagonal seam. perQuad=false shows every triangle.
   ============================================================ */
/* ------------------------------------------------------------
   Region grouping — the ID-map idea, applied to line control.
   Rather than one random color per face, adjacent faces are
   flood-filled into REGIONS and each region gets ONE color.
   Since the detector only inks where the color steps, a region's
   interior falls silent: a smooth sphere collapses to a single
   region and draws just its silhouette, while a cube still keeps
   its six faces. Two neighbors join when their face normals agree
   to within `similarity` (1 = coplanar only, lower tolerates more
   curvature) and nothing explicit separates them — an OBJ
   o/g/usemtl change always forces a boundary.
   ------------------------------------------------------------ */
function computeRegions(g, stride, similarity, triGroups) {
  const p = g.attributes.position.array;
  const nVert = g.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const triPerFace = stride / 3;

  // weld by quantized position: toNonIndexed() split the shared
  // vertices apart, but neighbors have to agree on vertex identity
  // 1e-4 is deliberately tight. Loosening it does NOT join parts that merely
  // butt together — it welds unrelated vertices, which collapses faces and
  // breaks the edge topology, so *fewer* neighbours pair up and regions go up.
  const tw0 = performance.now();
  const weld = new Map(), vid = new Int32Array(nVert);
  for (let i = 0; i < nVert; i++) {
    const b = i * 3;
    const k = Math.round(p[b] * 1e4) + '_' + Math.round(p[b + 1] * 1e4) +
              '_' + Math.round(p[b + 2] * 1e4);
    let id = weld.get(k);
    if (id === undefined) { id = weld.size; weld.set(k, id); }
    vid[i] = id;
  }
  const tr0 = performance.now(); tWeld += tr0 - tw0;

  // per face: area-weighted normal + its boundary edges. An edge used
  // twice *inside* one face is the quad's diagonal, not a boundary.
  const fn = new Float32Array(nFace * 3);
  const faceEdges = new Array(nFace);
  const owner = new Map();              // edge key -> first face, -1 once paired
  const pairs = [], pairKeys = [];      // faces meeting across a shared edge
  const seen = new Map();
  for (let f = 0; f < nFace; f++) {
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    let ax = 0, ay = 0, az = 0;
    seen.clear();
    for (let t = 0; t + 3 <= vN; t += 3) {
      const i0 = v0 + t, b0 = i0 * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      // cross product length is 2x area, so summing weights by area
      ax += uy * wz - uz * wy; ay += uz * wx - ux * wz; az += ux * wy - uy * wx;
      for (let e = 0; e < 3; e++) {
        const s = i0 + e, d = i0 + (e + 1) % 3, a = vid[s], c = vid[d];
        const key = a < c ? a + '_' + c : c + '_' + a;
        const prev = seen.get(key);
        if (prev) prev.n++; else seen.set(key, { n: 1, i: s, j: d });
      }
    }
    const l = Math.hypot(ax, ay, az) || 1;
    fn[f * 3] = ax / l; fn[f * 3 + 1] = ay / l; fn[f * 3 + 2] = az / l;
    const bnd = [];
    for (const [key, v] of seen) {
      if (v.n !== 1) continue;                      // internal diagonal
      bnd.push(key, v.i, v.j);
      const o = owner.get(key);
      if (o === undefined) owner.set(key, f);
      else if (o >= 0) { pairs.push(o, f); pairKeys.push(key); owner.set(key, -1); }
    }
    faceEdges[f] = bnd;
  }

  // union neighbors whose normals agree and that nothing separates
  const parent = new Int32Array(nFace);
  for (let f = 0; f < nFace; f++) parent[f] = f;
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  for (let i = 0; i < pairs.length; i += 2) {
    const a = pairs[i], b = pairs[i + 1];
    if (triGroups && triGroups[a * triPerFace] !== triGroups[b * triPerFace]) continue;
    if (fn[a * 3] * fn[b * 3] + fn[a * 3 + 1] * fn[b * 3 + 1] +
        fn[a * 3 + 2] * fn[b * 3 + 2] < similarity) continue;
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent[rb] = ra;
  }

  const region = new Int32Array(nFace), remap = new Map();
  for (let f = 0; f < nFace; f++) {
    const r = find(f);
    let id = remap.get(r);
    if (id === undefined) { id = remap.size; remap.set(r, id); }
    region[f] = id;
  }
  // edges with the same region on both sides are the lines that go
  // away; region adjacency drives color separation below
  const silent = new Set(), nbr = new Array(remap.size);
  for (let i = 0; i < remap.size; i++) nbr[i] = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const ra = region[pairs[i]], rb = region[pairs[i + 1]];
    if (ra === rb) silent.add(pairKeys[i >> 1]);
    else { nbr[ra].push(rb); nbr[rb].push(ra); }
  }
  tRegion += performance.now() - tr0;
  return { region, count: remap.size, nFace, faceEdges, silent, nbr, pairs, pairKeys };
}

/* ------------------------------------------------------------
   Feature size — how big a shape is, for screen-relative LOD.
   `similarity` is baked and view-independent, so it can decide a
   sphere is smooth but never that the sphere is 8px tall. This
   measures each shape in world units; the shaders divide by
   distance to get its apparent size and fade small stuff out.

   Three metrics, because which one reads best depends on how thin
   shapes like pipes and masts should behave — all are baked so
   the dropdown switches with no rebuild.
   ------------------------------------------------------------ */
const LOD_METRICS = ['area', 'diagonal', 'thin'];
const LOD_UNITS = ['region', 'object'];

// log encode into one byte: covers ~0.01 to 200 world units at ~4%
// relative precision, which is all an 8-bit alpha channel can carry
function encodeSize(s) {
  const t = (Math.log2(Math.max(s, 1e-3)) + 7) / 15;
  return Math.max(0, Math.min(255, Math.round(t * 255)));
}

function sizeMetrics(geom, stride, regionOf, nUnit) {
  const p = geom.attributes.position.array;
  const nVert = geom.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const area = new Float64Array(nUnit), bb = new Float64Array(nUnit * 6);
  for (let u = 0; u < nUnit; u++) {
    bb[u * 6] = bb[u * 6 + 1] = bb[u * 6 + 2] = Infinity;
    bb[u * 6 + 3] = bb[u * 6 + 4] = bb[u * 6 + 5] = -Infinity;
  }
  let oArea = 0;
  const ob = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
  for (let f = 0; f < nFace; f++) {
    const u = regionOf ? regionOf[f] : f;
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    for (let t = 0; t + 3 <= vN; t += 3) {
      const b0 = (v0 + t) * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      const a = Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) * 0.5;
      area[u] += a; oArea += a;
    }
    for (let i = v0; i < v0 + vN; i++) {
      const b = i * 3;
      for (let k = 0; k < 3; k++) {
        const x = p[b + k];
        if (x < bb[u * 6 + k]) bb[u * 6 + k] = x;
        if (x > bb[u * 6 + 3 + k]) bb[u * 6 + 3 + k] = x;
        if (x < ob[k]) ob[k] = x;
        if (x > ob[3 + k]) ob[3 + k] = x;
      }
    }
  }
  // "thin" is the MIDDLE bbox extent, not the smallest: the smallest is
  // 0 for any flat patch, which would make every panel read as a sliver
  const metrics = (ar, dx, dy, dz) => {
    const s = [dx, dy, dz].sort((a, b) => a - b);
    return [Math.sqrt(ar), Math.hypot(dx, dy, dz), s[1]];
  };
  const enc = new Uint8Array(nUnit * 3);
  for (let u = 0; u < nUnit; u++) {
    const m = metrics(area[u],
      Math.max(0, bb[u * 6 + 3] - bb[u * 6]),
      Math.max(0, bb[u * 6 + 4] - bb[u * 6 + 1]),
      Math.max(0, bb[u * 6 + 5] - bb[u * 6 + 2]));
    for (let k = 0; k < 3; k++) enc[u * 3 + k] = encodeSize(m[k]);
  }
  const om = metrics(oArea, Math.max(0, ob[3] - ob[0]),
    Math.max(0, ob[4] - ob[1]), Math.max(0, ob[5] - ob[2]));
  return { enc, obj: om.map(encodeSize) };
}

function faceIdColors(geometry, perQuad, variation = 1.0, paintCol = null) {
  const geom = geometry.index ? geometry.toNonIndexed() : geometry;
  const count = geom.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const step = perQuad ? 6 : 3;
  const paint = (from, to, r, g, b) => {
    for (let i = from; i < to && i < count; i++) {
      colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
    }
  };

  if (!P.regionGroup) {
    for (let i = 0; i < count; i += step)
      paint(i, i + step, .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation);
  } else {
    const R = computeRegions(geom, step, P.similarity, geometry.userData.faceGroup);
    // one color per region. Each is rolled a few times and the roll
    // landing furthest from the neighbors already placed wins — two
    // near-identical colors across a boundary are an edge the
    // detector would miss, i.e. a hole in the linework.
    const rc = new Float32Array(R.count * 3), done = new Uint8Array(R.count);

    for (let r = 0; r < R.count; r++) {
      let best = -1, br = .5, bg = .5, bb = .5;
      for (let k = 0; k < 4; k++) {
        const cr = .5 + (crng() - .5) * variation;
        const cg = .5 + (crng() - .5) * variation;
        const cb = .5 + (crng() - .5) * variation;
        let near = Infinity;
        for (const n of R.nbr[r]) {
          if (!done[n]) continue;
          const dr = cr - rc[n * 3], dg = cg - rc[n * 3 + 1], db = cb - rc[n * 3 + 2];
          near = Math.min(near, dr * dr + dg * dg + db * db);
        }
        if (near > best) { best = near; br = cr; bg = cg; bb = cb; }
        if (near === Infinity) break;      // nothing placed nearby yet
      }
      rc[r * 3] = br; rc[r * 3 + 1] = bg; rc[r * 3 + 2] = bb;
      done[r] = 1;
    }
    for (let f = 0; f < R.nFace; f++) {
      const r = R.region[f];
      paint(f * step, f * step + step, rc[r * 3], rc[r * 3 + 1], rc[r * 3 + 2]);
    }
    geom.userData.regions = R;            // vector mode reuses this
  }
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // ---- watercolor paint -----------------------------------------
  // Display color rides its own attribute: the ID colors above are
  // detection-only. Filled per face; regions never span OBJ material
  // groups, so per-face fill is per-region-consistent automatically.
  const pnt = new Uint8Array(count * 3);
  const gm = geometry.userData.groupMtl, fgp = geometry.userData.faceGroup;
  let paintOf = null;
  if (!paintCol && gm && fgp) {
    const cache = [], tpf = step / 3;      // faceGroup entries are per-triangle
    paintOf = f => cache[fgp[f * tpf]] ||
      (cache[fgp[f * tpf]] = paintForName(gm[fgp[f * tpf]] || ''));
  }
  const flatPaint = paintCol || PAL.sand;
  // per-region wash drift: every region reads as its own brush pool.
  // Keyed on region id, so all faces of a region agree; a region never
  // spans OBJ material groups, so the cache stays color-consistent.
  const regJ = geom.userData.regions;
  const jAmt = P.regionJitter, jCache = new Map();
  for (let f = 0, nf = Math.ceil(count / step); f < nf; f++) {
    let c = paintOf ? paintOf(f) : flatPaint;
    if (jAmt > 0) {
      const u = regJ ? regJ.region[f] : f;
      let jc = jCache.get(u);
      if (!jc) { jc = tint(c, washJitter(u) * jAmt); jCache.set(u, jc); }
      c = jc;
    }
    for (let j = 0; j < step; j++) {
      const i = f * step + j;
      if (i >= count) break;
      pnt[i * 3] = c[0]; pnt[i * 3 + 1] = c[1]; pnt[i * 3 + 2] = c[2];
    }
  }
  geom.setAttribute('aPaint', new THREE.BufferAttribute(pnt, 3, true));

  // ---- feature-LOD sizes ----------------------------------------
  // One size per unit, where a unit is a region (or a bare face when
  // grouping is off) plus the whole geometry as the "object" unit.
  // Both go out as normalized bytes: the value lands in an 8-bit
  // alpha channel anyway, so floats would just waste bandwidth.
  const nFace = Math.ceil(count / step);
  const R = geom.userData.regions;
  const regionOf = R ? R.region : null;
  const SM = sizeMetrics(geom, step, regionOf, R ? R.count : nFace);
  const szR = new Uint8Array(count * 3), szO = new Uint8Array(count * 3);
  for (let f = 0; f < nFace; f++) {
    const u = regionOf ? regionOf[f] : f;
    for (let j = 0; j < step; j++) {
      const i = f * step + j;
      if (i >= count) break;
      szR[i * 3] = SM.enc[u * 3]; szR[i * 3 + 1] = SM.enc[u * 3 + 1]; szR[i * 3 + 2] = SM.enc[u * 3 + 2];
      szO[i * 3] = SM.obj[0]; szO[i * 3 + 1] = SM.obj[1]; szO[i * 3 + 2] = SM.obj[2];
    }
  }
  geom.setAttribute('aSizeRegion', new THREE.BufferAttribute(szR, 3, true));
  geom.setAttribute('aSizeObject', new THREE.BufferAttribute(szO, 3, true));

  // per-edge size for vector mode: an edge is gated by the SMALLER of
  // the two regions it separates. Encoding is monotonic, so the min of
  // the encoded bytes is the encoding of the min.
  if (R) {
    const em = new Map();
    for (let i = 0; i < R.pairs.length; i += 2) {
      const a = R.region[R.pairs[i]] * 3, b = R.region[R.pairs[i + 1]] * 3;
      em.set(R.pairKeys[i >> 1], [
        Math.min(SM.enc[a], SM.enc[b]),
        Math.min(SM.enc[a + 1], SM.enc[b + 1]),
        Math.min(SM.enc[a + 2], SM.enc[b + 2])]);
    }
    geom.userData.edgeSize = em;
  }
  geom.userData.sizes = SM;
  return geom;
}

const app = document.getElementById('app');

  powerPreference: 'high-performance',   // request the discrete GPU on dual-GPU laptops

  vertexColors: true,                     // makes three declare `in vec3 color`

    in vec3 aSizeObject;

    uInk:     { value: new THREE.Color(0x1d1a17) },
    uAmpW:    { value: 0.05 },  // wobble amplitude, world units
    uFreqW:   { value: 2.0 },   // wobble spatial frequency
    uLift:    { value: 0.15 },  // eye-space pull toward camera
    uFalloff: { value: 0.55 },
    uInkVary: { value: 0.3 },
    uFadeK:   { value: 14.0 },
    uMetric:  { value: 0 },
    uUnit:    { value: 0 },
    uMinFeat: { value: 0.0 },   // fraction of screen height; 0 = off
    uInvFov:  { value: 1.0 },
  },
  vertexShader: /* glsl */`
    attribute float aSeed;
    attribute vec3 aSizeRegion, aSizeObject;
    uniform float uAmpW, uFreqW, uLift, uMetric, uUnit;
    varying float vSeed, vDist, vSize;
    void main() {
      vec3 sz = uUnit < 0.5 ? aSizeRegion : aSizeObject;
      vSize = uMetric < 0.5 ? sz.x : (uMetric < 1.5 ? sz.y : sz.z);
      vec3 p = position;
      float s = aSeed * 43.0;
      float f1 = uFreqW, f2 = uFreqW * 2.7;
      vec3 w = vec3(
        sin(p.y * f1 + s)       + 0.6 * sin(p.z * f2 + s * 1.7),
        sin(p.z * f1 + s * 2.3) + 0.6 * sin(p.x * f2 + s * 0.6),
        sin(p.x * f1 + s * 1.1) + 0.6 * sin(p.y * f2 + s * 2.9));
      p += w * uAmpW * 0.625;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDist = -mv.z;
      mv.z += uLift;
      vSeed = aSeed;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec3 uInk;
    uniform float uInkVary, uFalloff, uFadeK, uMinFeat, uInvFov;
    varying float vSeed, vDist, vSize;
    void main() {
      float a = 1.0 - uInkVary * fract(vSeed * 91.17);
      a *= mix(1.0, clamp(uFadeK / vDist, 0.3, 1.0), min(uFalloff, 1.0));
      a *= clamp(mix(1.0, clamp(uFadeK / vDist, 0.0, 1.0), max(uFalloff - 1.0, 0.0)), 0.0, 1.0);
      // feature LOD: apparent size of this edge's shape, as a fraction
      // of screen height — same test the ink shader runs
      if (uMinFeat > 0.0) {
        float frac = exp2(vSize * 15.0 - 7.0) * uInvFov / max(vDist, 1e-4);
        a *= smoothstep(uMinFeat, uMinFeat * 2.0, frac);
      }
      gl_FragColor = vec4(uInk, a);
    }`,
  transparent: true, depthWrite: false,
});

/* ============================================================
   ALL DETAIL IN THE GEOMETRY.
   A greeble system: every panel line, rivet, vent slat, flange
   bolt and railing post is real geometry with its own face-ID
   color. Everything is baked into ONE merged mesh (one draw
   call), so tens of thousands of parts render like one object.
   ============================================================ */
let sceneRoot = null, lineSegs = null, sceneSphere = null;
let triCount = 0, edgeCount = 0, regionCount = 0, lineVertCount = 0;
// declared here, not with the budget meters: buildScene() runs at module
// top-level well before that point and would hit the temporal dead zone
let lastBuildMs = 0, lastFrameMs = 0;
// where the rebuild actually goes — welding, region flood-fill, edge
// extraction. Rebuild is the binding constraint, so the split is what
// makes it actionable rather than just a number.
let tWeld = 0, tRegion = 0, tEdges = 0;

// ---- watercolor kind -> color --------------------------------
// Builders set this before their put() calls; nested helpers inherit
// the caller's paint unless they set their own. null falls through to
// material-name lookup (imports) or sand.
let currentPaint = null;
const setPaint = c => { currentPaint = c; };
function withPaint(c, fn) {
  const prev = currentPaint; currentPaint = c; fn(); currentPaint = prev;
}
// mix a palette byte triple toward white (k > 0) or black (k < 0)
const tint = (c, k) => c.map(v => Math.max(0, Math.min(255,
  Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)))));

// ---- merge machinery -----------------------------------------
let bag = [];
const _one = new THREE.Vector3(1, 1, 1);
function frameOf(x, y, z, rx = 0, ry = 0, rz = 0) {
  return new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), _one);
}
// place a geometry inside a frame (or chain of frames)
function put(frame, geom, x, y, z, rx = 0, ry = 0, rz = 0, variation = 1) {
  // triangulated imports opt out of quad pairing (blind pairing on a
  // tri mesh merges unrelated triangles and eats their shared edges)
  const g = faceIdColors(geom, P.perQuad && !geom.userData.forceTri, variation, currentPaint);
  g.applyMatrix4(frameOf(x, y, z, rx, ry, rz));
  if (frame) g.applyMatrix4(frame);
  bag.push(g);
  return g;
}
// pull real edge segments out of a non-indexed geometry, for vector
// mode. In per-quad mode each consecutive triangle PAIR is treated as
// one face: the shared (duplicated) vertices are the diagonal, and we
// emit the other four edges — the same boundaries the face-ID
// detector finds, but as actual line geometry.
function extractEdges(g, perQuad, store) {
  const p = g.attributes.position.array;
  const n = g.attributes.position.count;
  const fr = x => x - Math.floor(x);
  // emit one edge: randomized endpoint overshoot, then subdivide so
  // the vertex-shader wobble can actually bend it, tagged with a
  // per-edge seed (duplicated shared edges get different seeds ->
  // natural double-stroke)
  // feature-LOD size of the edge about to be emitted, set by the callers
  // below; object size is constant for the whole geometry
  const SM = g.userData.sizes;
  const oSz = SM ? SM.obj : [255, 255, 255];
  let rSz = oSz;
  function push(i, j) {
    let ax = p[i * 3], ay = p[i * 3 + 1], az = p[i * 3 + 2];
    let bx = p[j * 3], by = p[j * 3 + 1], bz = p[j * 3 + 2];
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (len < 1e-6) return;
    const idx = store.edges++;
    const h1 = fr(idx * 0.75487766), h2 = fr(idx * 0.56984029), seed = fr(idx * 0.61803399);
    const ux = dx / len, uy = dy / len, uz = dz / len;
    const oA = store.overshoot * (0.25 + 0.75 * h1), oB = store.overshoot * (0.25 + 0.75 * h2);
    ax -= ux * oA; ay -= uy * oA; az -= uz * oA;
    bx += ux * oB; by += uy * oB; bz += uz * oB;
    const nSub = Math.max(1, Math.min(6, Math.round((len + oA + oB) / 0.35)));
    for (let s = 0; s < nSub; s++) {
      const t0 = s / nSub, t1 = (s + 1) / nSub;
      store.pos.push(ax + (bx - ax) * t0, ay + (by - ay) * t0, az + (bz - az) * t0,
                     ax + (bx - ax) * t1, ay + (by - ay) * t1, az + (bz - az) * t1);
      store.seed.push(seed, seed);
      store.szR.push(rSz[0], rSz[1], rSz[2], rSz[0], rSz[1], rSz[2]);
      store.szO.push(oSz[0], oSz[1], oSz[2], oSz[0], oSz[1], oSz[2]);
    }
  }
  // region grouping already worked out every face's boundary edges and
  // which of them are interior to a region — an interior edge carries
  // no color step in raster mode, so it draws no line here either.
  // Boundary edges still appear once per adjoining face, keeping the
  // double-stroke.
  const R = g.userData.regions;
  if (R) {
    const em = g.userData.edgeSize;
    for (let f = 0; f < R.nFace; f++) {
      const bnd = R.faceEdges[f], own = R.region[f] * 3;
      // border edges have no second face, so they fall back to their own region
      const fallback = SM ? [SM.enc[own], SM.enc[own + 1], SM.enc[own + 2]] : oSz;
      for (let e = 0; e < bnd.length; e += 3) {
        if (R.silent.has(bnd[e])) continue;
        rSz = (em && em.get(bnd[e])) || fallback;
        push(bnd[e + 1], bnd[e + 2]);
      }
    }
    return;
  }

  // no grouping: each face is its own unit, so an edge takes the size of
  // the face that emitted it
  const faceSz = f => (SM ? [SM.enc[f * 3], SM.enc[f * 3 + 1], SM.enc[f * 3 + 2]] : oSz);
  const fStride = perQuad ? 6 : 3;   // sizeMetrics indexed faces by this stride
  const EA = [[0, 1], [1, 2], [2, 0]], EB = [[3, 4], [4, 5], [5, 3]];
  let v = 0;
  if (perQuad) {
    for (; v + 6 <= n; v += 6) {
      rSz = faceSz(v / 6);
      const b = v * 3, mA = [], mB = [];
      for (let i = 0; i < 3; i++) for (let j = 3; j < 6; j++) {
        const dx = p[b + i * 3] - p[b + j * 3], dy = p[b + i * 3 + 1] - p[b + j * 3 + 1],
              dz = p[b + i * 3 + 2] - p[b + j * 3 + 2];
        if (dx * dx + dy * dy + dz * dz < 1e-10) { mA.push(i); mB.push(j); }
      }
      if (mA.length === 2) {   // proper pair: drop the shared diagonal
        for (const [a2, b2] of EA) if (!(mA.includes(a2) && mA.includes(b2))) push(v + a2, v + b2);
        for (const [a2, b2] of EB) if (!(mB.includes(a2) && mB.includes(b2))) push(v + a2, v + b2);
      } else {
        for (const [a2, b2] of EA) push(v + a2, v + b2);
        for (const [a2, b2] of EB) push(v + a2, v + b2);
      }
    }
  }
  for (; v + 3 <= n; v += 3) {
    rSz = faceSz(Math.floor(v / fStride));
    push(v, v + 1); push(v + 1, v + 2); push(v + 2, v);
  }
}

function mergeBag() {
  let total = 0;
  for (const g of bag) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  const szR = new Uint8Array(total * 3), szO = new Uint8Array(total * 3);
  const pnt = new Uint8Array(total * 3);
  const store = { pos: [], seed: [], szR: [], szO: [], edges: 0, overshoot: P.overshoot };
  let o = 0, regions = 0;
  for (const g of bag) {
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    col.set(g.attributes.color.array, o * 3);
    szR.set(g.attributes.aSizeRegion.array, o * 3);
    szO.set(g.attributes.aSizeObject.array, o * 3);
    pnt.set(g.attributes.aPaint.array, o * 3);
    o += g.attributes.position.count;
    if (g.userData.regions) regions += g.userData.regions.count;
    const te0 = performance.now();
    extractEdges(g, P.perQuad && !g.userData.forceTri, store);
    tEdges += performance.now() - te0;
    g.dispose();
  }
  bag = [];
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  merged.setAttribute('color', new THREE.BufferAttribute(col, 3));
  merged.setAttribute('aSizeRegion', new THREE.BufferAttribute(szR, 3, true));
  merged.setAttribute('aSizeObject', new THREE.BufferAttribute(szO, 3, true));
  merged.setAttribute('aPaint', new THREE.BufferAttribute(pnt, 3, true));
  triCount = total / 3;
  edgeCount = store.edges;
  regionCount = regions;
  lineVertCount = store.pos.length / 3;
  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(store.pos), 3));
  lineGeom.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(store.seed), 1));
  lineGeom.setAttribute('aSizeRegion', new THREE.BufferAttribute(new Uint8Array(store.szR), 3, true));
  lineGeom.setAttribute('aSizeObject', new THREE.BufferAttribute(new Uint8Array(store.szO), 3, true));
  return { merged, lineGeom };
}

// ---- small parts ---------------------------------------------
function rivet(frame, x, y, z, r = 0.05) {
  withPaint(PAL.deepSlate, () =>
    put(frame, new THREE.CylinderGeometry(r, r * 1.25, r * 1.2, 6, 1), x, y, z, Math.PI / 2, 0, 0, 0.7));
}
function boltRing(frame, x, y, z, radius, n, boltR = 0.045, facePlane = false) {
  const prevPaint = currentPaint; currentPaint = PAL.deepSlate;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    if (facePlane)   // ring in the x/y plane (wall-mounted, bolts point +z)
      put(frame, new THREE.CylinderGeometry(boltR, boltR, boltR * 2, 6, 1),
        x + Math.cos(a) * radius, y + Math.sin(a) * radius, z, Math.PI / 2, 0, 0, 0.7);
    else             // ring in the x/z plane (horizontal, bolts point up)
      put(frame, new THREE.CylinderGeometry(boltR, boltR, boltR * 2, 6, 1),
        x + Math.cos(a) * radius, y, z + Math.sin(a) * radius, 0, 0, 0, 0.7);
  }
  currentPaint = prevPaint;
}

// recursive panel split of a rect [-w/2,w/2]x[-h/2,h/2]
function splitRect(u0, v0, u1, v1, depth, out) {
  const w = u1 - u0, h = v1 - v0;
  if (depth <= 0 || (w < 1.3 && h < 1.3) || rng() < 0.18) { out.push([u0, v0, u1, v1]); return; }
  if (w > h) { const t = u0 + w * (0.35 + rng() * 0.3); splitRect(u0, v0, t, v1, depth - 1, out); splitRect(t, v0, u1, v1, depth - 1, out); }
  else      { const t = v0 + h * (0.35 + rng() * 0.3); splitRect(u0, v0, u1, t, depth - 1, out); splitRect(u0, t, u1, v1, depth - 1, out); }
}

// decorate one face of a block. faceFrame maps face-local
// (u, v, out-of-face) -> block space. fw x fh is the face size.
function panelFace(faceFrame, fw, fh, D) {
  // plates read as a lighter tint of the block they sit on
  const prevPaint = currentPaint;
  const platePaint = tint(currentPaint || PAL.peri, 0.10);
  const cells = [];
  splitRect(-fw / 2 + .15, -fh / 2 + .15, fw / 2 - .15, fh / 2 - .15,
    2 + Math.round(D), cells);
  for (const [u0, v0, u1, v1] of cells) {
    const cw = u1 - u0, ch = v1 - v0, uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
    if (cw < .3 || ch < .3) continue;
    const m = 0.07;                             // inset margin
    const t = 0.04 + rng() * 0.09;              // plate thickness
    // the panel plate itself — low variation: fine lines
    setPaint(platePaint);
    put(faceFrame, new THREE.BoxGeometry(cw - 2 * m, ch - 2 * m, t), uc, vc, t / 2, 0, 0, 0, 0.3);
    const deco = rng();
    if (deco < 0.22 * D && cw > .8 && ch > .8) {
      // corner rivets
      const ru = cw / 2 - m - .12, rv = ch / 2 - m - .12;
      rivet(faceFrame, uc - ru, vc - rv, t); rivet(faceFrame, uc + ru, vc - rv, t);
      rivet(faceFrame, uc - ru, vc + rv, t); rivet(faceFrame, uc + ru, vc + rv, t);
    } else if (deco < 0.40 * D && cw > 1.0 && ch > .7) {
      // vent slats
      setPaint(PAL.slate);
      const n = Math.min(11, Math.floor((ch - 2 * m) / 0.22));
      for (let i = 0; i < n; i++) {
        const vy = vc - (ch - 2 * m - .2) / 2 + i * ((ch - 2 * m - .2) / Math.max(1, n - 1));
        put(faceFrame, new THREE.BoxGeometry(cw - 2 * m - .25, 0.07, 0.06), uc, vy, t + 0.03, 0, 0, 0, 0.55);
      }
    } else if (deco < 0.52 * D && Math.min(cw, ch) > 1.0) {
      // porthole: disc + raised ring + bolts
      setPaint(PAL.cyan);
      const pr = Math.min(cw, ch) * 0.28;
      put(faceFrame, new THREE.CylinderGeometry(pr, pr, 0.06, 16, 1), uc, vc, t + 0.03, Math.PI / 2, 0, 0, 0.4);
      put(faceFrame, new THREE.TorusGeometry(pr, 0.05, 6, 16), uc, vc, t + 0.06, 0, 0, 0, 0.6);
      boltRing(faceFrame, uc, vc, t + 0.05, pr + 0.14, 6, 0.045, true);
    } else if (deco < 0.66 * D && cw > .9) {
      // little box cluster (gauges / junctions)
      setPaint(PAL.slate);
      const n = 1 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) {
        const gw = .18 + rng() * .4, gh2 = .15 + rng() * .35, gt = .1 + rng() * .22;
        put(faceFrame, new THREE.BoxGeometry(gw, gh2, gt),
          uc + (rng() - .5) * (cw - 2 * m - gw), vc + (rng() - .5) * (ch - 2 * m - gh2), t + gt / 2, 0, 0, 0, 0.6);
      }
      if (rng() < .5) rivet(faceFrame, uc, vc + ch / 2 - m - .1, t);
    }
    // occasional rivet seam along the bottom edge of the plate
    if (rng() < 0.25 * D && cw > 1.4) {
      const n = Math.floor((cw - 2 * m) / 0.4);
      for (let i = 0; i < n; i++)
        rivet(faceFrame, uc - (cw - 2 * m) / 2 + .2 + i * .4, v0 + m + .1, t, 0.04);
    }
  }
  currentPaint = prevPaint;
}

function ladder(blockFrame, x, z, h, ry) {
  const prevPaint = currentPaint; currentPaint = PAL.shadow;
  const f = frameOf(x, 0, z, 0, ry, 0);
  f.premultiply(blockFrame);
  for (const s of [-0.22, 0.22])
    put(f, new THREE.BoxGeometry(0.06, h, 0.06), s, h / 2, 0.1, 0, 0, 0, 0.6);
  const n = Math.floor(h / 0.38);
  for (let i = 1; i < n; i++)
    put(f, new THREE.CylinderGeometry(0.03, 0.03, 0.44, 5, 1), 0, i * 0.38, 0.1, 0, 0, Math.PI / 2, 0.6);
  currentPaint = prevPaint;
}

function railing(blockFrame, w, d, topY) {
  const prevPaint = currentPaint; currentPaint = PAL.shadow;
  const hw = w / 2 - .15, hd = d / 2 - .15, rh = 0.85;
  const edges = [
    [-hw, -hd, hw, -hd], [hw, -hd, hw, hd], [hw, hd, -hw, hd], [-hw, hd, -hw, -hd]];
  for (const [x0, z0, x1, z1] of edges) {
    const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(z1 - z0, x1 - x0);
    const n = Math.max(2, Math.round(len / 1.1));
    for (let i = 0; i <= n; i++) {
      const tt = i / n;
      put(blockFrame, new THREE.BoxGeometry(0.05, rh, 0.05),
        x0 + (x1 - x0) * tt, topY + rh / 2, z0 + (z1 - z0) * tt, 0, 0, 0, 0.6);
    }
    for (const ry2 of [rh, rh * 0.55])
      put(blockFrame, new THREE.BoxGeometry(len, 0.045, 0.045),
        (x0 + x1) / 2, topY + ry2, (z0 + z1) / 2, 0, -ang, 0, 0.6);
  }
  currentPaint = prevPaint;
}

function pipeRun(frame, x, z, baseY, pr, ph, D) {
  const segs = Math.max(2, Math.floor(ph / 1.4));
  put(frame, new THREE.CylinderGeometry(pr, pr, ph, 10, segs), x, baseY + ph / 2, z, 0, 0, 0, 0.5);
  // flanges with bolt rings every ~2.2 units
  for (let fy = baseY + 0.9; fy < baseY + ph - .3; fy += 2.2) {
    put(frame, new THREE.CylinderGeometry(pr * 1.4, pr * 1.4, 0.16, 10, 1), x, fy, z, 0, 0, 0, 0.55);
    if (rng() < 0.7 * D) boltRing(frame, x, fy + 0.1, z, pr * 1.18, 6, 0.035);
  }
  // elbow + horizontal stub at the top
  if (rng() < 0.65) {
    const er = pr * 1.9;
    put(frame, new THREE.TorusGeometry(er, pr, 8, 10, Math.PI / 2), x - er, baseY + ph, z, 0, 0, 0, 0.5);
    const stub = 1 + rng() * 3;
    put(frame, new THREE.CylinderGeometry(pr, pr, stub, 10, 2),
      x - er - stub / 2, baseY + ph + er, z, 0, 0, Math.PI / 2, 0.5);
    put(frame, new THREE.CylinderGeometry(pr * 1.3, pr * 1.3, 0.14, 10, 1),
      x - er - stub, baseY + ph + er, z, 0, 0, Math.PI / 2, 0.55);
  } else {
    put(frame, new THREE.CylinderGeometry(pr * 1.5, pr * 1.5, 0.35, 10, 1), x, baseY + ph, z, 0, 0, 0, 0.55);
  }
}

function cable(p1, p2, r = 0.07) {
  const mid = p1.clone().lerp(p2, 0.5); mid.y -= p1.distanceTo(p2) * (0.12 + rng() * 0.12);
  const curve = new THREE.CatmullRomCurve3([p1, mid, p2]);
  withPaint(PAL.shadow, () =>
    put(null, new THREE.TubeGeometry(curve, 36, r, 6), 0, 0, 0, 0, 0, 0, 0.8));
}

/* ---- the scene itself ---------------------------------------- */
function buildScene() {
  const buildT0 = performance.now();
  tWeld = tRegion = tEdges = 0;
  if (sceneRoot) { sceneRoot.geometry.dispose(); scene.remove(sceneRoot); }
  if (lineSegs) { lineSegs.geometry.dispose(); scene.remove(lineSegs); }
  rng = mulberry32(P.seed);
  crng = mulberry32(P.seed ^ 0x9e3779b9);
  prng = mulberry32(P.seed ^ 0x5f356495);
  currentPaint = null;                     // no paint state leaks across rebuilds
  bag = [];
  const D = P.density;
  if (P.scene === 'garden') buildGarden();
  else if (P.scene === 'prims') buildPrims();
  else if (P.scene === 'model') buildModel();
  else if (P.scene.startsWith('dir:')) {
    const [di, fi] = P.scene.slice(4).split(':');
    buildDirScene(+di, fi === undefined ? -1 : +fi);
  }
  else buildYard(D);
  finishScene();
  lastBuildMs = performance.now() - buildT0;
}

/* ---- a scene per Models/ subdirectory ------------------------------
   "dir:i"   -> every .obj in that folder, laid out in a grid so they
                can be compared side by side
   "dir:i:k" -> just file k, centred and alone                        */
function buildDirScene(i, only) {
  const sc = modelScenes[i];
  if (!sc) { buildYard(P.density); return; }
  setPaint(PAL.sand);
  put(null, new THREE.PlaneGeometry(160, 160, 16, 16), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);
  setPaint(null);   // imports color themselves by material name
  const solo = only >= 0 && only < sc.files.length;
  const list = solo ? [only] : sc.files.map((_, k) => k);
  const cols = Math.ceil(Math.sqrt(list.length));
  const rowsN = Math.ceil(list.length / cols), spacing = 24;
  list.forEach((k, slot) => {
    const col = slot % cols, row = Math.floor(slot / cols);
    const x = solo ? 0 : (col - (cols - 1) / 2) * spacing;
    const z = solo ? 0 : (row - (rowsN - 1) / 2) * spacing;
    try {
      put(null, parseOBJ(sc.files[k].text), x, 0, z, 0, 0.4 + k * 0.7, 0, 0.55);
    } catch (e) { console.error('failed to parse', sc.files[k].name, e); }
  });
}

function buildYard(D) {
  setPaint(PAL.sand);
  // ground: base sheet + individual floor plates (real gaps = real lines)
  put(null, new THREE.PlaneGeometry(170, 170, 8, 8), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.06);
  const N = 8;
  for (let gx = -N; gx <= N; gx++) for (let gz = -N; gz <= N; gz++) {
    put(null, new THREE.BoxGeometry(4.55, 0.12, 4.55), gx * 4.75, 0.06, gz * 4.75, 0, 0, 0, 0.14);
    const r = rng();
    if (r < 0.045 * D) {           // manhole
      setPaint(PAL.slate);
      put(null, new THREE.CylinderGeometry(0.85, 0.85, 0.18, 14, 1), gx * 4.75, 0.14, gz * 4.75, 0, 0, 0, 0.35);
      boltRing(null, gx * 4.75, 0.24, gz * 4.75, 0.66, 6);
      setPaint(PAL.sand);
    } else if (r < 0.085 * D) {    // floor grate
      setPaint(PAL.slate);
      for (let i = 0; i < 8; i++)
        put(null, new THREE.BoxGeometry(3.4, 0.05, 0.16), gx * 4.75, 0.15, gz * 4.75 - 1.5 + i * 0.42, 0, 0, 0, 0.4);
      setPaint(PAL.sand);
    }
  }

  // machine blocks — bodies cycle the quiet hues by cluster index (index-
  // based so the balance survives any seed), prng jitters within the hue
  const blockTops = [];
  const clusters = 5;
  const BLOCK_CYC = [PAL.peri, PAL.slate, PAL.deepSlate, PAL.mauve];
  for (let c = 0; c < clusters; c++) {
    const cx = (rng() - .5) * 46, cz = (rng() - .5) * 46;
    const bw = 4.5 + rng() * 6, bh = 3.5 + rng() * 9, bd = 4.5 + rng() * 6;
    const bf = frameOf(cx, 0, cz, 0, rng() < 0.25 ? rng() * 0.8 : 0, 0);
    setPaint(tint(BLOCK_CYC[c % BLOCK_CYC.length], (prng() - 0.5) * 0.12));
    put(bf, new THREE.BoxGeometry(bw, bh, bd), 0, bh / 2, 0, 0, 0, 0, 0.9);

    // panelize the four sides + top
    const faces = [
      [frameOf(0, bh / 2, bd / 2).premultiply(bf), bw, bh],                       // +z
      [frameOf(0, bh / 2, -bd / 2, 0, Math.PI, 0).premultiply(bf), bw, bh],       // -z
      [frameOf(bw / 2, bh / 2, 0, 0, Math.PI / 2, 0).premultiply(bf), bd, bh],    // +x
      [frameOf(-bw / 2, bh / 2, 0, 0, -Math.PI / 2, 0).premultiply(bf), bd, bh],  // -x
      [frameOf(0, bh, 0, -Math.PI / 2, 0, 0).premultiply(bf), bw, bd],            // top
    ];
    for (const [ff, fw, fh] of faces) panelFace(ff, fw, fh, D);

    // rooftop machinery
    setPaint(PAL.celadon);
    const pipes = 1 + Math.floor(rng() * 2 * D);
    for (let i = 0; i < pipes; i++)
      pipeRun(bf, (rng() - .5) * bw * .6, (rng() - .5) * bd * .6, bh, .22 + rng() * .42, 2 + rng() * 7, D);
    if (rng() < .55) {   // tank + saddle
      setPaint(PAL.mauve);
      const tr = .9 + rng() * 1.4, tx = (rng() - .5) * bw * .5, tz = (rng() - .5) * bd * .5;
      put(bf, new THREE.SphereGeometry(tr, 16, 12), tx, bh + tr * .75, tz, 0, 0, 0, 0.45);
      put(bf, new THREE.CylinderGeometry(tr * .55, tr * .7, tr * .5, 10, 1), tx, bh + tr * .2, tz, 0, 0, 0, 0.55);
      put(bf, new THREE.TorusGeometry(tr * .8, .06, 6, 18), tx, bh + tr * .75, tz, Math.PI / 2, 0, 0, 0.6);
    }
    if (rng() < .6) railing(bf, bw, bd, bh);
    if (rng() < .65) ladder(bf, (rng() - .5) * bw * .6, bd / 2, bh, 0);

    // AC-unit style boxes on the roof
    setPaint(PAL.mint);
    const rn = Math.floor(rng() * 3 * D);
    for (let i = 0; i < rn; i++) {
      const gw = .6 + rng() * 1.6, gh2 = .4 + rng() * 1.2, gd2 = .6 + rng() * 1.6;
      const gx2 = (rng() - .5) * (bw - gw), gz2 = (rng() - .5) * (bd - gd2);
      put(bf, new THREE.BoxGeometry(gw, gh2, gd2), gx2, bh + gh2 / 2, gz2, 0, 0, 0, 0.55);
      const slats = Math.floor(gw / .18);
      for (let s = 0; s < slats; s++)
        put(bf, new THREE.BoxGeometry(0.05, gh2 * .6, gd2 * .8), gx2 - gw / 2 + .12 + s * .18, bh + gh2 / 2, gz2, 0, 0, 0, 0.6);
    }
    blockTops.push(new THREE.Vector3(cx, bh, cz));
  }

  // ground-level pipe runs with support cradles
  setPaint(PAL.celadon);
  for (let i = 0; i < Math.round(3 * D); i++) {
    const pr = .3 + rng() * .35, plen = 16 + rng() * 26;
    const px = (rng() - .5) * 40, pz = (rng() - .5) * 40, pa = rng() * Math.PI;
    const pf = frameOf(px, 0, pz, 0, pa, 0);
    put(pf, new THREE.CylinderGeometry(pr, pr, plen, 10, Math.floor(plen / 2.5)), 0, pr + .25, 0, 0, 0, Math.PI / 2, 0.5);
    for (let s = -plen / 2 + 1.5; s < plen / 2; s += 3.2) {
      withPaint(PAL.slate, () =>
        put(pf, new THREE.BoxGeometry(0.5, 0.28, pr * 2.4), s, 0.14, 0, 0, 0, 0, 0.55));
      put(pf, new THREE.TorusGeometry(pr * 1.12, .05, 6, 12), s, pr + .25, 0, 0, Math.PI / 2, 0, 0.6);
    }
    // inline flange pairs
    for (let s = -plen / 2 + 4; s < plen / 2; s += 7 + rng() * 4) {
      put(pf, new THREE.CylinderGeometry(pr * 1.35, pr * 1.35, .3, 10, 1), s, pr + .25, 0, 0, 0, Math.PI / 2, 0.55);
    }
  }

  // catenary cables between rooftops
  const cn = Math.min(blockTops.length * 2, Math.round(4 * D));
  for (let i = 0; i < cn; i++) {
    const a = blockTops[Math.floor(rng() * blockTops.length)];
    let b = blockTops[Math.floor(rng() * blockTops.length)];
    if (a === b) continue;
    cable(a.clone().add(new THREE.Vector3((rng() - .5) * 2, .2, (rng() - .5) * 2)),
          b.clone().add(new THREE.Vector3((rng() - .5) * 2, .2, (rng() - .5) * 2)),
          0.05 + rng() * 0.05);
  }

  // antenna masts
  setPaint(PAL.cyan);
  for (let i = 0; i < Math.round(4 * D); i++) {
    const ah = 4 + rng() * 8, ax = (rng() - .5) * 58, az = (rng() - .5) * 58;
    const af = frameOf(ax, 0, az, 0, rng() * Math.PI, 0);
    put(af, new THREE.CylinderGeometry(.09, .16, ah, 6, 3), 0, ah / 2, 0, 0, 0, 0, 0.55);
    const bars = 2 + Math.floor(rng() * 3);
    for (let s = 0; s < bars; s++) {
      const by = ah * (.5 + .5 * s / bars);
      put(af, new THREE.CylinderGeometry(.035, .035, 1.6, 5, 1), 0, by, 0, 0, 0, Math.PI / 2, 0.6);
      put(af, new THREE.SphereGeometry(.09, 6, 5), .8, by, 0, 0, 0, 0, 0.6);
      put(af, new THREE.SphereGeometry(.09, 6, 5), -.8, by, 0, 0, 0, 0, 0.6);
    }
    if (rng() < .5)   // dish
      withPaint(PAL.sand, () =>
        put(af, new THREE.CylinderGeometry(.7, .55, .2, 12, 1), 0, ah - .5, .35, Math.PI / 2.6, 0, 0, 0.5));
    put(af, new THREE.ConeGeometry(.07, .8, 5, 1), 0, ah + .4, 0, 0, 0, 0, 0.6);
  }

  // hero object — high-res torus knot, floating like a monument.
  // The scene's ONE red: the palette reads warm-with-an-accent only
  // while red stays this rare.
  withPaint(PAL.red, () =>
    put(null, new THREE.TorusKnotGeometry(3.1, 0.95, 220, 20), 0, 13.5, 0, 0, 0, 0, 0.5));
}

/* ---- OBJ model scene: an actual editable model file ------------
   Ships with speeder.obj embedded; drop any .obj onto the window
   (or use the "load obj" button) to replace it. Quads survive as
   quads for per-quad coloring; lone triangle runs should come in
   even counts to keep pairing aligned. */
function buildModel() {
  setPaint(PAL.sand);
  put(null, new THREE.PlaneGeometry(120, 120, 12, 12), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);
  // one file, one model. This used to place a second copy further off to
  // show distance falloff, but that reads as a bug when you load your own
  // .obj — and it parsed the file twice, which is real work on a big one.
  setPaint(null);   // imports color themselves by material name
  put(null, parseOBJ(currentObjText), 0, 0, 0, 0, 0.5, 0, 0.55);
}

function parseOBJ(text) {
  const vs = [], pos = [], faceGroup = [];
  let quadFaces = 0, triFaces = 0;
  // o / g / usemtl changes are hard region boundaries: two parts that
  // merely touch — or two materials meeting on a flat panel — must
  // never merge into one region no matter how well their normals agree
  const gIds = new Map();
  const gMtl = [];   // gid -> semantic name for palette keywording; falls
                     // back to the o/g part name when the file has no usemtl
  let part = '', mtl = '', gid = 0;
  const regroup = () => {
    const k = part + '\u0000' + mtl;
    if (!gIds.has(k)) { gIds.set(k, gIds.size); gMtl.push(mtl || part); }
    gid = gIds.get(k);
  };
  regroup();
  const addTri = (a, b, c) => {
    if (!vs[a] || !vs[b] || !vs[c]) return;
    pos.push(vs[a][0], vs[a][1], vs[a][2], vs[b][0], vs[b][1], vs[b][2], vs[c][0], vs[c][1], vs[c][2]);
    faceGroup.push(gid);
  };
  // faces are collected first so buried ones can be culled before emitting
  const faceList = [];
  for (const raw of text.split('\n')) {
    const t = raw.trim().split(/\s+/);
    if (t[0] === 'v') vs.push([+t[1], +t[2], +t[3]]);
    else if (t[0] === 'o' || t[0] === 'g') { part = t.slice(1).join(' '); regroup(); }
    else if (t[0] === 'usemtl') { mtl = t.slice(1).join(' '); regroup(); }
    else if (t[0] === 'f') {
      faceList.push({
        idx: t.slice(1).map(s => {
          const i = parseInt(s.split('/')[0], 10);
          return i < 0 ? vs.length + i : i - 1;
        }), g: gid });
    }
  }

  // ---- cull buried faces -----------------------------------------
  // Assembled models are piles of interpenetrating primitives, and over
  // half their faces can sit *inside* a neighbouring part. A solid
  // renderer never shows those, but this one draws edges from every
  // face, so they surface as scribble wherever they poke through.
  // A part is treated as a solid box only when it really is one (<=12
  // faces over <=8 corners), which is exactly the primitive-assembly
  // case and keeps the test from swallowing concave or hollow parts.
  let culled = 0;
  if (P.cullBuried) {
    const nG = gIds.size;
    const bb = new Float64Array(nG * 6), nFace = new Int32Array(nG);
    const verts = Array.from({ length: nG }, () => new Set());
    for (let g = 0; g < nG; g++) {
      bb[g*6] = bb[g*6+1] = bb[g*6+2] = Infinity;
      bb[g*6+3] = bb[g*6+4] = bb[g*6+5] = -Infinity;
    }
    for (const f of faceList) {
      nFace[f.g]++;
      for (const i of f.idx) {
        const v = vs[i]; if (!v) continue;
        // by POSITION, not index: exporters split a box's 8 corners into
        // 24 indices for UVs, which would hide its true corner count
        verts[f.g].add(Math.round(v[0]*1e5) + '_' + Math.round(v[1]*1e5) + '_' + Math.round(v[2]*1e5));
        for (let k = 0; k < 3; k++) {
          if (v[k] < bb[f.g*6+k]) bb[f.g*6+k] = v[k];
          if (v[k] > bb[f.g*6+3+k]) bb[f.g*6+3+k] = v[k];
        }
      }
    }
    const solid = [];
    for (let g = 0; g < nG; g++) if (nFace[g] > 0 && nFace[g] <= 12 && verts[g].size <= 8) solid.push(g);
    const eps = 1e-5;
    for (const f of faceList) {
      let cx0 = 0, cy0 = 0, cz0 = 0, n = 0;
      for (const i of f.idx) { const v = vs[i]; if (!v) continue; cx0 += v[0]; cy0 += v[1]; cz0 += v[2]; n++; }
      if (!n) continue;
      cx0 /= n; cy0 /= n; cz0 /= n;
      for (const g of solid) {
        if (g === f.g) continue;
        const b = g * 6;
        if (cx0 > bb[b]+eps && cx0 < bb[b+3]-eps && cy0 > bb[b+1]+eps && cy0 < bb[b+4]-eps &&
            cz0 > bb[b+2]+eps && cz0 < bb[b+5]-eps) { f.buried = true; culled++; break; }
      }
    }
  }

  for (const f of faceList) {
    if (f.buried) continue;
    const idx = f.idx;
    gid = f.g;                       // addTri tags each triangle with it
    if (idx.length === 4) { quadFaces++; addTri(idx[0], idx[1], idx[2]); addTri(idx[0], idx[2], idx[3]); }
    else {
      if (idx.length === 3) triFaces++;
      for (let i = 1; i < idx.length - 1; i++) addTri(idx[0], idx[i], idx[i + 1]);
    }
  }
  if (culled) console.info(
    `cull buried: dropped ${culled} of ${faceList.length} faces (${(100*culled/faceList.length).toFixed(0)}%) inside other parts`);
  // normalize: uniform-scale to a 16-unit footprint, sit on the ground, center x/z
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) {
    mn[k] = Math.min(mn[k], pos[i + k]); mx[k] = Math.max(mx[k], pos[i + k]);
  }
  const size = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]) || 1;
  const s = 16 / size;
  const cx = (mn[0] + mx[0]) / 2, cz = (mn[2] + mx[2]) / 2;
  for (let i = 0; i < pos.length; i += 3) {
    pos[i]     = (pos[i]     - cx)    * s;
    pos[i + 1] = (pos[i + 1] - mn[1]) * s;
    pos[i + 2] = (pos[i + 2] - cz)    * s;
  }
  // flat per-face normals
  const nor = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 9) {
    const ax = pos[i], ay = pos[i + 1], az = pos[i + 2];
    const ux = pos[i + 3] - ax, uy = pos[i + 4] - ay, uz = pos[i + 5] - az;
    const wx = pos[i + 6] - ax, wy = pos[i + 7] - ay, wz = pos[i + 8] - az;
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    for (let j = 0; j < 3; j++) { nor[i + j * 3] = nx; nor[i + j * 3 + 1] = ny; nor[i + j * 3 + 2] = nz; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  // mostly-triangulated models opt out of quad pairing (see put())
  geo.userData.forceTri = quadFaces < triFaces;
  geo.userData.faceGroup = Int32Array.from(faceGroup);
  geo.userData.groupMtl = gMtl;
  return geo;
}

function finishScene() {
  const { merged, lineGeom } = mergeBag();
  merged.computeBoundingSphere();
  sceneSphere = merged.boundingSphere;   // drives the adaptive far plane
  sceneRoot = new THREE.Mesh(merged, idMaterial);
  sceneRoot.frustumCulled = false;
  scene.add(sceneRoot);
  lineSegs = new THREE.LineSegments(lineGeom, lineMaterial);
  lineSegs.frustumCulled = false;
  lineSegs.visible = false;
  scene.add(lineSegs);
  markDirty();
}
buildScene();

/* ============================================================
   Render targets: ID color + depth in one, view normals in another
   ============================================================ */
// TWO target sets: a 1x set for interactive frames and (when
// supersample > 1) a full-scale set for refined stills. Keeping both
// alive means switching costs nothing per frame — no pass logic or
// shader behavior changes between them, only buffer size.
let targetsLo = null, targetsHi = null, rtScreen = null;
function makeTargetSet(scale) {
  const s = renderer.getPixelRatio() * scale;
  const w = Math.floor(innerWidth * s);
  const h = Math.floor(innerHeight * s);
  const depthTexture = new THREE.DepthTexture(w, h);
  depthTexture.type = THREE.UnsignedIntType;
  return {
    scale,
    // MRT: attachment 0 = face-ID + size, attachment 1 = paint (watercolor).
    // WebGLMultipleRenderTargets is the r160 API (pinned by the importmap);
    // WebGLRenderTarget({count: 2}) is the newer form and silently yields
    // zero textures on r160 — do not switch until three is upgraded.
    rtID: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture, depthBuffer: true,
      samples: P.msaa ? 4 : 0,
    }),
    rtNormal: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    }),
    rtInk: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    }),
  };
}
function disposeSet(t) { if (t) { t.rtID.dispose(); t.rtNormal.dispose(); t.rtInk.dispose(); } }
function makeTargets() {
  disposeSet(targetsLo); disposeSet(targetsHi);
  if (rtScreen) rtScreen.dispose();
  targetsLo = makeTargetSet(1);
  targetsHi = P.superSample > 1 ? makeTargetSet(P.superSample) : null;
  const sw = Math.floor(innerWidth * renderer.getPixelRatio());
  const sh = Math.floor(innerHeight * renderer.getPixelRatio());
  // screen-res intermediate so FXAA can run AFTER the downsample
  rtScreen = new THREE.WebGLRenderTarget(sw, sh, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  });
  markDirty();
}
makeTargets();

/* ============================================================
   Post pass — where the ink happens
   ============================================================ */
const post = new THREE.ShaderMaterial({
  uniforms: {
    tID:        { value: null },
    tNormal:    { value: null },
    tDepth:     { value: null },
    resolution: { value: new THREE.Vector2() },
    cameraNear: { value: camera.near },
    cameraFar:  { value: camera.far },
    lightDir:   { value: new THREE.Vector3() },
    inkColor:   { value: new THREE.Color(P.inkColor) },
    paperColor: { value: new THREE.Color(P.paperColor) },
    idThreshold: { value: 0 },
    lineWidth: { value: 0 }, distanceFalloff: { value: 0 },
    wobbleAmp: { value: 0 }, wobbleFreq: { value: 0 },
    hatchOn: { value: 1 }, hatchThreshold: { value: 0 }, crossThreshold: { value: 0 },
    hatchSpacing: { value: 0 }, hatchWidth: { value: 0 }, hatchAngle: { value: 0 },
    paperGrain: { value: 0 }, oneSided: { value: 0 }, coverage: { value: 0 },
    minFeature: { value: 0 }, invFovScale: { value: 1 }, keepSil: { value: 0 },
    // watercolor
    tPaint:     { value: null },
    skyColor:   { value: new THREE.Color(P.skyColor) },
    colorOn:    { value: 1 },
    washAmount: { value: 0 }, poolAmount: { value: 0 },
    inkTint: { value: 0 }, aerialFade: { value: 0 },
    invViewProj: { value: new THREE.Matrix4() },
    viewToWorldN: { value: new THREE.Matrix3() },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;

    // size as a FRACTION of screen height — not pixels, so the
    // result is identical in the interactive 1x frame and the
    // refined supersampled one.

      return smoothstep(minFeature, minFeature * 2.0, frac);

    // only draws on the NEARER surface (or, for coplanar seams, on the
    // arbitrarily-but-consistently brighter face) — halving line width
    // for free. The LOD gain uses the SMALLER of the two shapes the
    // edge separates, so a shrinking detail fades away completely
    // rather than leaving an outline around nothing.

      vec4 cn = texture2D(tID, su);
      float diff = distance(c.rgb, cn.rgb);
      if (diff <= 0.0) return 0.0;
      float ink = smoothstep(idThreshold, idThreshold * 1.8, diff);
      if (ink <= 0.0) return 0.0;

    // taking the max is identical to the other order — it just lets

      // silhouette, or object-vs-object overlap produces a color

      // averages, approximating analytic edge coverage.

                    + inkTest(uv + vec2( q.x,  q.y), o, dC));

      }

      // ---- HATCHING from the normal buffer, laid ON the surface --
      // Strokes get a per-surface frame (tangents from the world
      // normal) and world-unit coordinates, so they stick to panels
      // while orbiting and curve around pipes instead of sliding over
      // them. Faceted normals give each plane its own consistent frame,
      // and the frame seams land on face boundaries — under ink lines.
      if (hatchOn > 0.5 && !sky) {
        vec3 n = normalAt(uv);
        float shade = clamp(dot(n, normalize(lightDir)), 0.0, 1.0);
        vec3 wn = normalize(viewToWorldN * n);
        vec3 an = abs(wn);
        // triplanar pick: stripe coordinates come from the two world axes
        // spanning the surface's dominant plane. Constant per face and
        // stable on curved surfaces — a continuously rotating tangent
        // frame scrambles strokes wherever curvature is tight.
        vec2 hp = an.x > an.y && an.x > an.z ? wp.yz
                : (an.y > an.z ? wp.xz : wp.xy);
        float wSpace = hatchSpacing * 0.04;      // spacing slider -> world units
        // gentle surface-anchored wobble — amplitude well under the noise
        // feature size, or the stripes fold over into stipple

        float a = radians(hatchAngle);
        float h1 = fract((hp.x * cos(a) + hp.y * sin(a)) / wSpace);
        float h2 = fract((hp.x * cos(a + 1.5708) + hp.y * sin(a + 1.5708)) / wSpace);
        // fade strokes out as their on-screen spacing compresses toward
        // pixel size in the distance, instead of aliasing into moire
        float hFade = 0.85 * smoothstep(2.5, 6.0, wSpace / max(wpx, 1e-6));
        if (shade < hatchThreshold) ink = max(ink, step(h1, hatchWidth) * hFade);
        if (shade < crossThreshold) ink = max(ink, step(h2, hatchWidth) * hFade);
      }

      // falloff beyond 1: distance fade of ALL ink (edges + hatching)
      float fExtra = max(distanceFalloff - 1.0, 0.0);
      if (fExtra > 0.0)
        ink *= clamp(mix(1.0, clamp(14.0 / dC, 0.0, 1.0), fExtra), 0.0, 1.0);

      // ---- compose on paper --------------------------------------
      float grain = vnoise(vUv * resolution * 0.7);

      if (colorOn < 0.5) {
        // legacy path — byte-identical to the pre-color renderer

        col = mix(paper, inkColor, clamp(ink, 0.0, 1.0));
      } else if (sky) {
        col = skyColor * (1.0 - paperGrain * 0.6 * grain);
      } else {
        vec3 paint = texture2D(tPaint, uv).rgb;   // same wobbled uv as tID
        // wash mottling: pigment noise anchored in WORLD space (via the
        // depth buffer), so it sits in the fills and stays put while the
        // camera moves. Three zero-mean octaves — broad wash unevenness,
        // mid mottle, fine granulation — each fading out as its features
        // shrink toward pixel size in the distance. wpx = world size of
        // one pixel at this depth.
        float m = pigment(wp, 0.45, wpx)              * 0.55

        paint *= 1.0 - washAmount * m * 2.0;
        // pigment pooling: the detector itself at ~3.5x line radius says
        // "near an edge"; world-anchored noise breaks the band up so it
        // reads as settled pigment rather than a halo. Inherits the
        // threshold, one-sided and LOD logic for free.
        if (poolAmount > 0.0) {

          pool *= 0.55 + 0.45 * vnoise3(wp * 3.0 + 7.3);
          paint *= 1.0 - poolAmount * 0.30 * pool;

        paint *= 1.0 - paperGrain * grain;        // grain hits fills like paper

        col = mix(paint, inkT, clamp(ink, 0.0, 1.0));

        // sky. cameraFar hugs the scene sphere, so this is scene-relative.
        col = mix(col, skyColor,

  varying vec2 vUv;

    varying vec2 vUv; uniform sampler2D tDiffuse;

  depthTest: false, depthWrite: false,

  uniforms: { tDiffuse: { value: null }, resolution: { value: new THREE.Vector2() } },

    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse; uniform vec2 resolution;
    #define FXAA_REDUCE_MIN (1.0/128.0)
    #define FXAA_REDUCE_MUL (1.0/8.0)
    #define FXAA_SPAN_MAX 8.0

      vec2 px = 1.0 / resolution;

      vec3 rgbNE = texture2D(tDiffuse, vUv + vec2( 1.,-1.) * px).rgb;
      vec3 rgbSW = texture2D(tDiffuse, vUv + vec2(-1., 1.) * px).rgb;
      vec3 rgbSE = texture2D(tDiffuse, vUv + vec2( 1., 1.) * px).rgb;
      vec3 rgbM  = texture2D(tDiffuse, vUv).rgb;

      float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));
      vec2 dir = vec2(-((lumaNW + lumaNE) - (lumaSW + lumaSE)),
                       ((lumaNW + lumaSW) - (lumaNE + lumaSE)));
      float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * FXAA_REDUCE_MUL), FXAA_REDUCE_MIN);
      float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
      dir = min(vec2(FXAA_SPAN_MAX), max(vec2(-FXAA_SPAN_MAX), dir * rcpDirMin)) * px;
      vec3 rgbA = 0.5 * (texture2D(tDiffuse, vUv + dir * (1.0/3.0 - 0.5)).rgb
                       + texture2D(tDiffuse, vUv + dir * (2.0/3.0 - 0.5)).rgb);

                                     + texture2D(tDiffuse, vUv + dir *  0.5).rgb);

/* ============================================================
   Minimal orbit controls (no examples/jsm dependency)
   ============================================================ */
const orbit = { theta: 0.8, phi: 1.12, radius: 46, target: new THREE.Vector3(0, 5, 0) };
// free-flight state. yaw 0 looks down -z, matching three's default camera;
// pitch is positive looking up.
const fly = { pos: new THREE.Vector3(), yaw: 0, pitch: 0 };
const keys = new Set();
const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _at = new THREE.Vector3();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function flyForward(out) {
  const cp = Math.cos(fly.pitch);
  return out.set(-Math.sin(fly.yaw) * cp, Math.sin(fly.pitch), -Math.cos(fly.yaw) * cp);
}
// switching modes must not move the view: entering flight adopts the orbit
// camera's exact position and heading; leaving it drops the orbit target
// straight ahead at the current radius, which reproduces the same frame.
function syncCameraMode(toFly) {
  if (toFly) {
    fly.pos.copy(camera.position);
    _at.subVectors(orbit.target, camera.position).normalize();
    fly.pitch = Math.asin(clamp(_at.y, -1, 1));
    fly.yaw = Math.atan2(-_at.x, -_at.z);
  } else {
    orbit.target.copy(fly.pos).addScaledVector(flyForward(_fwd), orbit.radius);
    _at.subVectors(fly.pos, orbit.target);
    const r = _at.length() || 1;
    orbit.phi = clamp(Math.acos(clamp(_at.y / r, -1, 1)), 0.08, Math.PI / 2 - 0.02);
    orbit.theta = Math.atan2(_at.x, _at.z);

let flyBox = null, inFly = false;
function refreshHint() {
  const h = document.getElementById('hint');
  if (h) h.textContent = P.flyMode
    ? 'wasd = move · q/e = down/up · shift = fast · drag = look · wheel = dolly · f = orbit'
    : 'drag = orbit · shift-drag = pan · wheel = zoom · drop .obj to load · f = fly';
}
function setFlyMode(on) {
  on = !!on;
  P.flyMode = on;
  if (on === inFly) return;               // already there; don't re-sync the view
  syncCameraMode(on);                     // read the OLD mode's camera first
  inFly = on;
  if (flyBox) flyBox.checked = on;
  keys.clear();
  refreshHint();
  markDirty();
}

const typingIn = t => t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
addEventListener('keydown', e => {
  if (typingIn(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') { setFlyMode(!P.flyMode); return; }
  if ('wasdqe'.includes(k) && k.length === 1) { keys.add(k); markDirty(); }
  if (k === 'shift') keys.add('shift');
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys.delete(k === 'shift' ? 'shift' : k);
});
addEventListener('blur', () => keys.clear());   // don't fly off when focus leaves

let dragging = false, panning = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; panning = e.shiftKey || e.button === 2; lx = e.clientX; ly = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  if (P.flyMode) {                       // drag to look; same sign as orbit
    fly.yaw -= dx * 0.004;
    fly.pitch = clamp(fly.pitch - dy * 0.004, -1.5, 1.5);
  } else if (panning) {
    const s = orbit.radius * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    orbit.target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
  } else {
    orbit.theta -= dx * 0.005;
    orbit.phi = Math.max(0.08, Math.min(Math.PI / 2 - 0.02, orbit.phi - dy * 0.005));
  }
  markDirty();
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  if (P.flyMode) {                       // dolly along the view, so the wheel
    const step = flySpeedUnits() * 0.35; // still reads as "zoom"
    fly.pos.addScaledVector(flyForward(_fwd), -Math.sign(e.deltaY) * step);
  } else {
    orbit.radius = Math.max(6, Math.min(160, orbit.radius * (1 + Math.sign(e.deltaY) * 0.09)));

// flight speed scales with the scene so it feels the same in a 16-unit model
// and a 170-unit yard
function flySpeedUnits() {
  return (sceneSphere ? sceneSphere.radius : 100) * 0.28 * P.flySpeed;
}
let lastCamT = performance.now();

function updateCamera() {
  const nowT = performance.now();
  const dt = Math.min(0.1, (nowT - lastCamT) / 1000);   // cap so a stall can't teleport
  lastCamT = nowT;

  if (P.flyMode) {
    flyForward(_fwd);
    _rgt.set(Math.cos(fly.yaw), 0, -Math.sin(fly.yaw));
    const v = flySpeedUnits() * (keys.has('shift') ? 4 : 1) * dt;
    if (keys.has('w')) fly.pos.addScaledVector(_fwd, v);
    if (keys.has('s')) fly.pos.addScaledVector(_fwd, -v);
    if (keys.has('d')) fly.pos.addScaledVector(_rgt, v);
    if (keys.has('a')) fly.pos.addScaledVector(_rgt, -v);
    if (keys.has('e')) fly.pos.y += v;
    if (keys.has('q')) fly.pos.y -= v;
    camera.position.copy(fly.pos);
    camera.lookAt(_at.copy(fly.pos).add(_fwd));
  } else {
    if (P.autoRotate) orbit.theta += 0.0022;
    const sp = Math.sin(orbit.phi), r = orbit.radius;
    camera.position.set(
      orbit.target.x + r * sp * Math.sin(orbit.theta),
      orbit.target.y + r * Math.cos(orbit.phi),
      orbit.target.z + r * sp * Math.cos(orbit.theta));
    camera.lookAt(orbit.target);
  }

  // ---- adaptive depth range -------------------------------------
  // Depth resolution goes as z²(far-near)/(2·far·near), so a near plane
  // parked far closer than the camera can ever get is pure waste. The old
  // fixed 0.1/300 resolved only ~1.3mm at the default orbit distance, and
  // that waste is expensive here: two z-fighting faces carry *different*
  // random ID colors, so every coin-flipped pixel becomes a color step the
  // detector inks as shimmering noise.
  const centre = sceneSphere ? sceneSphere.center : orbit.target;
  const radius = sceneSphere ? sceneSphere.radius : 100;
  // orbit can never get closer to its target than the radius, so that's a safe
  // basis. Flight can be anywhere, so cap the near plane there — otherwise
  // flying far from the scene centre would clip whatever you flew up to.
  const camDist = P.flyMode ? camera.position.distanceTo(centre) : orbit.radius;
  let near = Math.max(0.05, camDist * P.nearFactor);
  if (P.flyMode) near = Math.min(near, 0.5);
  // exactly the farthest point of the bounding sphere: tight but never clips
  const far = Math.max(near + 1, camera.position.distanceTo(centre) + radius);
  if (near !== camera.near || far !== camera.far) {
    camera.near = near; camera.far = far;
    camera.updateProjectionMatrix();
  }
  // linDepth() reconstructs world distance from these, so they have to
  // follow the camera. They used to be set once at material creation,
  // which was only safe while the planes never moved.
  post.uniforms.cameraNear.value = near;
  post.uniforms.cameraFar.value = far;
}
