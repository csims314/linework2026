// flight speed scales with the scene so it feels the same around one model
// as across the whole showcase grid
function flySpeedUnits() {
  return (sceneSphere ? sceneSphere.radius : 100) * 0.28 * P.flySpeed;
}
let lastCamT = performance.now();

// per-frame player/bike simulation. Runs from updateCamera, so it only
// advances on rendered frames — tick() keeps the loop dirty while the
// player is moving, coasting or bobbing so that's every frame in practice.
function updatePlayer(dt) {
  if (!playerActor) return;
  let moved = false;
  const riding = player.state === 'riding';
  // ---- bike physics: always integrated, so a dismount at speed coasts
  // out under drag instead of freezing mid-air. Inputs only when riding.
  const maxV = 18 * P.driveSpeed * (keys.has('shift') ? 1.6 : 1);
  const accel = 22 * P.driveSpeed;
  if (riding && keys.has('w')) bike.speed = Math.min(maxV, bike.speed + accel * dt);
  else if (riding && keys.has('s')) bike.speed = Math.max(-maxV * 0.4, bike.speed - accel * dt);
  else bike.speed *= Math.exp(-1.2 * dt);
  if (Math.abs(bike.speed) < 0.01) bike.speed = 0;
  // steering authority scales with speed and reverses in reverse
  const steer = riding ? (keys.has('a') ? 1 : 0) - (keys.has('d') ? 1 : 0) : 0;
  bike.yaw += steer * dt * 2.4 * clamp(bike.speed / 6, -1, 1);
  if (bike.speed) {
    const dx = -Math.sin(bike.yaw) * bike.speed * dt;
    const dz = -Math.cos(bike.yaw) * bike.speed * dt;
    resolveMove(bike.pos, dx, dz, _mv);
    if (_mv.x || _mv.z) { bike.pos.x += _mv.x; bike.pos.z += _mv.z; moved = true; }
    else if (dx || dz) bike.speed = 0;             // rammed something
  }
  if (riding) bike.hoverT += dt;                   // bob only animates ridden
  const by = groundHeight(bike.pos.x, bike.pos.z, bike.pos.y) + BIKE_HOVER

  if (Math.abs(by - bike.pos.y) > 1e-4) { bike.pos.y = by; moved = true; }
  if (!riding) {
    // on foot: camera-relative WASD; the character eases toward the heading
    const ix = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0);
    const iz = (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0);
    if (ix || iz) {
      const inv = 1 / Math.hypot(ix, iz);
      const fx = -Math.sin(chase.theta), fz = -Math.cos(chase.theta);   // away from camera
      const rx = Math.cos(chase.theta), rz = -Math.sin(chase.theta);
      const wx = (fx * -iz + rx * ix) * inv, wz = (fz * -iz + rz * ix) * inv;
      const v = 4.2 * P.walkSpeed * (keys.has('shift') ? 1.8 : 1);
      resolveMove(player.pos, wx * v * dt, wz * v * dt, _mv);
      if (_mv.x || _mv.z) {
        player.pos.x += _mv.x; player.pos.z += _mv.z;
        player.speed = v; player.bobT += dt * v * 0.5;
        let dyaw = Math.atan2(-wx, -wz) - player.yaw;
        dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
        player.yaw += dyaw * Math.min(1, 12 * dt);
        moved = true;

    const g = groundHeight(player.pos.x, player.pos.z, player.pos.y);
    if (Math.abs(g - player.pos.y) > 1e-4) { player.pos.y = g; moved = true; }

  // stay on the ground sheet and inside the shadow/far-plane fit
  const lim = (sceneSphere ? sceneSphere.radius : 100) * 0.9;
  player.pos.x = clamp(player.pos.x, -lim, lim);
  player.pos.z = clamp(player.pos.z, -lim, lim);
  bike.pos.x = clamp(bike.pos.x, -lim, lim);
  bike.pos.z = clamp(bike.pos.z, -lim, lim);

    markDirty();

    if (keys.has('a')) fly.pos.addScaledVector(_rgt, -v);
    if (keys.has('e')) fly.pos.y += v;
    if (keys.has('q')) fly.pos.y -= v;
    camera.position.copy(fly.pos);
    camera.lookAt(_at.copy(fly.pos).add(_fwd));
  } else {
    // per-second (was 0.0022 rad/frame, refresh-rate dependent)
    if (P.autoRotate) orbit.theta += dt * P.rotateSpeed * Math.PI / 180;
    const sp = Math.sin(orbit.phi), r = orbit.radius;
    camera.position.set(
      orbit.target.x + r * sp * Math.sin(orbit.theta),
      orbit.target.y + r * Math.cos(orbit.phi),
      orbit.target.z + r * sp * Math.cos(orbit.theta));
    camera.lookAt(orbit.target);
  }

  // ---- adaptive depth range -------------------------------------
  // Depth resolution goes as z²(far-near)/(2·far·near), so a near plane
  // parked far closer than the camera can ever get is pure waste. The old
  // fixed 0.1/300 resolved only ~1.3mm at the default orbit distance, and
  // that waste is expensive here: two z-fighting faces carry *different*
  // random ID colors, so every coin-flipped pixel becomes a color step the
  // detector inks as shimmering noise.
  const centre = sceneSphere ? sceneSphere.center : orbit.target;
  const radius = sceneSphere ? sceneSphere.radius : 100;
  // orbit can never get closer to its target than the radius, so that's a safe
  // basis. Flight can be anywhere, so cap the near plane there — otherwise
  // flying far from the scene centre would clip whatever you flew up to.
  const free = P.flyMode || P.playerMode;   // camera can get close to anything
  const camDist = free ? camera.position.distanceTo(centre) : orbit.radius;
  let near = Math.max(0.05, camDist * P.nearFactor);
  if (free) near = Math.min(near, 0.5);
  // exactly the farthest point of the bounding sphere: tight but never clips
  const far = Math.max(near + 1, camera.position.distanceTo(centre) + radius);
  if (near !== camera.near || far !== camera.far) {
    camera.near = near; camera.far = far;
    camera.updateProjectionMatrix();
  }
  // linDepth() reconstructs world distance from these, so they have to
  // follow the camera. They used to be set once at material creation,
  // which was only safe while the planes never moved.
  post.uniforms.cameraNear.value = near;
  post.uniforms.cameraFar.value = far;
}

/* ============================================================
   Budget meters — how full each resource is against the point
   where it starts to hurt. The bar runs empty..HEAVY, and turns
   amber past COMFORTABLE, red once HEAVY is passed. On a modern
   GPU the ink pass is fullscreen and geometry rides in one draw
   call, so frame time is rarely the binding constraint — rebuild
   time is, because welding, region grouping and edge counting
   are all single-threaded JS.
   ============================================================ */
const SEGS = 18;
const fmtN = v => v >= 1e6 ? (v / 1e6).toFixed(2) + 'M'
               : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e5 ? 0 : 1) + 'k' : String(Math.round(v));
// Reads out as fps, but the BAR still tracks frame time, so it fills toward
// the limit like every other meter here — a full red bar means trouble even
// though a high fps number would not. The colour is what carries the meaning.
const fmtFps = v => v > 0 ? String(Math.round(1000 / v)) : 'idle';
const fmtMB = v => v >= 1e9 ? (v / 1e9).toFixed(2) + 'GB' : Math.round(v / 1e6) + 'MB';
const BUDGETS = [
  { label: 'fps',        comfortable: 8.3,   heavy: 16.7,   fmt: fmtFps },
  { label: 'shader',     comfortable: 40,    heavy: 100,    fmt: v => v.toFixed(1) },
  { label: 'tris',       comfortable: 5e5,   heavy: 1.5e6,  fmt: fmtN },
  { label: 'edges',      comfortable: 5e5,   heavy: 2e6,    fmt: fmtN },
  { label: 'regions',    comfortable: 1e5,   heavy: 3e5,    fmt: fmtN },
  { label: 'gpu mem',    comfortable: 256e6, heavy: 1024e6, fmt: fmtMB },
  { label: 'js heap',    comfortable: 512e6, heavy: 1536e6, fmt: fmtMB },
  { label: 'rebuild',    comfortable: 2000,  heavy: 5000,   fmt: v => (v / 1000).toFixed(2) + 's' },
];

// Megapixels actually shaded per ink pass. This is the number that
// predicts frame time: the ink pass is fullscreen, so supersample
// (which scales the target area) drives cost far harder than triangle
// count does. Coverage AA no longer multiplies the load — geometry and
// glass detection are single evaluations (coverage comes from the
// stroke stage) and the shadow RGSS samples are plain reads of the
// materialized mask texture.
function shaderLoad() {
  const T = targetsHi || targetsLo;
  if (!T) return 0;
  return T.rtID.width * T.rtID.height / 1e6;
}
// Attribute bytes for the merged mesh, plus every live render target.
// Targets scale with supersample squared, so they can quietly outweigh
// the geometry at high settings.
function gpuBytes() {
  let b = triCount * 3 * 46;   // see mergeBag attributes
  // four MRTs (ID, glass, glass-back, normal; 2 attachments each) +
  // 3 depths + lines + smask + ink + the 1/16-area glow pair
  const tgt = t => t ? t.rtID.width * t.rtID.height * (4 * 2 * 4 + 12 + 8 + 0.5) : 0;
  b += tgt(targetsLo) + tgt(targetsHi);
  if (rtScreen) b += rtScreen.width * rtScreen.height * 4;
  if (rtEdges) b += rtEdges.width * rtEdges.height * 8;   // edges + weights
  // shadow volume geometry + the screen-space mask target
  // (color + packed depth24/stencil8)
  b += volBytes;
  if (rtStencil) b += rtStencil.width * rtStencil.height * 8;
  return b;
}
// Geometry draws only — the fullscreen post passes aren't the interesting
// number. One merged mesh, plus the normal pass and the glass layers.
function drawCalls() {
  const glass = glassVertCount ? 2 : 0;   // front + back layers
  const normals = P.shadeOn || P.contourLine > 0 || (hasSoftRoot && P.softContact > 0) ? 1 : 0;
  return 1 + normals + glass;
}

// Which adapter actually got picked. Worth showing because the renderer asks
// for powerPreference:'high-performance', and on a dual-GPU laptop this is the
// only way to confirm the request was honoured rather than silently ignored.
(function showGPU() {
  const el = document.createElement('div');
  el.className = 'gpu';
  let name = 'gpu unknown';
  try {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const raw = (dbg && gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) || gl.getParameter(gl.RENDERER);
    // ANGLE reports e.g. "ANGLE (NVIDIA, NVIDIA GeForce RTX 4090 Laptop GPU
    // (0x00002757) Direct3D11 vs_5_0 ps_5_0, D3D11)" — keep just the device
    const m = /^ANGLE \([^,]+,\s*(.+?)(?:\s*\(0x|\s+Direct3D|\s+vs_|,\s*D3D)/.exec(raw);
    name = (m ? m[1] : raw).trim();
  } catch (e) { /* masked or unavailable — leave the fallback */ }
  el.textContent = name;
  el.title = name;
  budgetAdvList.appendChild(el);
})();

function setMeter(b, value, note, stale) {
  b.valEl.textContent = note || b.fmt(value);
  b.el.classList.toggle('stale', !!stale);
  const frac = value / b.heavy;
  const green = b.comfortable / b.heavy;
  for (let i = 0; i < SEGS; i++) {
    const at = (i + 0.5) / SEGS;                 // this segment's position on the bar
    if (at > frac) { b.segs[i].style.background = '#2b303a'; continue; }
    b.segs[i].style.background = frac > 1 ? '#d9534f'
      : at <= green ? '#5aa469' : '#e8a33d';
  }
}
// frameCount/elapsed give the real achieved frame interval rather than CPU
// submit time. The dirty-flag loop means it's only meaningful while something
// is changing, so the last live reading is held and dimmed once idle.
function updateBudget(frameCount, elapsed) {
  const live = frameCount > 1;
  if (live) lastFrameMs = elapsed / frameCount;
  setMeter(BUDGETS[0], lastFrameMs,
    live ? null : (lastFrameMs ? fmtFps(lastFrameMs) + ' idle' : 'idle'), !live);
  setMeter(BUDGETS[1], shaderLoad());
  setMeter(BUDGETS[2], triCount);
  setMeter(BUDGETS[3], edgeCount);
  setMeter(BUDGETS[4], regionCount, P.regionGroup ? null : 'off', !P.regionGroup);
  setMeter(BUDGETS[5], gpuBytes());
  const heap = performance.memory ? performance.memory.usedJSHeapSize : 0;
  setMeter(BUDGETS[6], heap, heap ? null : 'n/a', !heap);
  setMeter(BUDGETS[7], lastBuildMs);
  // "rest" is geometry construction, size metrics and the merge — included so
  // the split accounts for the whole rebuild rather than a mystery remainder
  const rest = Math.max(0, lastBuildMs - tWeld - tRegion - tEdges);
  BUDGETS[7].subEl.textContent = `weld ${Math.round(tWeld)} · group ${Math.round(tRegion)}` +
    ` · edge ${Math.round(tEdges)} · rest ${Math.round(rest)} ms`;
  const cv = renderer.domElement;
  infoEl.textContent =
    `${drawCalls()} draw${drawCalls() > 1 ? 's' : ''} · ${(cv.width * cv.height / 1e6).toFixed(2)} MP canvas` +
    (volTriCount
      ? ` · ${fmtN(volTriCount)} volume tris (${Math.round(lastVolBuildMs)} ms)` : '');
  window.__tris = triCount;
}

/* ============================================================
   Main loop
   ============================================================ */
// sun direction from the azimuth/elevation sliders (defaults match the
// old hardcoded vector); points from the scene TOWARD the light
const lightWorld = new THREE.Vector3();
function updateLightDir() {
  const az = THREE.MathUtils.degToRad(P.lightAzimuth);
  const el = THREE.MathUtils.degToRad(P.lightElevation);
  lightWorld.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
}

const _lv = new THREE.Vector3();
let frames = 0, lastStats = performance.now();
let refinePending = false, lastChange = 0, lastRender = 0;

// world size -> fraction of screen height is size * invFov / distance
function invFovScale() {
  return 1.0 / (2.0 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
}
const _lodIdx = [0, 0];   // reused: this runs once per frame
function lodIndices() {
  _lodIdx[0] = Math.max(0, LOD_METRICS.indexOf(P.lodMetric));
  _lodIdx[1] = Math.max(0, LOD_UNITS.indexOf(P.lodUnit));
  return _lodIdx;
}

// shared post-AA tail for both raster and vector paths: callers leave the
// finished image in T.rtInk. Downsamples to screen res first when
// supersampling (so AA cost never scales with it), then smaa / fxaa /
// plain filtered copy onto the canvas.
function applyPostAA(T) {
  const ssActive = T.scale !== 1;
  const aa = (P.aaMode === 'smaa' && !smaaReady) ? 'fxaa' : P.aaMode;
  let src = T.rtInk;
  // supersampled: box-filter down in linear light (resolveMat); at 1x
  // the plain 1-tap copy keeps that path byte-identical to before
  const armResolve = () => {
    resolveMat.uniforms.tDiffuse.value = T.rtInk.texture;
    resolveMat.uniforms.uOff.value.set(0.25 * T.scale / T.rtInk.width,
                                       0.25 * T.scale / T.rtInk.height);
    blitQuad.material = resolveMat;
  };
  if (aa !== 'off' && ssActive) {
    armResolve();
    renderer.setRenderTarget(rtScreen);
    renderer.render(blitScene, postCamera);
    src = rtScreen;
  }
  if (aa === 'smaa') {
    // three passes: edge flags from the ink field the post shader left
    // in src alpha (+ color deltas), then blend weights via the SMAA
    // area/search LUTs, then the weighted neighborhood blend to screen
    const iw = 1 / src.width, ih = 1 / src.height;   // SMAA convention: 1/px
    smaaEdgeMat.uniforms.tDiffuse.value = src.texture;
    smaaEdgeMat.uniforms.resolution.value.set(iw, ih);
    blitQuad.material = smaaEdgeMat;
    renderer.setRenderTarget(rtEdges);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();                 // edge pass discards non-edges
    renderer.render(blitScene, postCamera);
    smaaWeightMat.uniforms.tDiffuse.value = rtEdges.texture;
    smaaWeightMat.uniforms.tArea.value = smaaAreaTex;
    smaaWeightMat.uniforms.tSearch.value = smaaSearchTex;
    smaaWeightMat.uniforms.resolution.value.set(iw, ih);
    blitQuad.material = smaaWeightMat;
    renderer.setRenderTarget(rtWeights);
    renderer.render(blitScene, postCamera);
    smaaBlendMat.uniforms.tWeights.value = rtWeights.texture;
    smaaBlendMat.uniforms.tColor.value = src.texture;
    smaaBlendMat.uniforms.resolution.value.set(iw, ih);
    blitQuad.material = smaaBlendMat;
    renderer.setRenderTarget(null);
    renderer.render(blitScene, postCamera);
  } else if (aa === 'fxaa') {
    fxaaMat.uniforms.tDiffuse.value = src.texture;
    fxaaMat.uniforms.resolution.value.set(src.width, src.height);
    blitQuad.material = fxaaMat;
    renderer.setRenderTarget(null);
    renderer.render(blitScene, postCamera);
  } else {
    if (ssActive) armResolve();
    else {
      copyMat.uniforms.tDiffuse.value = T.rtInk.texture;
      blitQuad.material = copyMat;
    }
    renderer.setRenderTarget(null);
    renderer.render(blitScene, postCamera);
  }
}

// inverse view-projection, computed at most once per frame and shared by
// every pass that reconstructs world position from depth (the glow extract
// and the compose both used to derive it independently, from identical
// inputs). Invalidated by renderFrame before the passes run.
const _invVP = new THREE.Matrix4();
let _invVPFresh = false;
function currentInvViewProj() {
  if (!_invVPFresh) {
    _invVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
    _invVPFresh = true;
  }
  return _invVP;
}

// params that ride straight through to a like-named uniform. Hoisted out
// of renderFrame so the array literal isn't rebuilt every frame.
const PASSTHRU_UNIFORMS = ['idThreshold','lineWidth','distanceFalloff',
  'wobbleAmp','wobbleFreq','shadeThreshold','coreThreshold',
  'shadeNoise','shadeNoiseScale',
  'shadowAmount','shadowLine','shadowLineWidth',
  'paperGrain','grainScale','washAmount','washScale','poolAmount','inkTint','aerialFade',
  'glassTint','glassLine','glassBackLine','glowLift','contourLine',
  'skyGradHeight','cloudScale','cloudFade','speckleSize','speckleFade',
  'sunCore','poolRadius','paperFiber','paperFleck'];

function renderFrame(useHi) {
  updateCamera();
  updateLightDir();
  _invVPFresh = false;              // camera may have moved since last frame
  const [mi, ui] = lodIndices();
  const T = (useHi && targetsHi) ? targetsHi : targetsLo;

  if (P.wireframe && !P.showIDs) {
    // ---- WIREFRAME DEBUG VIEW: every raw triangle edge -----------
    // direct to screen like showIDs; the raster path resets the
    // materials next frame, so no restore needed here
    wireMat.color.set(P.inkColor);
    sceneRoot.material = wireMat;
    glassRoot.material = wireMat;
    glassRoot.visible = true;
    for (const a of actors) a.mesh.material = wireMat;
    renderer.setRenderTarget(null);
    renderer.setClearColor(new THREE.Color(P.paperColor), 1);
    renderer.clear();
    renderer.render(scene, camera);
    return;
  }
  sceneRoot.material = idMaterial;
  glassRoot.material = idMaterial;
  idMaterial.uniforms.uMetric.value = mi;
  idMaterial.uniforms.uUnit.value = ui;
  glassRoot.visible = false;   // opaque passes never see the glass mesh
  for (const a of actors) a.mesh.material = idMaterial;

  // pass 1a: face-ID colors + depth (opaque layer)
  renderer.setRenderTarget(T.rtID);
  renderer.setClearColor(0xffffff, 1);
  renderer.clear();
  scene.overrideMaterial = null;
  renderer.render(scene, camera);

  // pass 1b/1c: the translucent layer into its own MRT — once as-is
  // (nearest surface) and once with front faces culled (nearest BACK
  // face), so interior edges can draw through the glass. Empty scenes
  // just clear, which keeps the compose branches exact no-ops — but a
  // scene with no glass at all would re-clear two full-res MRTs plus
  // their depth every frame forever, so once they are known-empty the
  // clears are skipped until something actually draws into them again.
  if (glassVertCount || !T.glassClean) {
    renderer.setRenderTarget(T.rtGlass);
    renderer.clear();
    renderer.setRenderTarget(T.rtGlassBack);
    renderer.clear();
    T.glassClean = !glassVertCount;
  }
  if (glassVertCount) {
    sceneRoot.visible = false;
    glassRoot.visible = true;
    // actors are opaque-only: keep them out of the glass MRT or the
    // compose step draws glass edges around them
    for (const a of actors) a.group.visible = false;
    renderer.setRenderTarget(T.rtGlass);
    renderer.render(scene, camera);
    idMaterial.side = THREE.BackSide;
    renderer.setRenderTarget(T.rtGlassBack);
    renderer.render(scene, camera);
    idMaterial.side = THREE.DoubleSide;
    sceneRoot.visible = true;
    glassRoot.visible = false;
    for (const a of actors) a.group.visible = true;
  }

  // debug view: show the ID buffer itself instead of inking it. This is what
  // the detector actually sees, so region grouping, similarity, buried-face
  // culling and overlapping geometry all become directly visible — a flat
  // block of colour is one region, and speckle is surfaces fighting.
  if (P.showIDs) {
    // window.__showPaint = true in the console blits the paint attachment
    // instead; window.__showGlass = true swaps to the glass layer's MRT
    const rt = window.__showGlass ? T.rtGlass : T.rtID;
    copyMat.uniforms.tDiffuse.value = rt.texture[window.__showPaint ? 1 : 0];
    blitQuad.material = copyMat;
    renderer.setRenderTarget(null);
    renderer.render(blitScene, postCamera);
    return;
  }

  // cast shadows — stencil shadow volumes: view-dependent, so the mask
  // is regenerated every frame (this loop only renders on dirty anyway).
  // Glass is already hidden and casts nothing. Sequence: depth prepass +
  // two volume passes under an infinite-far projection, then a stencil-
  // gated fullscreen extract into the mask's color attachment.
  if (P.castShadow && P.shadeOn) {
    if (volDirty) rebuildShadowVolumes();
    // actors can be hidden (or culled from the opaque pass); their
    // volumes must agree or they'd cast from nowhere
    for (const l of volLinks) l.mesh.visible = l.srcRoot.visible;
    ensureStencilTarget(T.rtID.width, T.rtID.height);
    volUniforms.uLightDir.value.copy(lightWorld).negate();   // direction light travels
    applyInfiniteProjection(camera);
    const prevAuto = renderer.autoClear;
    renderer.autoClear = false;   // would wipe the stencil between passes
    renderer.setRenderTarget(rtStencil);
    renderer.setClearColor(0x000000, 1);   // 0 = lit
    renderer.clear(true, true, true);
    scene.overrideMaterial = volDepthMat;  // opaque state matches pass 1a
    renderer.render(scene, camera);
    scene.overrideMaterial = null;
    volScene.overrideMaterial = volBackMat;
    renderer.render(volScene, camera);
    volScene.overrideMaterial = volFrontMat;
    renderer.render(volScene, camera);
    volScene.overrideMaterial = null;
    blitQuad.material = stencilExtractMat;
    renderer.render(blitScene, postCamera);
    renderer.autoClear = prevAuto;
    // restore the finite projection — everything downstream (normal
    // pass, invViewProj reconstruction) uses the standard matrix
    camera.updateProjectionMatrix();
    _invVPFresh = false;            // the patched matrix must not be cached
  }

  // pass 2: view-space normals — needed by shading and by the
  // self-overlap contour detector (glass is invisible here: the
  // translucent layer takes no shading and no contours). Rendered before
  // the shadow melt below, which reads normals for the terminator term.
  if (P.shadeOn || P.contourLine > 0 || (hasSoftRoot && P.softContact > 0) ||
      P.groundSpeckle > 0 || P.minFeature > 0 || P.debugView !== 'off') {
    renderer.setRenderTarget(T.rtNormal);
    renderer.setClearColor(0x8080ff, 1);
    renderer.clear();
    scene.overrideMaterial = normalMaterial;
    renderer.render(scene, camera);
    scene.overrideMaterial = null;
  }

  // shadow silhouette smoothing: extract the shadow mask at half
  // res, then blur -> re-threshold -> blur. Blur+threshold is
  // morphological smoothing — the edge becomes the 50% level-set of a
  // smooth field, so features smaller than the radius melt away and
  // corners round into painted lobes; doing it twice approximates
  // curvature flow (wiggles vanish, large shapes barely move). Fully
  // deterministic — no noise anywhere on this path. Hard shade mode
  // folds the lambert terminator into the mask, so the pass runs even
  // when cast shadows are off.
  const castSmooth = P.shadeOn && P.shadowSmoothPx > 0 &&
                     (P.castShadow || P.shadeStyle === 'hard');
  // melt radii in WORLD units, both driven by the one slider:
  //   meltW  — terminator melt radius (slider/20; 12 ≈ 0.6 units)
  //   penMax — cast melt radius (slider/10), also the G normalization
  // Scenes are size-normalized, so absolute units hold across them.
  const meltW = P.shadowSmoothPx / 20;
  const penMaxR = Math.max(P.shadowSmoothPx / 10, meltW);
  if (castSmooth) {
    const cm = castMaskMat.uniforms;
    cm.tDepth.value = T.rtID.depthTexture;
    // terminator melt uses the shade normal too, so its rounded edge
    // agrees with the compose step's boundary
    cm.tNormal.value = T.rtNormal.texture[P.smoothShade ? 1 : 0];
    cm.tID.value = T.rtID.texture[0];
    cm.lightDir.value.copy(lightWorld).transformDirection(camera.matrixWorldInverse);
    cm.shadeThreshold.value = P.shadeThreshold;
    cm.selfShade.value = P.shadeStyle === 'hard' ? 1 : 0;
    cm.castOn.value = P.castShadow ? 1 : 0;
    cm.tStencilMask.value = rtStencil ? rtStencil.texture : null;
    cm.uPenMax.value = P.shadowSmoothPx / 10;
    cm.uTermR.value = meltW;
    cm.uMaxR.value = penMaxR;
    blitQuad.material = castMaskMat;
    renderer.setRenderTarget(T.rtMaskA);
    renderer.render(blitScene, postCamera);
    // depth-aware blur: the kernel reach scales with 1/depth in the
    // shader so the melt is meltW world units everywhere. uAxis is one
    // SCREEN pixel of UV, keeping the radius in screen terms regardless
    // of mask res or supersample factor
    const mb = maskBlurMat.uniforms;
    mb.tDepth.value = T.rtID.depthTexture;
    mb.cameraNear.value = camera.near;
    mb.cameraFar.value = camera.far;
    mb.uPxScale.value = penMaxR * invFovScale() * rtScreen.height;
    const blurAtoB = (src, dst, mid) => {
      mb.tDiffuse.value = src.texture;
      mb.uAxis.value.set(1 / rtScreen.width, 0);
      blitQuad.material = maskBlurMat;
      renderer.setRenderTarget(mid);
      renderer.render(blitScene, postCamera);
      mb.tDiffuse.value = mid.texture;
      mb.uAxis.value.set(0, 1 / rtScreen.height);
      renderer.setRenderTarget(dst);
      renderer.render(blitScene, postCamera);
    };
    blurAtoB(T.rtMaskA, T.rtMaskA, T.rtMaskB);       // round 1: A -> (B) -> A
    maskThreshMat.uniforms.tDiffuse.value = T.rtMaskA.texture;
    blitQuad.material = maskThreshMat;
    renderer.setRenderTarget(T.rtMaskB);             // re-threshold: A -> B
    renderer.render(blitScene, postCamera);
    blurAtoB(T.rtMaskB, T.rtMaskB, T.rtMaskA);       // round 2: B -> (A) -> B
  }

  // shade-field blur: smooth the CONTINUOUS lighting value, threshold
  // later in the compose — the terminator's PATH stops staircasing on
  // coarse Gouraud meshes while its edge stays hard. The radius is
  // PER-CLASS: organic surfaces melt by organicBlurPx, hard-surface
  // machinery by hardBlurPx (default 0 = untouched). Skipped while the
  // melt owns the terminator (it also owns the rtMask pair then).
  const shadeField = (P.shadeOn && !castSmooth &&
                      (P.organicBlurPx > 0 || P.hardBlurPx > 0)) ||
                     P.debugView === 'field';
  if (shadeField) {
    shadeFieldMat.uniforms.tNormal.value = T.rtNormal.texture[P.smoothShade ? 1 : 0];
    shadeFieldMat.uniforms.tID.value = T.rtID.texture[0];
    shadeFieldMat.uniforms.lightDir.value.copy(lightWorld)
      .transformDirection(camera.matrixWorldInverse);   // view space, like the normals
    blitQuad.material = shadeFieldMat;
    renderer.setRenderTarget(T.rtMaskA);
    renderer.render(blitScene, postCamera);
    // separable gaussian; steps in half-res texels so the reach ≈ 2×
    // the per-class slider px
    const sb = shadeBlurMat.uniforms;
    sb.uOrgStep.value = 0.5 * P.organicBlurPx;
    sb.uHardStep.value = 0.5 * P.hardBlurPx;
    sb.tDiffuse.value = T.rtMaskA.texture;
    sb.uAxis.value.set(1 / T.rtMaskA.width, 0);
    blitQuad.material = shadeBlurMat;
    renderer.setRenderTarget(T.rtMaskB);
    renderer.render(blitScene, postCamera);
    sb.tDiffuse.value = T.rtMaskB.texture;
    sb.uAxis.value.set(0, 1 / T.rtMaskA.height);
    renderer.setRenderTarget(T.rtMaskA);
    renderer.render(blitScene, postCamera);
  }

  // pass 2b: glow halo — extract emissive pixels (plus the sun disc on
  // unoccluded sky pixels), blur at quarter res. The sun blooms through
  // the SAME pipeline as the lamps — no separate analytic halo.
  const glowActive = hasGlow || (P.colorOn && P.sunSize > 0);
  if (glowActive) {
    const ge = glowExtractMat.uniforms;
    ge.tDiffuse.value = T.rtID.texture[1];
    ge.tDepth.value = T.rtID.depthTexture;
    ge.invViewProj.value.copy(currentInvViewProj());
    ge.sunDir.value.copy(lightWorld);
    ge.sunSize.value = THREE.MathUtils.degToRad(P.sunSize);
    ge.cloudAmt.value = P.clouds;
    ge.cloudScale.value = P.cloudScale;
    ge.cloudFade.value = P.cloudFade;
    ge.cloudStretch.value = P.cloudStretch;
    ge.cloudDir.value = THREE.MathUtils.degToRad(P.cloudStretchDir);
    const sgB = hex2u8(P.sunColor);
    ge.sunColor.value.setRGB(sgB[0] / 255, sgB[1] / 255, sgB[2] / 255);
    blitQuad.material = glowExtractMat;
    renderer.setRenderTarget(T.rtGlowA);
    renderer.render(blitScene, postCamera);
    blurMat.uniforms.tDiffuse.value = T.rtGlowA.texture;
    blurMat.uniforms.uDir.value.set(P.haloSize / T.rtGlowA.width, 0);
    blitQuad.material = blurMat;
    renderer.setRenderTarget(T.rtGlowB);
    renderer.render(blitScene, postCamera);
    blurMat.uniforms.tDiffuse.value = T.rtGlowB.texture;
    blurMat.uniforms.uDir.value.set(0, P.haloSize / T.rtGlowA.height);
    renderer.setRenderTarget(T.rtGlowA);
    renderer.render(blitScene, postCamera);
  }

  // pass 3: ink
  const u = post.uniforms;
  u.tID.value = T.rtID.texture[0];
  u.tPaint.value = T.rtID.texture[1];
  u.tNormal.value = T.rtNormal.texture[0];
  u.tNormalS.value = T.rtNormal.texture[P.smoothShade ? 1 : 0];
  u.tDepth.value = T.rtID.depthTexture;
  u.tGlassID.value = T.rtGlass.texture[0];
  u.tGlassPaint.value = T.rtGlass.texture[1];
  u.tGlassDepth.value = T.rtGlass.depthTexture;
  u.tGlassBackID.value = T.rtGlassBack.texture[0];
  u.tGlassBackDepth.value = T.rtGlassBack.depthTexture;
  u.tGlow.value = T.rtGlowA.texture;
  u.haloStrength.value = glowActive ? P.haloStrength : 0;   // exact no-op without emitters
  u.resolution.value.set(T.rtID.width, T.rtID.height);
  // grain frequency locks to DISPLAY pixels: supersampled stills keep
  // their tooth instead of averaging it away in the downsample
  u.ssScale.value = T.scale;
  u.lightDir.value.copy(_lv.copy(lightWorld).transformDirection(camera.matrixWorldInverse));
  u.inkColor.value.set(P.inkColor);
  u.paperColor.value.set(P.paperColor);
  for (const k of PASSTHRU_UNIFORMS) u[k].value = P[k];
  // smoothstep(a, b) needs a < b — keep the aerial ramp well-ordered
  u.aerialNear.value = P.aerialNear;
  u.aerialFar.value = Math.max(P.aerialFar, P.aerialNear + 0.02);
  u.contourCos.value = Math.cos(THREE.MathUtils.degToRad(P.contourAngle));
  u.castOn.value = P.castShadow && P.shadeOn ? 1 : 0;
  u.tStencilMask.value = rtStencil ? rtStencil.texture : null;
  // wobble amplitude as a fixed WORLD size (16 texels of a 2048 map over
  // the whole scene window — the look this inherited), so the shadow's
  // edge texture is scale-stable across scenes
  u.stencilWobW.value = 16 * (sceneSphere ? sceneSphere.radius : 100) / 2048;
  u.tCastMask.value = T.rtMaskB.texture;
  u.castSmoothOn.value = castSmooth ? 1 : 0;
  u.tShadeField.value = T.rtMaskA.texture;
  u.shadeFieldOn.value = shadeField ? 1 : 0;
  // uMaxR world units -> screen px at unit depth; castMaskAt scales this
  // by the per-pixel G radius for its AA band (band ~ 1.2 / on-screen r)
  u.castPxScale.value = penMaxR * invFovScale() * rtScreen.height;
  u.softShade.value = P.shadeStyle === 'soft' ? 1 : 0;
  // setRGB with raw bytes skips the linear conversion .set(hex) would do,
  // keeping the uniform in the same raw display space as the aPaint bytes
  setRawHex(u.skyColor.value, P.skyColor);
  setRawHex(u.horizonColor.value, P.skyHorizon);
  u.cloudAmt.value = P.clouds;
  u.cloudStretch.value = P.cloudStretch;
  u.cloudDir.value = THREE.MathUtils.degToRad(P.cloudStretchDir);
  u.speckleAmt.value = P.groundSpeckle;
  u.sunDir.value.copy(lightWorld);     // the sun IS the light source
  u.sunSize.value = THREE.MathUtils.degToRad(P.sunSize);
  setRawHex(u.sunColor.value, P.sunColor);
  u.colorOn.value = P.colorOn ? 1 : 0;
  // world reconstruction for pigment noise (pass 1 already refreshed
  // camera.matrixWorldInverse via renderer.render)
  u.invViewProj.value.copy(currentInvViewProj());
  u.viewToWorldN.value.setFromMatrix4(camera.matrixWorld);   // view-space normals -> world
  u.shadeOn.value = P.shadeOn ? 1 : 0;
  u.oneSided.value = P.oneSided ? 1 : 0;
  u.coverage.value = P.coverageAA ? 1 : 0;
  // active only when the scene actually contains soft-rooted geometry,
  // so ordinary scenes skip the flag checks (and the normal pass isn't
  // forced on for nothing)
  u.softContact.value = hasSoftRoot ? P.softContact : 0;
  u.groundY.value = groundDatum;   // for the root-height ink fade
  u.minFeature.value = P.minFeature / 100;   // slider is a percentage
  u.invFovScale.value = invFovScale();
  u.keepSil.value = P.keepSilhouettes ? 1 : 0;

  // pass 2b2: the SHADOW-MASK PASS — one fullscreen evaluation of
  // shadowMaskAt (R) plus the AA'd cast fill (G) into rtSMask; the
  // skeleton's shadow probes, the domain view, and both compose
  // branches then read the texture. Shares post's uniform value
  // objects, so it must run after the uniform setup above. Skipped
  // when nothing consumes it (shadeOn gates every consumer).
  if (P.shadeOn || P.debugView === 'smask') {
    blitQuad.material = maskMat;
    renderer.setRenderTarget(T.rtSMask);
    renderer.render(blitScene, postCamera);
  }
  u.tSMask.value = T.rtSMask.texture;

  // pass 2c: the LINE PASS — stage A detects every boundary (geometry,
  // glass, shadow, speckle, sky) as a 1px skeleton; stage B strokes it
  // with a round nib of the shared per-pixel radius. The compose below
  // only reads the result. Runs after the uniform setup above because
  // both materials share post's uniform value objects.
  blitQuad.material = skelMat;
  renderer.setRenderTarget(T.rtSkel);
  renderer.render(blitScene, postCamera);
  u.tSkel.value = T.rtSkel.texture;
  // the quarter-res max-downsample only exists to let wide nibs skip
  // their dilation loop. Stage B's radius is w - 1 and w never exceeds
  // the value below, so whenever that is <= 1 texel EVERY pixel takes
  // the single-tap hairline path and rtSkelLo is never sampled — which
  // is the case for the whole default line-width range. Skip the pass.
  const wMax = T.scale * Math.max(
    P.lineWidth * (1 + 0.6 * Math.min(P.distanceFalloff, 1)), 0.5);
  if (wMax > 1) {
    skelDownMat.uniforms.tDiffuse.value = T.rtSkel.texture;
    skelDownMat.uniforms.uPx.value.set(1 / T.rtSkel.width, 1 / T.rtSkel.height);
    blitQuad.material = skelDownMat;
    renderer.setRenderTarget(T.rtSkelLo);
    renderer.render(blitScene, postCamera);
  }
  u.tSkelLo.value = T.rtSkelLo.texture;
  blitQuad.material = lineMat;
  renderer.setRenderTarget(T.rtLines);
  renderer.render(blitScene, postCamera);
  u.tLines.value = T.rtLines.texture;

  // debug bar: blit the selected buffer (or the class view) instead of
  // composing ink. Runs AFTER every pre-pass so each view is fresh —
  // 'melt' and 'stencil' show their last contents when that path is off.
  if (P.debugView !== 'off') {
    renderer.setRenderTarget(null);
    if (P.debugView === 'classes') {
      const du = dbgClassMat.uniforms;
      du.tID.value = T.rtID.texture[0];
      du.tDepth.value = T.rtID.depthTexture;
      du.cameraNear.value = camera.near;
      du.cameraFar.value = camera.far;
      blitQuad.material = dbgClassMat;
    } else if (P.debugView === 'depth') {
      const du = dbgDepthMat.uniforms;
      du.tDepth.value = T.rtID.depthTexture;
      du.cameraNear.value = camera.near;
      du.cameraFar.value = camera.far;
      blitQuad.material = dbgDepthMat;
    } else if (P.debugView === 'regions') {
      // shares post's uniforms, which the setup above already filled
      blitQuad.material = domainMat;
    } else if (P.debugView === 'ink') {
      const du = dbgInkMat.uniforms;
      du.tLines.value = T.rtLines.texture;
      du.tDepth.value = T.rtID.depthTexture;
      du.tGlassDepth.value = T.rtGlass.depthTexture;
      du.tGlassBackDepth.value = T.rtGlassBack.depthTexture;
      du.cameraNear.value = camera.near;
      du.cameraFar.value = camera.far;
      du.glassLine.value = P.glassLine;
      du.glassBackLine.value = P.glassBackLine;
      blitQuad.material = dbgInkMat;
    } else {
      const tex = {
        ids: T.rtID.texture[0], paint: T.rtID.texture[1],
        glass: T.rtGlass.texture[0],
        normals: T.rtNormal.texture[0], 'shade n': T.rtNormal.texture[1],
        field: T.rtMaskA.texture, melt: T.rtMaskB.texture,
        stencil: rtStencil ? rtStencil.texture : null,
        smask: T.rtSMask.texture,
        glow: T.rtGlowA.texture,
        skel: T.rtSkel.texture,
        lines: T.rtLines.texture,
      }[P.debugView];
      if (!tex) return;
      // rtSkel/rtLines alpha carries speckle fill — force opaque
      const cm = (P.debugView === 'lines' || P.debugView === 'skel')
        ? copyOpaqueMat : copyMat;
      cm.uniforms.tDiffuse.value = tex;
      blitQuad.material = cm;
    }
    renderer.render(blitScene, postCamera);
    return;
  }

  // route through rtInk when the image needs a filtered resample.
  // smaa falls back to fxaa until its lookup textures finish decoding.
  const ssActive = T.scale !== 1;
  const aa = (P.aaMode === 'smaa' && !smaaReady) ? 'fxaa' : P.aaMode;
  const needsBlit = aa !== 'off' || ssActive;
  post.uniforms.edgeToAlpha.value = aa === 'smaa' ? 1 : 0;
  renderer.setRenderTarget(needsBlit ? T.rtInk : null);
  renderer.render(postScene, postCamera);
  if (needsBlit) applyPostAA(T);
}

function tick() {
  const now = performance.now();
  // flight has to keep rendering while a movement key is held, otherwise the
  // dirty-flag loop would idle mid-move
  if (P.autoRotate && !P.flyMode && !P.playerMode) dirty = true;
  if ((P.flyMode || P.playerMode) && keys.size) dirty = true;
  // riding = continuous hover bob; bike.speed = coasting after key release;
  // camEasing = the chase camera's smoothing tail
  if (P.playerMode && (player.state === 'riding' || Math.abs(bike.speed) > 0.01 || camEasing))
    dirty = true;
  const prog = P.progressive && targetsHi;
  let counted = false;
  if (dirty) {
    renderFrame(!prog);            // interactive frame: 1x while progressive
    dirty = false;
    refinePending = !!prog;
    lastChange = now; lastRender = now; counted = true;
  } else if (refinePending && now - lastChange > 250) {
    renderFrame(true);             // the supersampled still
    refinePending = false;
    lastRender = now; counted = true;
  } else if (now - lastRender > 2000 && idleRefreshes < 2) {
    // safety refresh: catches anything that finished settling without
    // marking dirty (async texture decodes, font/layout driven resizes).
    // Bounded, because an unbounded version re-runs the WHOLE pass chain
    // every 2s forever on a page where nothing is changing.
    renderFrame(true);
    lastRender = now; idleRefreshes++;
  }
  if (counted) frames++;
  if (now - lastStats > 500) {
    updateBudget(frames, now - lastStats);
    frames = 0; lastStats = now;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ============================================================
   Loading the model library + the scene menu (top-left).

   models/manifest.json is the registry: drop a .obj in models/,
   add a line to the manifest, and it appears everywhere. Two ways
   in, because there is no way to list a directory over plain HTTP:

     served over http(s) — fetch the manifest, then each file
     opened from file://  — fetch is blocked, so the "models
                            folder…" picker (File System Access)
                            reads the folder directly

   Whatever loads is cached in IndexedDB with its text, so the
   scene list is populated the instant the page loads on the next
   run, before any I/O finishes.
   ============================================================ */
const objInput = document.createElement('input');
objInput.type = 'file'; objInput.accept = '.obj'; objInput.style.display = 'none';
function takeDropped(name, text) {
  droppedObj = { file: name, name: name.replace(/\.obj$/i, ''), text };
  P.scene = 'drop';
  refreshSceneMenu();
  buildScene();
}
objInput.addEventListener('change', async () => {
  const f = objInput.files[0];
  if (f) takeDropped(f.name, await f.text());
});
document.body.appendChild(objInput);
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && /\.obj$/i.test(f.name)) takeDropped(f.name, await f.text());
});

// tiny IndexedDB keyval store (persists the model cache + folder handle)
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('moebius-lines', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(k) {
  const d = await idb();
  return new Promise((res, rej) => {
    const q = d.transaction('kv', 'readonly').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}

let pendingDirHandle = null;   // stored handle awaiting a permission click
let modelsSource = 'loading';  // shown in the menu: loading / http / folder / none

/* The cache carries full .obj text, so the scene list is usable the
   instant the page loads. That text runs to megabytes, so two guards:
   skip the write when a load matches what's already stored (the normal
   case on every reload), and cap the total so one huge library can't
   bloat the store. Files past the cap are dropped from the CACHE only;
   the load right behind it still has them. */
const CACHE_BUDGET = 96e6;   // characters of .obj text
let cachedSig = '';

function modelsSig(list) {
  return list.map(m => m.file + ':' + m.text.length).join(',');
}

function cacheModels(list) {
  const sig = modelsSig(list);
  if (sig === cachedSig) return;          // already stored, unchanged
  cachedSig = sig;
  let budget = CACHE_BUDGET, dropped = 0;
  const slim = [];
  for (const m of list) {
    if (m.text.length > budget) { dropped++; continue; }
    budget -= m.text.length;
    slim.push(m);
  }
  if (dropped) console.info(
    `model cache: ${dropped} file(s) over the ${CACHE_BUDGET / 1e6} MB budget, not cached`);
  idbSet('models', { sig, list: slim }).catch(() => {});
}

function setModels(list, source) {
  models = list;
  modelsSource = source;
  cacheModels(list);
  refreshSceneMenu();
  buildScene();
  // player mode may have come up before the library did, leaving the
  // hoverbike without a mesh — this is the retry
  if (P.playerMode) spawnActors();
}

// ---- http path: manifest, then every file it lists ----
async function fetchModels() {
  const r = await fetch('models/manifest.json');
  if (!r.ok) throw new Error('manifest ' + r.status);
  const list = (await r.json()).models || [];
  const out = await Promise.all(list.map(async e => {
    try {
      const f = await fetch('models/' + e.file);
      return f.ok ? { ...e, text: await f.text() } : null;
    } catch (err) { return null; }        // missing file: that model just doesn't appear
  }));
  return out.filter(Boolean);
}

// ---- folder path: walk a picked directory for .obj files ----
// A manifest.json inside the folder wins (order, display names, shade
// classes); without one, every .obj found is included and classified by
// filename, so pointing this at any folder of models works.
async function scanModelsDir(dir) {
  let manifest = null;
  const files = new Map();
  const walk = async h => {
    for await (const [name, ent] of h.entries()) {
      if (ent.kind === 'directory') { await walk(ent); continue; }
      if (/\.obj$/i.test(name)) {
        if (!files.has(name)) files.set(name, await (await ent.getFile()).text());
      } else if (name === 'manifest.json' && !manifest) {
        try { manifest = JSON.parse(await (await ent.getFile()).text()); }
        catch (e) { console.error('models/manifest.json is not valid JSON', e); }
      }
    }
  };
  await walk(dir);
  if (manifest && manifest.models)
    return manifest.models.filter(e => files.has(e.file))
                          .map(e => ({ ...e, text: files.get(e.file) }));
  return [...files.keys()].sort((a, b) => a.localeCompare(b))
    .map(file => ({ file, name: file.replace(/\.obj$/i, ''), text: files.get(file) }));
}

async function pickModelsFolder() {
  if (!window.showDirectoryPicker) {
    console.error('This browser lacks the File System Access API (use Chrome/Edge).');
    return;
  }
  try {
    const dir = await window.showDirectoryPicker();
    idbSet('modelsDir', dir).catch(() => {});
    setModels(await scanModelsDir(dir), 'folder');
  } catch (e) { /* user cancelled the picker */ }
}

async function reloadPendingModels() {
  try {
    if (await pendingDirHandle.requestPermission({ mode: 'read' }) === 'granted') {
      const h = pendingDirHandle;
      pendingDirHandle = null;
      setModels(await scanModelsDir(h), 'folder');
    }
  } catch (e) { console.error(e); }
}

function refreshSceneMenu() {
  const list = document.getElementById('sceneList');
  if (!list) return;
  list.innerHTML = '';
  const add = (label, active, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (active) b.className = 'active';
    b.addEventListener('click', fn);
    list.appendChild(b);
  };
  const pick = key => () => { P.scene = key; refreshSceneMenu(); buildScene(); };
  const soloScene = P.scene.startsWith('model:');
  add(`showcase${models.length ? ` (${models.length})` : ''}`,
      !soloScene && P.scene !== 'drop', pick('showcase'));
  models.forEach((m, i) =>
    add('  ' + (m.name || m.file), P.scene === 'model:' + i, pick('model:' + i)));
  if (droppedObj) add(droppedObj.name, P.scene === 'drop', pick('drop'));
  if (!models.length) {
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = modelsSource === 'loading' ? 'loading models…'
      : 'no models — serve this folder over http, or pick one below';
    list.appendChild(note);
  }
  const div = document.createElement('div'); div.className = 'div'; list.appendChild(div);
  add('models folder…', false, pickModelsFolder);
  if (pendingDirHandle) add('reload models ↻', false, reloadPendingModels);
  add('load obj…', false, () => objInput.click());
}
refreshSceneMenu();
refreshHint();

/* Startup: show the cached library immediately, then load for real.
   The http fetch is the normal path; if it fails (file://, or no
   models/ next to index.html) the stored folder handle takes over —
   silently when the browser kept the permission, else via one
   "reload models" click. */
(async () => {
  try {
    const cached = await idbGet('models');
    if (cached && cached.list && cached.list.length && !models.length) {
      models = cached.list;
      cachedSig = cached.sig;   // an identical load now writes nothing
      modelsSource = 'cache';
      refreshSceneMenu();
      buildScene();
    }
  } catch (e) { /* no cache yet */ }

  try {
    const fetched = await fetchModels();
    if (fetched.length) { setModels(fetched, 'http'); return; }
  } catch (e) { /* file:// or no models/ folder — fall through to the picker */ }

  try {
    const h = await idbGet('modelsDir');
    if (!h || !h.queryPermission) throw 0;
    if (await h.queryPermission({ mode: 'read' }) === 'granted') {
      setModels(await scanModelsDir(h), 'folder');
    } else {
      pendingDirHandle = h;
      if (modelsSource === 'loading') modelsSource = 'none';
      refreshSceneMenu();
    }
  } catch (e) {
    if (modelsSource === 'loading') modelsSource = 'none';
    refreshSceneMenu();
  }
})();

// dev hooks (used by headless tests; harmless in normal use)
window.__P = P; window.__makeTargets = makeTargets; window.__buildScene = buildScene;
window.__stats = () => ({ tris: triCount, edges: edgeCount, regions: regionCount });
window.__render = (hi = true) => renderFrame(hi);   // headless: rAF is frozen when hidden
window.__orbit = orbit;                            // headless camera placement
window.__updateBudget = updateBudget;
window.__fly = fly; window.__keys = keys; window.__setFlyMode = setFlyMode;
window.__camera = camera;
window.__smaa = () => ({ ready: smaaReady, rtEdges, rtWeights });
window.__player = player; window.__bike = bike; window.__chase = chase;
window.__P = P;   // live param access from the console
window.__markDirty = markDirty;
window.__setPlayerMode = setPlayerMode; window.__mount = tryMountToggle;
window.__updatePlayer = updatePlayer; window.__actors = actors;
window.__scene = scene; window.__renderer = renderer;
window.__setModels = m => setModels(m, 'test');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  makeTargets();
});
</script>
</body>
</html>
