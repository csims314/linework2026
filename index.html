<script type="module">
import * as THREE from 'three';

/* ============================================================
   Params — everything the control panel drives
   ============================================================ */
const P = {
  // edge extraction — face-ID only: every face boundary is a line
  idThreshold: 0.005,
  // soft-rooted geometry: contact-line fade strength (0 = off).
  // Scale-invariant plane test, not a raw depth threshold.
  softContact: 1,
  // region grouping: neighbors that share a color draw no line between them
  regionGroup: true, similarity: 0.7,
  // self-overlap contours from the normal buffer: ink where visible
  // surface orientation jumps discontinuously (a fold crossing itself),
  // which the ID detector can't see inside a single region. 0 = off.
  contourLine: 1, contourAngle: 80,
  // debug: draw the face-ID buffer itself instead of the ink
  showIDs: false,
  // debug: raw triangle wireframe on paper (ink-colored lines)
  wireframe: false,
  // feature LOD: fade a line when the shapes it separates are small on screen.
  // minFeature is a % of screen height; 0 disables the whole feature.
  minFeature: 0.4, lodMetric: 'area', lodUnit: 'region', keepSilhouettes: false,
  // near plane as a fraction of the orbit distance — raise it to buy depth
  // precision (less z-fighting), lower it if close geometry starts clipping
  nearFactor: 0.02,
  // drop loaded-model faces sealed inside another part (assembled models)
  cullBuried: false,
  // line look
  lineWidth: 0.5, distanceFalloff: 1.25,
  wobbleAmp: 0, wobbleFreq: 0.08,
  // shading (hatch strokes or flat shadows)
  hatchOn: true, hatchThreshold: 0.45, crossThreshold: 0.02,
  hatchSpacing: 10.0, hatchWidth: 0.05, hatchAngle: 45,
  // cast shadows: one directional sun. The map re-renders only when the
  // light moves or the camera shifts its fitted light window; a still
  // view is as cheap as a baked map. Orbit animates the azimuth.
  castShadow: true, lightAzimuth: 303, lightElevation: 50,
  // shadowSmoothPx simplifies the cast-shadow silhouette: the shadow
  // mask is blurred by this many screen pixels and re-thresholded at
  // 50%, twice — features smaller than the radius vanish and corners
  // round into painted lobes. 0 = exact geometry (single-tap path).
  lightOrbit: false, shadowBias: 0.0015, shadowRes: '2048', shadowSmoothPx: 12,
  // stroke breakup: displacement noise amount (past ~1 strokes start
  // folding into stipple — allowed, it reads as dry-brush) and the
  // world-space feature size of that noise. hatchBreak erodes strokes
  // entirely where the surface noise dips below it: 0 = solid strokes,
  // 1 = almost fully eaten away.
  hatchNoise: 0, hatchNoiseScale: 1, hatchBreak: 0,
  // shading style: 'hatch' draws strokes; 'hard'/'soft' darken the fill
  // instead — flat cel step or smooth ramp, both reusing the shade
  // thresholds (cross adds a deeper core shadow) and the noise sliders
  shadeStyle: 'hard', shadowAmount: 0.22,
  // ink along shadow boundaries (0 = off) and its width as a multiple
  // of the regular line radius
  shadowLine: 0.46, shadowLineWidth: 1.65,
  // colors
  inkColor: '#1d1a17', paperColor: '#f6f2e6', paperGrain: 0.05,
  // watercolor (raster mode only): per-kind fills baked at rebuild,
  // wash/pooling/tint/fade applied in the compose step. colorOn off
  // must render pixel-identical to the pre-color build.
  colorOn: true, skyColor: '#d8efec',
  washAmount: 0.05, washScale: 3.05, poolAmount: 0.01, inkTint: 1, aerialFade: 0.81,
  // per-region value drift baked into aPaint — adjacent panels read as
  // separately mixed brush pools (rebuilds on change)
  regionJitter: 0.07,
  // glass & glow: translucent-layer fill/line strength, emissive
  // brightness lift, and the halo bleeding past lamp silhouettes
  glassTint: 0.51, glassLine: 1, glassBackLine: 0.4, glowLift: 0.5,
  haloStrength: 1.9, haloSize: 3.75,
  // thin lines & AA
  oneSided: false, coverageAA: true, superSample: 1,
  msaa: 'off', aaMode: 'smaa', vectorMode: false, progressive: false,
  // vector style (only affects vector mode)
  overshoot: 0.05, inkVary: 0.3,
  // camera: orbit around a target, or free-floating WASD/QE flight
  flyMode: false, flySpeed: 1,
  // player: third-person character + rideable hoverbike
  playerMode: false, walkSpeed: 1, driveSpeed: 1,
  camDist: 9, camHeight: 1.6, collision: false,
  // scene
  scene: 'yard', perQuad: false, autoRotate: false, seed: 7, density: 2.5,
};

/* ============================================================
   Seeded RNG
   ============================================================ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(P.seed);
// Face colors draw from their OWN stream. They used to share `rng` with the
// procedural builders, which meant any option changing how many colors get
// rolled — per-quad, region grouping, similarity — also reshuffled the greeble
// layout. Same seed, separate stream: color options now only change color.
let crng = mulberry32(P.seed ^ 0x9e3779b9);
// Paint jitter draws from a THIRD stream: it must consume neither rng
// (greeble layout) nor crng (ID colors), or adding color would reshuffle
// the scene and break the colorOn-off pixel-identity guarantee.
let prng = mulberry32(P.seed ^ 0x5f356495);

/* ============================================================
   Watercolor palette — sampled from reference-watercolor.png
   ============================================================ */
// RAW hex bytes, deliberately bypassing THREE.Color: ColorManagement
// would convert to linear-sRGB, but the post shader writes its output
// unencoded, so raw display bytes are what come back out of the screen
// unchanged. (Verified: routing through THREE.Color renders the sky
// visibly darker/more saturated than the palette hex.)
const hex2u8 = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const PAL = {
  sky:       hex2u8('#D8EFEC'),  // pale ice — aerial fade target
  sand:      hex2u8('#EDE6D4'),  // cream — ground, plates, dishes
  pink:      hex2u8('#E0B4B0'),  // dusty pink — plinths, distance
  rose:      hex2u8('#C98F94'),
  mauve:     hex2u8('#C090A8'),  // tanks, soft forms
  peri:      hex2u8('#8F9AC8'),  // periwinkle — machine bodies
  slate:     hex2u8('#7890A8'),  // vents, grates, hardware
  deepSlate: hex2u8('#7880B0'),  // rivets, bolts
  cyan:      hex2u8('#6FBEDC'),  // secondary accent — portholes, glass
  celadon:   hex2u8('#9CC4A4'),  // pipes
  mint:      hex2u8('#BFD8B4'),  // AC boxes
  red:       hex2u8('#C94F4A'),  // THE accent — one hero object per scene
  shadow:    hex2u8('#4A4C6E'),  // cables, railings, ladders
  amber:     hex2u8('#E8A33D'),  // emissive — lamps, glow, embers
  emerald:   hex2u8('#5FD98A'),  // emissive — reactors, power cells
};
// imported models: usemtl (or o/g) names -> material, keyword match
// first. Entries are {c, a?, e?}: a < 1 routes to the translucent
// layer, e > 0 marks emissive (translucent + emissive unsupported —
// the keyword sets are kept disjoint on purpose).
const MTL_PAINT = [
  [/glow|ember|neon|lamp/i,                      { c: PAL.amber, e: 1 }],
  [/phosphor|crt|screen/i,                       { c: PAL.cyan, e: 1 }],
  [/energy|reactor|plasma|fusion|cell/i,         { c: PAL.emerald, e: 1 }],
  [/glass|window|canopy/i,                       { c: PAL.cyan, a: 0.45 }],
  [/wood|plank|floor|linen|plaster|paper|card/i, { c: PAL.sand }],
  [/cloth|velour|sofa|jacket|fabric|curtain/i,   { c: PAL.mauve }],
  [/duct|steel|iron|metal|fitting|pipe|vent/i,   { c: PAL.slate }],
  [/cable|wire|rubber|tire|shadow/i,             { c: PAL.shadow }],
  [/armor|plate|hull|panel/i,                    { c: PAL.peri }],
  [/skin|face|hand|flesh/i,                      { c: PAL.pink }],
  [/plant|leaf|moss|grass/i,                     { c: PAL.celadon }],
  [/sky|city|backdrop/i,                         { c: PAL.sky }],
];
// hash fallback cycles the quiet hues only — red and cyan stay rare
const MTL_FALLBACK = [PAL.pink, PAL.rose, PAL.mauve, PAL.peri,
                      PAL.slate, PAL.celadon, PAL.mint, PAL.sand];
function paintForName(name) {
  for (const [re, m] of MTL_PAINT) if (re.test(name)) return m;
  let h = 5381;
  for (let i = 0; i < name.length; i++) h = (h * 33 ^ name.charCodeAt(i)) >>> 0;
  return { c: MTL_FALLBACK[h % MTL_FALLBACK.length] };
}
// deterministic per-region wash drift in [-1, 1) — an integer hash, not
// a stream, so it can never disturb the rng/crng call ordering
function washJitter(i) {
  let x = (i + Math.imul(P.seed, 131071) + 1) | 0;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return ((x >>> 0) / 4294967296) * 2 - 1;
}

// dirty-flag rendering: frames only render when something changed
// (camera, sliders, rebuilds). Lets progressive supersampling slot
// in a refined frame when you stop moving, and idles the GPU at rest.
let dirty = true;
function markDirty() { dirty = true; }
// the cast-shadow map re-renders only when this is set: on rebuilds and
// light moves. A still sun is as cheap as a baked shadow map.
let shadowDirty = true;

// the OBJ model scene's current model (starts as the embedded speeder;
// replaced when the user drops or loads an .obj)
// SMAA lookup textures (area + search), from three.js r160 SMAAPass (MIT),
// itself the WebGL port of iryoku/smaa v2.8. Loaded once at startup; the

// scenes discovered from a user-picked Models folder:
// each subdirectory = one scene showcasing every .obj inside it
let modelScenes = [];   // [{ name, files: [{ name, text }] }]

let hoverbikeText = null;
function findHoverbikeText() {

  for (const sc of modelScenes)
    for (const f of sc.files)
      if (/^hoverbike\.obj$/i.test(f.name)) return (hoverbikeText = f.text);

/* ============================================================
   Face-ID coloring — YOUR technique:
   random color per face -> edge detect the color buffer.
   perQuad=true colors triangle *pairs* (most three.js primitives
   emit quads as consecutive tri pairs) so quads don't get a
   diagonal seam. perQuad=false shows every triangle.
   ============================================================ */
/* ------------------------------------------------------------
   Region grouping — the ID-map idea, applied to line control.
   Rather than one random color per face, adjacent faces are
   flood-filled into REGIONS and each region gets ONE color.
   Since the detector only inks where the color steps, a region's
   interior falls silent: a smooth sphere collapses to a single
   region and draws just its silhouette, while a cube still keeps
   its six faces. Two neighbors join when their face normals agree
   to within `similarity` (1 = coplanar only, lower tolerates more
   curvature) and nothing explicit separates them — an OBJ
   o/g/usemtl change always forces a boundary.
   ------------------------------------------------------------ */
function computeRegions(g, stride, similarity, triGroups) {
  const p = g.attributes.position.array;
  const nVert = g.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const triPerFace = stride / 3;

  // weld by quantized position: toNonIndexed() split the shared
  // vertices apart, but neighbors have to agree on vertex identity
  // 1e-4 is deliberately tight. Loosening it does NOT join parts that merely
  // butt together — it welds unrelated vertices, which collapses faces and
  // breaks the edge topology, so *fewer* neighbours pair up and regions go up.
  const tw0 = performance.now();
  const weld = new Map(), vid = new Int32Array(nVert);
  for (let i = 0; i < nVert; i++) {
    const b = i * 3;
    const k = Math.round(p[b] * 1e4) + '_' + Math.round(p[b + 1] * 1e4) +
              '_' + Math.round(p[b + 2] * 1e4);
    let id = weld.get(k);
    if (id === undefined) { id = weld.size; weld.set(k, id); }
    vid[i] = id;
  }
  const tr0 = performance.now(); tWeld += tr0 - tw0;

  // per face: area-weighted normal + its boundary edges. An edge used
  // twice *inside* one face is the quad's diagonal, not a boundary.
  const fn = new Float32Array(nFace * 3);
  const faceEdges = new Array(nFace);
  const owner = new Map();              // edge key -> first face, -1 once paired
  const pairs = [], pairKeys = [];      // faces meeting across a shared edge
  const seen = new Map();
  for (let f = 0; f < nFace; f++) {
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    let ax = 0, ay = 0, az = 0;
    seen.clear();
    for (let t = 0; t + 3 <= vN; t += 3) {
      const i0 = v0 + t, b0 = i0 * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      // cross product length is 2x area, so summing weights by area
      ax += uy * wz - uz * wy; ay += uz * wx - ux * wz; az += ux * wy - uy * wx;
      for (let e = 0; e < 3; e++) {
        const s = i0 + e, d = i0 + (e + 1) % 3, a = vid[s], c = vid[d];
        const key = a < c ? a + '_' + c : c + '_' + a;
        const prev = seen.get(key);
        if (prev) prev.n++; else seen.set(key, { n: 1, i: s, j: d });
      }
    }
    const l = Math.hypot(ax, ay, az) || 1;
    fn[f * 3] = ax / l; fn[f * 3 + 1] = ay / l; fn[f * 3 + 2] = az / l;
    const bnd = [];
    for (const [key, v] of seen) {
      if (v.n !== 1) continue;                      // internal diagonal
      bnd.push(key, v.i, v.j);
      const o = owner.get(key);
      if (o === undefined) owner.set(key, f);
      else if (o >= 0) { pairs.push(o, f); pairKeys.push(key); owner.set(key, -1); }
    }
    faceEdges[f] = bnd;
  }

  // union neighbors whose normals agree and that nothing separates
  const parent = new Int32Array(nFace);
  for (let f = 0; f < nFace; f++) parent[f] = f;
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  for (let i = 0; i < pairs.length; i += 2) {
    const a = pairs[i], b = pairs[i + 1];
    if (triGroups && triGroups[a * triPerFace] !== triGroups[b * triPerFace]) continue;
    if (fn[a * 3] * fn[b * 3] + fn[a * 3 + 1] * fn[b * 3 + 1] +
        fn[a * 3 + 2] * fn[b * 3 + 2] < similarity) continue;
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent[rb] = ra;
  }

  const region = new Int32Array(nFace), remap = new Map();
  for (let f = 0; f < nFace; f++) {
    const r = find(f);
    let id = remap.get(r);
    if (id === undefined) { id = remap.size; remap.set(r, id); }
    region[f] = id;
  }
  // edges with the same region on both sides are the lines that go
  // away; region adjacency drives color separation below
  const silent = new Set(), nbr = new Array(remap.size);
  for (let i = 0; i < remap.size; i++) nbr[i] = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const ra = region[pairs[i]], rb = region[pairs[i + 1]];
    if (ra === rb) silent.add(pairKeys[i >> 1]);
    else { nbr[ra].push(rb); nbr[rb].push(ra); }
  }
  tRegion += performance.now() - tr0;
  return { region, count: remap.size, nFace, faceEdges, silent, nbr, pairs, pairKeys };
}

/* ------------------------------------------------------------
   Feature size — how big a shape is, for screen-relative LOD.
   `similarity` is baked and view-independent, so it can decide a
   sphere is smooth but never that the sphere is 8px tall. This
   measures each shape in world units; the shaders divide by
   distance to get its apparent size and fade small stuff out.

   Three metrics, because which one reads best depends on how thin
   shapes like pipes and masts should behave — all are baked so
   the dropdown switches with no rebuild.
   ------------------------------------------------------------ */
const LOD_METRICS = ['area', 'diagonal', 'thin'];
const LOD_UNITS = ['region', 'object'];

// log encode into one byte: covers ~0.01 to 200 world units at ~4%
// relative precision, which is all an 8-bit alpha channel can carry
function encodeSize(s) {
  const t = (Math.log2(Math.max(s, 1e-3)) + 7) / 15;
  return Math.max(0, Math.min(255, Math.round(t * 255)));
}

function sizeMetrics(geom, stride, regionOf, nUnit) {
  const p = geom.attributes.position.array;
  const nVert = geom.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const area = new Float64Array(nUnit), bb = new Float64Array(nUnit * 6);
  for (let u = 0; u < nUnit; u++) {
    bb[u * 6] = bb[u * 6 + 1] = bb[u * 6 + 2] = Infinity;
    bb[u * 6 + 3] = bb[u * 6 + 4] = bb[u * 6 + 5] = -Infinity;
  }
  let oArea = 0;
  const ob = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
  for (let f = 0; f < nFace; f++) {
    const u = regionOf ? regionOf[f] : f;
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    for (let t = 0; t + 3 <= vN; t += 3) {
      const b0 = (v0 + t) * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      const a = Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) * 0.5;
      area[u] += a; oArea += a;
    }
    for (let i = v0; i < v0 + vN; i++) {
      const b = i * 3;
      for (let k = 0; k < 3; k++) {
        const x = p[b + k];
        if (x < bb[u * 6 + k]) bb[u * 6 + k] = x;
        if (x > bb[u * 6 + 3 + k]) bb[u * 6 + 3 + k] = x;
        if (x < ob[k]) ob[k] = x;
        if (x > ob[3 + k]) ob[3 + k] = x;
      }
    }
  }
  // "thin" is the MIDDLE bbox extent, not the smallest: the smallest is
  // 0 for any flat patch, which would make every panel read as a sliver
  const metrics = (ar, dx, dy, dz) => {
    const s = [dx, dy, dz].sort((a, b) => a - b);
    return [Math.sqrt(ar), Math.hypot(dx, dy, dz), s[1]];
  };
  const enc = new Uint8Array(nUnit * 3);
  for (let u = 0; u < nUnit; u++) {
    const m = metrics(area[u],
      Math.max(0, bb[u * 6 + 3] - bb[u * 6]),
      Math.max(0, bb[u * 6 + 4] - bb[u * 6 + 1]),
      Math.max(0, bb[u * 6 + 5] - bb[u * 6 + 2]));
    for (let k = 0; k < 3; k++) enc[u * 3 + k] = encodeSize(m[k]);
  }
  const om = metrics(oArea, Math.max(0, ob[3] - ob[0]),
    Math.max(0, ob[4] - ob[1]), Math.max(0, ob[5] - ob[2]));
  return { enc, obj: om.map(encodeSize) };
}

function faceIdColors(geometry, perQuad, variation = 1.0, paintCol = null,
                      matAlpha = 1, matGlow = 0, soft = 0, contour = 0, pblend = null,
                      unlit = 0, nocast = 0) {
  const geom = geometry.index ? geometry.toNonIndexed() : geometry;
  const count = geom.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const step = perQuad ? 6 : 3;
  const paint = (from, to, r, g, b) => {
    for (let i = from; i < to && i < count; i++) {
      colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
    }
  };

  if (!P.regionGroup) {
    for (let i = 0; i < count; i += step)
      paint(i, i + step, .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation);
  } else {
    const R = computeRegions(geom, step, P.similarity, geometry.userData.faceGroup);
    // one color per region. Each is rolled a few times and the roll
    // landing furthest from the neighbors already placed wins — two
    // near-identical colors across a boundary are an edge the
    // detector would miss, i.e. a hole in the linework.
    const rc = new Float32Array(R.count * 3), done = new Uint8Array(R.count);

    for (let r = 0; r < R.count; r++) {
      let best = -1, br = .5, bg = .5, bb = .5;
      for (let k = 0; k < 4; k++) {
        const cr = .5 + (crng() - .5) * variation;
        const cg = .5 + (crng() - .5) * variation;
        const cb = .5 + (crng() - .5) * variation;
        let near = Infinity;
        for (const n of R.nbr[r]) {
          if (!done[n]) continue;
          const dr = cr - rc[n * 3], dg = cg - rc[n * 3 + 1], db = cb - rc[n * 3 + 2];

      }
      rc[r * 3] = br; rc[r * 3 + 1] = bg; rc[r * 3 + 2] = bb;
      done[r] = 1;

      let f2 = f;
      while (f2 < nf && ft[f2] === t) f2++;
      const v0 = f * st, v1 = Math.min(f2 * st, n), vN = v1 - v0;
      const d = t ? dG : dO;
      d.pos.set(gp.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.nor.set(gn.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.col.set(gc.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.szR.set(gr.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.szO.set(go.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.pnt.set(ga.subarray(v0 * 4, v1 * 4), d.o * 4);
      d.o += vN;
      f = f2;
    }
    if (g.userData.regions) regions += g.userData.regions.count;
    const te0 = performance.now();
    extractEdges(g, P.perQuad && !g.userData.forceTri, store);
    if (opts.timing !== false) tEdges += performance.now() - te0;
    g.dispose();
  }
  // an opaque A byte below 255 marks emissive faces — gates the halo pass
  let glow = false;
  for (let i = 3; i < dO.pnt.length; i += 4)
    if (dO.pnt[i] < 255) { glow = true; break; }
  const buildGeo = d => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(d.pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(d.nor, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(d.col, 3));
    geo.setAttribute('aSizeRegion', new THREE.BufferAttribute(d.szR, 3, true));
    geo.setAttribute('aSizeObject', new THREE.BufferAttribute(d.szO, 3, true));
    geo.setAttribute('aPaint', new THREE.BufferAttribute(d.pnt, 4, true));
    return geo;
  };
  const merged = buildGeo(dO), mergedGlass = buildGeo(dG);
  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(store.pos), 3));
  lineGeom.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(store.seed), 1));
  lineGeom.setAttribute('aSizeRegion', new THREE.BufferAttribute(new Uint8Array(store.szR), 3, true));
  lineGeom.setAttribute('aSizeObject', new THREE.BufferAttribute(new Uint8Array(store.szO), 3, true));
  const stats = {
    glassVerts: totG, tris: (totO + totG) / 3, edges: store.edges,
    regions, lineVerts: store.pos.length / 3, hasGlow: glow,
  };
  return { merged, mergedGlass, lineGeom, stats };
}

// ---- small parts ---------------------------------------------
function rivet(frame, x, y, z, r = 0.05) {
  withPaint(PAL.deepSlate, () =>
    put(frame, new THREE.CylinderGeometry(r, r * 1.25, r * 1.2, 6, 1), x, y, z, Math.PI / 2, 0, 0, 0.7));
}
function boltRing(frame, x, y, z, radius, n, boltR = 0.045, facePlane = false) {
  const prevPaint = currentPaint; currentPaint = PAL.deepSlate;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    if (facePlane)   // ring in the x/y plane (wall-mounted, bolts point +z)
      put(frame, new THREE.CylinderGeometry(boltR, boltR, boltR * 2, 6, 1),
        x + Math.cos(a) * radius, y + Math.sin(a) * radius, z, Math.PI / 2, 0, 0, 0.7);
    else             // ring in the x/z plane (horizontal, bolts point up)
      put(frame, new THREE.CylinderGeometry(boltR, boltR, boltR * 2, 6, 1),
        x + Math.cos(a) * radius, y, z + Math.sin(a) * radius, 0, 0, 0, 0.7);
  }
  currentPaint = prevPaint;
}

// recursive panel split of a rect [-w/2,w/2]x[-h/2,h/2]
function splitRect(u0, v0, u1, v1, depth, out) {
  const w = u1 - u0, h = v1 - v0;
  if (depth <= 0 || (w < 1.3 && h < 1.3) || rng() < 0.18) { out.push([u0, v0, u1, v1]); return; }
  if (w > h) { const t = u0 + w * (0.35 + rng() * 0.3); splitRect(u0, v0, t, v1, depth - 1, out); splitRect(t, v0, u1, v1, depth - 1, out); }
  else      { const t = v0 + h * (0.35 + rng() * 0.3); splitRect(u0, v0, u1, t, depth - 1, out); splitRect(u0, t, u1, v1, depth - 1, out); }
}

// decorate one face of a block. faceFrame maps face-local
// (u, v, out-of-face) -> block space. fw x fh is the face size.
function panelFace(faceFrame, fw, fh, D) {
  // plates read as a lighter tint of the block they sit on
  const prevPaint = currentPaint;
  const platePaint = tint(currentPaint || PAL.peri, 0.10);
  const cells = [];
  splitRect(-fw / 2 + .15, -fh / 2 + .15, fw / 2 - .15, fh / 2 - .15,
    2 + Math.round(D), cells);
  for (const [u0, v0, u1, v1] of cells) {
    const cw = u1 - u0, ch = v1 - v0, uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
    if (cw < .3 || ch < .3) continue;
    const m = 0.07;                             // inset margin
    const t = 0.04 + rng() * 0.09;              // plate thickness
    // the panel plate itself — low variation: fine lines
    setPaint(platePaint);
    put(faceFrame, new THREE.BoxGeometry(cw - 2 * m, ch - 2 * m, t), uc, vc, t / 2, 0, 0, 0, 0.3);
    const deco = rng();
    if (deco < 0.22 * D && cw > .8 && ch > .8) {
      // corner rivets
      const ru = cw / 2 - m - .12, rv = ch / 2 - m - .12;
      rivet(faceFrame, uc - ru, vc - rv, t); rivet(faceFrame, uc + ru, vc - rv, t);
      rivet(faceFrame, uc - ru, vc + rv, t); rivet(faceFrame, uc + ru, vc + rv, t);
    } else if (deco < 0.40 * D && cw > 1.0 && ch > .7) {
      // vent slats
      setPaint(PAL.slate);
      const n = Math.min(11, Math.floor((ch - 2 * m) / 0.22));
      for (let i = 0; i < n; i++) {
        const vy = vc - (ch - 2 * m - .2) / 2 + i * ((ch - 2 * m - .2) / Math.max(1, n - 1));
        put(faceFrame, new THREE.BoxGeometry(cw - 2 * m - .25, 0.07, 0.06), uc, vy, t + 0.03, 0, 0, 0, 0.55);
      }
    } else if (deco < 0.52 * D && Math.min(cw, ch) > 1.0) {
      // porthole: disc + raised ring + bolts
      setPaint(PAL.cyan);
      const pr = Math.min(cw, ch) * 0.28;
      put(faceFrame, new THREE.CylinderGeometry(pr, pr, 0.06, 16, 1), uc, vc, t + 0.03, Math.PI / 2, 0, 0, 0.4);
      put(faceFrame, new THREE.TorusGeometry(pr, 0.05, 6, 16), uc, vc, t + 0.06, 0, 0, 0, 0.6);
      boltRing(faceFrame, uc, vc, t + 0.05, pr + 0.14, 6, 0.045, true);
    } else if (deco < 0.66 * D && cw > .9) {
      // little box cluster (gauges / junctions)
      setPaint(PAL.slate);
      const n = 1 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) {
        const gw = .18 + rng() * .4, gh2 = .15 + rng() * .35, gt = .1 + rng() * .22;
        put(faceFrame, new THREE.BoxGeometry(gw, gh2, gt),
          uc + (rng() - .5) * (cw - 2 * m - gw), vc + (rng() - .5) * (ch - 2 * m - gh2), t + gt / 2, 0, 0, 0, 0.6);
      }
      if (rng() < .5) rivet(faceFrame, uc, vc + ch / 2 - m - .1, t);
    }
    // occasional rivet seam along the bottom edge of the plate
    if (rng() < 0.25 * D && cw > 1.4) {
      const n = Math.floor((cw - 2 * m) / 0.4);
      for (let i = 0; i < n; i++)
        rivet(faceFrame, uc - (cw - 2 * m) / 2 + .2 + i * .4, v0 + m + .1, t, 0.04);
    }
  }
  currentPaint = prevPaint;
}

function ladder(blockFrame, x, z, h, ry) {
  const prevPaint = currentPaint; currentPaint = PAL.shadow;
  const f = frameOf(x, 0, z, 0, ry, 0);
  f.premultiply(blockFrame);
  for (const s of [-0.22, 0.22])
    put(f, new THREE.BoxGeometry(0.06, h, 0.06), s, h / 2, 0.1, 0, 0, 0, 0.6);
  const n = Math.floor(h / 0.38);
  for (let i = 1; i < n; i++)
    put(f, new THREE.CylinderGeometry(0.03, 0.03, 0.44, 5, 1), 0, i * 0.38, 0.1, 0, 0, Math.PI / 2, 0.6);
  currentPaint = prevPaint;
}

function railing(blockFrame, w, d, topY) {
  const prevPaint = currentPaint; currentPaint = PAL.shadow;
  const hw = w / 2 - .15, hd = d / 2 - .15, rh = 0.85;
  const edges = [
    [-hw, -hd, hw, -hd], [hw, -hd, hw, hd], [hw, hd, -hw, hd], [-hw, hd, -hw, -hd]];
  for (const [x0, z0, x1, z1] of edges) {
    const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(z1 - z0, x1 - x0);
    const n = Math.max(2, Math.round(len / 1.1));
    for (let i = 0; i <= n; i++) {
      const tt = i / n;
      put(blockFrame, new THREE.BoxGeometry(0.05, rh, 0.05),
        x0 + (x1 - x0) * tt, topY + rh / 2, z0 + (z1 - z0) * tt, 0, 0, 0, 0.6);
    }
    for (const ry2 of [rh, rh * 0.55])
      put(blockFrame, new THREE.BoxGeometry(len, 0.045, 0.045),
        (x0 + x1) / 2, topY + ry2, (z0 + z1) / 2, 0, -ang, 0, 0.6);
  }
  currentPaint = prevPaint;
}

function pipeRun(frame, x, z, baseY, pr, ph, D) {
  const segs = Math.max(2, Math.floor(ph / 1.4));
  put(frame, new THREE.CylinderGeometry(pr, pr, ph, 10, segs), x, baseY + ph / 2, z, 0, 0, 0, 0.5);
  // flanges with bolt rings every ~2.2 units
  for (let fy = baseY + 0.9; fy < baseY + ph - .3; fy += 2.2) {
    put(frame, new THREE.CylinderGeometry(pr * 1.4, pr * 1.4, 0.16, 10, 1), x, fy, z, 0, 0, 0, 0.55);
    if (rng() < 0.7 * D) boltRing(frame, x, fy + 0.1, z, pr * 1.18, 6, 0.035);
  }
  // elbow + horizontal stub at the top
  if (rng() < 0.65) {
    const er = pr * 1.9;
    put(frame, new THREE.TorusGeometry(er, pr, 8, 10, Math.PI / 2), x - er, baseY + ph, z, 0, 0, 0, 0.5);
    const stub = 1 + rng() * 3;
    put(frame, new THREE.CylinderGeometry(pr, pr, stub, 10, 2),
      x - er - stub / 2, baseY + ph + er, z, 0, 0, Math.PI / 2, 0.5);
    put(frame, new THREE.CylinderGeometry(pr * 1.3, pr * 1.3, 0.14, 10, 1),
      x - er - stub, baseY + ph + er, z, 0, 0, Math.PI / 2, 0.55);
  } else {
    put(frame, new THREE.CylinderGeometry(pr * 1.5, pr * 1.5, 0.35, 10, 1), x, baseY + ph, z, 0, 0, 0, 0.55);
  }
}

function cable(p1, p2, r = 0.07) {
  const mid = p1.clone().lerp(p2, 0.5); mid.y -= p1.distanceTo(p2) * (0.12 + rng() * 0.12);
  const curve = new THREE.CatmullRomCurve3([p1, mid, p2]);
  withPaint(PAL.shadow, () =>
    put(null, new THREE.TubeGeometry(curve, 36, r, 6), 0, 0, 0, 0, 0, 0, 0.8));
}

// demo pair every scene gets: a translucent cube and an emissive
// sphere. Called LAST in each builder — put() consumes no rng, and
// placing them after everything else keeps the crng color stream of
// the existing geometry untouched.
function demoMaterials(x, z) {
  withMat(PAL.cyan, 0.45, 0, () =>
    put(null, new THREE.BoxGeometry(3, 3, 3), x, 1.62, z, 0, 0.4, 0, 0.6));
  withMat(PAL.amber, 1, 1, () =>
    put(null, new THREE.SphereGeometry(1.6, 24, 18), x + 4.5, 1.72, z, 0, 0, 0, 0.6));
}

/* ---- tendril field: Moebius anemone-grass test bed ------------ */
// one wavy, tapering finger-tendril: rings stacked along a bent path
// with a slight bulb and a rounded tip. Indexed with smooth normals,
// so faceIdColors' region grouping reads the whole shaft as one
// region — silhouettes and folds ink, facet seams don't (same reason
// the yard pipes render clean).
function tendrilGeom(h, r0, bend, phase) {
  const RINGS = 13, SEG = 10;   // ~2x the tris of the first version: smoother bends and rounder silhouettes
  const path = [];
  for (let i = 0; i <= RINGS; i++) {
    const t = i / RINGS;
    const sx = Math.sin(t * 2.6 + phase) * bend
             + Math.sin(t * 6.1 + phase * 2.3) * bend * 0.35;
    const sz = Math.cos(t * 3.4 + phase * 1.4) * bend * 0.6;
    path.push(new THREE.Vector3(sx * h * 0.3, t * h, sz * h * 0.3));
  }
  const curve = new THREE.CatmullRomCurve3(path);
  const frames = curve.computeFrenetFrames(RINGS, false);
  // shaft narrows through the middle, swells into a slight bulb at the
  // top — the anemone-finger profile from the reference
  const radiusAt = t => r0 * (1.0 - 0.38 * Math.sin(Math.PI * Math.min(t * 1.15, 1) * 0.82)
                                   + 0.30 * Math.pow(Math.max(0, (t - 0.62) / 0.38), 2.0));
  const pos = [], idx = [];
  const ring = (centre, N, B, r) => {
    const base = pos.length / 3;
    for (let s = 0; s <= SEG; s++) {
      const a = (s / SEG) * Math.PI * 2;
      pos.push(centre.x + (N.x * Math.cos(a) + B.x * Math.sin(a)) * r,
               centre.y + (N.y * Math.cos(a) + B.y * Math.sin(a)) * r,
               centre.z + (N.z * Math.cos(a) + B.z * Math.sin(a)) * r);
    }
    return base;
  };
  const rings = [];
  for (let i = 0; i <= RINGS; i++) {
    const t = i / RINGS;
    rings.push(ring(curve.getPoint(t), frames.normals[i], frames.binormals[i], radiusAt(t)));
  }
  // rounded tip: two shrinking cap rings pushed along the end tangent,
  // then an apex fan
  const tipC = curve.getPoint(1), tipT = frames.tangents[RINGS];
  const rTip = radiusAt(1);
  for (const a of [Math.PI / 5.5, Math.PI / 2.6]) {
    const c = tipC.clone().addScaledVector(tipT, Math.sin(a) * rTip);
    rings.push(ring(c, frames.normals[RINGS], frames.binormals[RINGS], Math.cos(a) * rTip));
  }
  const apex = pos.length / 3;
  const apexP = tipC.clone().addScaledVector(tipT, rTip);
  pos.push(apexP.x, apexP.y, apexP.z);
  for (let i = 0; i < rings.length - 1; i++) {
    const a = rings[i], b = rings[i + 1];
    for (let s = 0; s < SEG; s++)
      idx.push(a + s, b + s, b + s + 1,  a + s, b + s + 1, a + s + 1);
  }
  const last = rings[rings.length - 1];
  for (let s = 0; s < SEG; s++) idx.push(last + s, apex, last + s + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.userData.forceTri = true;   // ring strips aren't quad-paired geometry
  return g;
}

function buildTendrils() {
  // the ground is unlit flat paper like the reference — which also
  // lets the root blend match it EXACTLY: the blend target is the
  // ground's DISPLAYED color (sand + its region's wash-jitter tint),
  // not raw sand, so no shading or jitter step survives at the contact.
  // The plane merges into one region, and the first geometry's first
  // region gets id 0.
  const groundCol = P.regionGroup && P.regionJitter > 0
    ? tint(PAL.sand, washJitter(0) * P.regionJitter) : PAL.sand;
  withUnlit(() => {
    setPaint(PAL.sand);
    put(null, new THREE.PlaneGeometry(120, 120, 8, 8), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);
  });
  // like the reference: a tall thicket in back thinning to stubby
  // sprouts up front. Roots sink slightly below grade so each contact
  // is a clean intersection. Placement is rejection-sampled: each
  // tendril claims a circular footprint of base radius PLUS the exact
  // bound of its sway, so no two tendrils (nor the hovercraft) can
  // intersect anywhere along their height.
  const placed = [{ x: 7.5, z: 16, R: 3.2 }];   // hovercraft keep-out
  withNoCast(() => withUnlit(() => withPaintBlend(groundCol, 0.35, 2.0, () => withSoftRoot(() => {
    for (let row = 0; row < 9; row++) {
      const back = 1 - row / 8;                 // 1 = far row, 0 = front
      const z = -30 + row * 5.4;
      const n = 6 + Math.round(30 * back);
      for (let i = 0; i < n; i++) {
        const h = 1.1 + rng() * 2.0 + back * back * (7.5 + rng() * 5.5);
        const r = 0.3 + rng() * 0.28 + back * 0.3;
        // cap the wavy lean so tall tendrils stay near their base:
        // sway magnitude is bounded by 0.405 * bend * h (the sum of
        // the two sine harmonics times the 0.3 path scale)
        const bend = (0.45 + rng() * 0.9) * Math.min(1, 4.0 / h);
        const R = r * 1.35 + 0.405 * bend * h;
        let px = 0, pz = 0, ok = false;
        for (let a = 0; a < 14 && !ok; a++) {
          px = (rng() - 0.5) * (95 - row * 5);
          pz = z + (rng() - 0.5) * 4.5;
          ok = placed.every(p => {
            const dx = px - p.x, dz = pz - p.z, m = R + p.R;
            return dx * dx + dz * dz >= m * m;
          });
        }
        if (!ok) continue;                      // crowded row: skip one
        placed.push({ x: px, z: pz, R });
        const c = rng();
        withPaint(c < 0.55 ? PAL.sky : c < 0.8 ? PAL.cyan : PAL.mint, () =>
          put(null, tendrilGeom(h, r, bend, rng() * Math.PI * 2),
              px, -0.25, pz, 0, rng() * Math.PI * 2, 0, 0.5));
      }
    }
  }))));
  // the parked hoverbike (Models/hoverbike.obj) on the open sand in
  // front of the thicket — the one lit, shadow-casting machine in the
  // field (built last so the tendril layout's rng/crng streams stay
  // untouched). Absent until its file text has loaded.
  const hb = findHoverbikeText();
  if (hb) withContours(() => {
    setPaint(null);                     // colors itself by material name
    const hv = parseOBJ(hb);
    hv.applyMatrix4(new THREE.Matrix4().makeScale(0.35, 0.35, 0.35));
    put(null, hv, 7.5, 0, 16, 0, 2.4, 0, 0.55);
  });
}

/* ---- the scene itself ---------------------------------------- */
function buildScene() {
  const buildT0 = performance.now();
  tWeld = tRegion = tEdges = 0;
  if (sceneRoot) { sceneRoot.geometry.dispose(); scene.remove(sceneRoot); }
  if (glassRoot) { glassRoot.geometry.dispose(); scene.remove(glassRoot); }
  if (lineSegs) { lineSegs.geometry.dispose(); scene.remove(lineSegs); }
  rng = mulberry32(P.seed);
  crng = mulberry32(P.seed ^ 0x9e3779b9);
  prng = mulberry32(P.seed ^ 0x5f356495);
  currentPaint = null;                     // no material state leaks across rebuilds
  currentAlpha = 1; currentGlow = 0;
  currentSoft = 0; hasSoftRoot = false; currentContour = 0; currentPBlend = null;
  currentUnlit = 0; currentNoCast = 0;
  shadowDirty = true;
  bag = [];
  const D = P.density;
  if (P.scene === 'garden') buildGarden();
  else if (P.scene === 'tendrils') buildTendrils();
  else if (P.scene === 'prims') buildPrims();
  else if (P.scene === 'model') buildModel();
  else if (P.scene.startsWith('dir:')) {
    const [di, fi] = P.scene.slice(4).split(':');
    buildDirScene(+di, fi === undefined ? -1 : +fi);
  }
  else buildYard(D);
  finishScene();
  // yard floor plates top out at 0.12; every other scene walks at 0
  groundDatum = P.scene === 'yard' ? 0.12 : 0;
  regroundActors();
  lastBuildMs = performance.now() - buildT0;
}

/* ---- a scene per Models/ subdirectory ------------------------------
   "dir:i"   -> every .obj in that folder, laid out in a grid so they
                can be compared side by side
   "dir:i:k" -> just file k, centred and alone                        */
function buildDirScene(i, only) {
  const sc = modelScenes[i];
  if (!sc) { buildYard(P.density); return; }
  setPaint(PAL.sand);
  put(null, new THREE.PlaneGeometry(160, 160, 16, 16), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);
  setPaint(null);   // imports color themselves by material name
  const solo = only >= 0 && only < sc.files.length;
  const list = solo ? [only] : sc.files.map((_, k) => k);
  const cols = Math.ceil(Math.sqrt(list.length));
  const rowsN = Math.ceil(list.length / cols), spacing = 24;
  list.forEach((k, slot) => {
    const col = slot % cols, row = Math.floor(slot / cols);
    const x = solo ? 0 : (col - (cols - 1) / 2) * spacing;
    const z = solo ? 0 : (row - (rowsN - 1) / 2) * spacing;
    try {
      // imports are organic/unknown geometry: contours on
      withContours(() =>
        put(null, parseOBJ(sc.files[k].text), x, 0, z, 0, 0.4 + k * 0.7, 0, 0.55));
    } catch (e) { console.error('failed to parse', sc.files[k].name, e); }
  });
}

function buildYard(D) {
  setPaint(PAL.sand);
  // ground: base sheet + individual floor plates (real gaps = real lines)
  put(null, new THREE.PlaneGeometry(170, 170, 8, 8), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.06);
  const N = 8;
  for (let gx = -N; gx <= N; gx++) for (let gz = -N; gz <= N; gz++) {
    put(null, new THREE.BoxGeometry(4.55, 0.12, 4.55), gx * 4.75, 0.06, gz * 4.75, 0, 0, 0, 0.14);
    const r = rng();
    if (r < 0.045 * D) {           // manhole
      setPaint(PAL.slate);
      put(null, new THREE.CylinderGeometry(0.85, 0.85, 0.18, 14, 1), gx * 4.75, 0.14, gz * 4.75, 0, 0, 0, 0.35);
      boltRing(null, gx * 4.75, 0.24, gz * 4.75, 0.66, 6);
      setPaint(PAL.sand);
    } else if (r < 0.085 * D) {    // floor grate
      setPaint(PAL.slate);
      for (let i = 0; i < 8; i++)
        put(null, new THREE.BoxGeometry(3.4, 0.05, 0.16), gx * 4.75, 0.15, gz * 4.75 - 1.5 + i * 0.42, 0, 0, 0, 0.4);
      setPaint(PAL.sand);
    }
  }

  // machine blocks — bodies cycle the quiet hues by cluster index (index-
  // based so the balance survives any seed), prng jitters within the hue
  const blockTops = [];
  const clusters = 5;
  const BLOCK_CYC = [PAL.peri, PAL.slate, PAL.deepSlate, PAL.mauve];
  for (let c = 0; c < clusters; c++) {
    const cx = (rng() - .5) * 46, cz = (rng() - .5) * 46;
    const bw = 4.5 + rng() * 6, bh = 3.5 + rng() * 9, bd = 4.5 + rng() * 6;
    const bf = frameOf(cx, 0, cz, 0, rng() < 0.25 ? rng() * 0.8 : 0, 0);
    setPaint(tint(BLOCK_CYC[c % BLOCK_CYC.length], (prng() - 0.5) * 0.12));
    put(bf, new THREE.BoxGeometry(bw, bh, bd), 0, bh / 2, 0, 0, 0, 0, 0.9);

    // panelize the four sides + top
    const faces = [
      [frameOf(0, bh / 2, bd / 2).premultiply(bf), bw, bh],                       // +z
      [frameOf(0, bh / 2, -bd / 2, 0, Math.PI, 0).premultiply(bf), bw, bh],       // -z
      [frameOf(bw / 2, bh / 2, 0, 0, Math.PI / 2, 0).premultiply(bf), bd, bh],    // +x
      [frameOf(-bw / 2, bh / 2, 0, 0, -Math.PI / 2, 0).premultiply(bf), bd, bh],  // -x
      [frameOf(0, bh, 0, -Math.PI / 2, 0, 0).premultiply(bf), bw, bd],            // top
    ];
    for (const [ff, fw, fh] of faces) panelFace(ff, fw, fh, D);

    // rooftop machinery
    setPaint(PAL.celadon);
    const pipes = 1 + Math.floor(rng() * 2 * D);
    for (let i = 0; i < pipes; i++)
      pipeRun(bf, (rng() - .5) * bw * .6, (rng() - .5) * bd * .6, bh, .22 + rng() * .42, 2 + rng() * 7, D);
    if (rng() < .55) {   // tank + saddle
      setPaint(PAL.mauve);
      const tr = .9 + rng() * 1.4, tx = (rng() - .5) * bw * .5, tz = (rng() - .5) * bd * .5;
      put(bf, new THREE.SphereGeometry(tr, 16, 12), tx, bh + tr * .75, tz, 0, 0, 0, 0.45);
      put(bf, new THREE.CylinderGeometry(tr * .55, tr * .7, tr * .5, 10, 1), tx, bh + tr * .2, tz, 0, 0, 0, 0.55);
      put(bf, new THREE.TorusGeometry(tr * .8, .06, 6, 18), tx, bh + tr * .75, tz, Math.PI / 2, 0, 0, 0.6);
    }
    if (rng() < .6) railing(bf, bw, bd, bh);
    if (rng() < .65) ladder(bf, (rng() - .5) * bw * .6, bd / 2, bh, 0);

    // AC-unit style boxes on the roof
    setPaint(PAL.mint);
    const rn = Math.floor(rng() * 3 * D);
    for (let i = 0; i < rn; i++) {
      const gw = .6 + rng() * 1.6, gh2 = .4 + rng() * 1.2, gd2 = .6 + rng() * 1.6;
      const gx2 = (rng() - .5) * (bw - gw), gz2 = (rng() - .5) * (bd - gd2);
      put(bf, new THREE.BoxGeometry(gw, gh2, gd2), gx2, bh + gh2 / 2, gz2, 0, 0, 0, 0.55);
      const slats = Math.floor(gw / .18);
      for (let s = 0; s < slats; s++)
        put(bf, new THREE.BoxGeometry(0.05, gh2 * .6, gd2 * .8), gx2 - gw / 2 + .12 + s * .18, bh + gh2 / 2, gz2, 0, 0, 0, 0.6);
    }
    blockTops.push(new THREE.Vector3(cx, bh, cz));
  }

  // ground-level pipe runs with support cradles
  setPaint(PAL.celadon);
  for (let i = 0; i < Math.round(3 * D); i++) {
    const pr = .3 + rng() * .35, plen = 16 + rng() * 26;
    const px = (rng() - .5) * 40, pz = (rng() - .5) * 40, pa = rng() * Math.PI;
    const pf = frameOf(px, 0, pz, 0, pa, 0);
    put(pf, new THREE.CylinderGeometry(pr, pr, plen, 10, Math.floor(plen / 2.5)), 0, pr + .25, 0, 0, 0, Math.PI / 2, 0.5);
    for (let s = -plen / 2 + 1.5; s < plen / 2; s += 3.2) {
      withPaint(PAL.slate, () =>
        put(pf, new THREE.BoxGeometry(0.5, 0.28, pr * 2.4), s, 0.14, 0, 0, 0, 0, 0.55));
      put(pf, new THREE.TorusGeometry(pr * 1.12, .05, 6, 12), s, pr + .25, 0, 0, Math.PI / 2, 0, 0.6);
    }
    // inline flange pairs
    for (let s = -plen / 2 + 4; s < plen / 2; s += 7 + rng() * 4) {
      put(pf, new THREE.CylinderGeometry(pr * 1.35, pr * 1.35, .3, 10, 1), s, pr + .25, 0, 0, 0, Math.PI / 2, 0.55);
    }
  }

  // catenary cables between rooftops
  const cn = Math.min(blockTops.length * 2, Math.round(4 * D));
  for (let i = 0; i < cn; i++) {
    const a = blockTops[Math.floor(rng() * blockTops.length)];
    let b = blockTops[Math.floor(rng() * blockTops.length)];
    if (a === b) continue;
    cable(a.clone().add(new THREE.Vector3((rng() - .5) * 2, .2, (rng() - .5) * 2)),
          b.clone().add(new THREE.Vector3((rng() - .5) * 2, .2, (rng() - .5) * 2)),
          0.05 + rng() * 0.05);
  }

  // antenna masts
  setPaint(PAL.cyan);
  for (let i = 0; i < Math.round(4 * D); i++) {
    const ah = 4 + rng() * 8, ax = (rng() - .5) * 58, az = (rng() - .5) * 58;
    const af = frameOf(ax, 0, az, 0, rng() * Math.PI, 0);
    put(af, new THREE.CylinderGeometry(.09, .16, ah, 6, 3), 0, ah / 2, 0, 0, 0, 0, 0.55);
    const bars = 2 + Math.floor(rng() * 3);
    for (let s = 0; s < bars; s++) {
      const by = ah * (.5 + .5 * s / bars);
      put(af, new THREE.CylinderGeometry(.035, .035, 1.6, 5, 1), 0, by, 0, 0, 0, Math.PI / 2, 0.6);
      put(af, new THREE.SphereGeometry(.09, 6, 5), .8, by, 0, 0, 0, 0, 0.6);
      put(af, new THREE.SphereGeometry(.09, 6, 5), -.8, by, 0, 0, 0, 0, 0.6);
    }
    if (rng() < .5)   // dish
      withPaint(PAL.sand, () =>
        put(af, new THREE.CylinderGeometry(.7, .55, .2, 12, 1), 0, ah - .5, .35, Math.PI / 2.6, 0, 0, 0.5));
    put(af, new THREE.ConeGeometry(.07, .8, 5, 1), 0, ah + .4, 0, 0, 0, 0, 0.6);
  }

  // hero object — high-res torus knot, floating like a monument.
  // The scene's ONE red: the palette reads warm-with-an-accent only
  // while red stays this rare.
  withContours(() => withPaint(PAL.red, () =>
    put(null, new THREE.TorusKnotGeometry(3.1, 0.95, 220, 20), 0, 13.5, 0, 0, 0, 0, 0.5)));
  if (!window.__noDemo) demoMaterials(26, -8);
}

function buildModel() {
  setPaint(PAL.sand);
  put(null, new THREE.PlaneGeometry(120, 120, 12, 12), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);

function parseOBJ(text) {
  const vs = [], pos = [], faceGroup = [];
  let quadFaces = 0, triFaces = 0;
  // o / g / usemtl changes are hard region boundaries: two parts that
  // merely touch — or two materials meeting on a flat panel — must
  // never merge into one region no matter how well their normals agree
  const gIds = new Map();
  const gMtl = [];   // gid -> semantic name for palette keywording; falls
                     // back to the o/g part name when the file has no usemtl
  let part = '', mtl = '', gid = 0;
  const regroup = () => {
    const k = part + '\u0000' + mtl;
    if (!gIds.has(k)) { gIds.set(k, gIds.size); gMtl.push(mtl || part); }
    gid = gIds.get(k);
  };
  regroup();
  const addTri = (a, b, c) => {
    if (!vs[a] || !vs[b] || !vs[c]) return;
    pos.push(vs[a][0], vs[a][1], vs[a][2], vs[b][0], vs[b][1], vs[b][2], vs[c][0], vs[c][1], vs[c][2]);
    faceGroup.push(gid);
  };
  // faces are collected first so buried ones can be culled before emitting
  const faceList = [];
  for (const raw of text.split('\n')) {
    const t = raw.trim().split(/\s+/);
    if (t[0] === 'v') vs.push([+t[1], +t[2], +t[3]]);
    else if (t[0] === 'o' || t[0] === 'g') { part = t.slice(1).join(' '); regroup(); }
    else if (t[0] === 'usemtl') { mtl = t.slice(1).join(' '); regroup(); }
    else if (t[0] === 'f') {
      faceList.push({
        idx: t.slice(1).map(s => {
          const i = parseInt(s.split('/')[0], 10);
          return i < 0 ? vs.length + i : i - 1;
        }), g: gid });
    }
  }

  // ---- cull buried faces -----------------------------------------
  // Assembled models are piles of interpenetrating primitives, and over
  // half their faces can sit *inside* a neighbouring part. A solid
  // renderer never shows those, but this one draws edges from every
  // face, so they surface as scribble wherever they poke through.
  // A part is treated as a solid box only when it really is one (<=12
  // faces over <=8 corners), which is exactly the primitive-assembly
  // case and keeps the test from swallowing concave or hollow parts.
  let culled = 0;
  if (P.cullBuried) {
    const nG = gIds.size;
    const bb = new Float64Array(nG * 6), nFace = new Int32Array(nG);
    const verts = Array.from({ length: nG }, () => new Set());
    for (let g = 0; g < nG; g++) {
      bb[g*6] = bb[g*6+1] = bb[g*6+2] = Infinity;
      bb[g*6+3] = bb[g*6+4] = bb[g*6+5] = -Infinity;
    }
    for (const f of faceList) {
      nFace[f.g]++;
      for (const i of f.idx) {
        const v = vs[i]; if (!v) continue;
        // by POSITION, not index: exporters split a box's 8 corners into
        // 24 indices for UVs, which would hide its true corner count
        verts[f.g].add(Math.round(v[0]*1e5) + '_' + Math.round(v[1]*1e5) + '_' + Math.round(v[2]*1e5));
        for (let k = 0; k < 3; k++) {
          if (v[k] < bb[f.g*6+k]) bb[f.g*6+k] = v[k];
          if (v[k] > bb[f.g*6+3+k]) bb[f.g*6+3+k] = v[k];
        }
      }
    }
    const solid = [];
    for (let g = 0; g < nG; g++) if (nFace[g] > 0 && nFace[g] <= 12 && verts[g].size <= 8) solid.push(g);
    const eps = 1e-5;
    for (const f of faceList) {
      let cx0 = 0, cy0 = 0, cz0 = 0, n = 0;
      for (const i of f.idx) { const v = vs[i]; if (!v) continue; cx0 += v[0]; cy0 += v[1]; cz0 += v[2]; n++; }
      if (!n) continue;
      cx0 /= n; cy0 /= n; cz0 /= n;
      for (const g of solid) {
        if (g === f.g) continue;
        const b = g * 6;
        if (cx0 > bb[b]+eps && cx0 < bb[b+3]-eps && cy0 > bb[b+1]+eps && cy0 < bb[b+4]-eps &&
            cz0 > bb[b+2]+eps && cz0 < bb[b+5]-eps) { f.buried = true; culled++; break; }
      }
    }
  }

  for (const f of faceList) {
    if (f.buried) continue;
    const idx = f.idx;
    gid = f.g;                       // addTri tags each triangle with it
    if (idx.length === 4) { quadFaces++; addTri(idx[0], idx[1], idx[2]); addTri(idx[0], idx[2], idx[3]); }
    else {
      if (idx.length === 3) triFaces++;
      for (let i = 1; i < idx.length - 1; i++) addTri(idx[0], idx[i], idx[i + 1]);
    }
  }
  if (culled) console.info(
    `cull buried: dropped ${culled} of ${faceList.length} faces (${(100*culled/faceList.length).toFixed(0)}%) inside other parts`);
  // normalize: uniform-scale to a 16-unit footprint, sit on the ground, center x/z
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) {
    mn[k] = Math.min(mn[k], pos[i + k]); mx[k] = Math.max(mx[k], pos[i + k]);
  }
  const size = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]) || 1;
  const s = 16 / size;
  const cx = (mn[0] + mx[0]) / 2, cz = (mn[2] + mx[2]) / 2;
  for (let i = 0; i < pos.length; i += 3) {
    pos[i]     = (pos[i]     - cx)    * s;
    pos[i + 1] = (pos[i + 1] - mn[1]) * s;
    pos[i + 2] = (pos[i + 2] - cz)    * s;
  }
  // flat per-face normals
  const nor = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 9) {
    const ax = pos[i], ay = pos[i + 1], az = pos[i + 2];
    const ux = pos[i + 3] - ax, uy = pos[i + 4] - ay, uz = pos[i + 5] - az;
    const wx = pos[i + 6] - ax, wy = pos[i + 7] - ay, wz = pos[i + 8] - az;
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    for (let j = 0; j < 3; j++) { nor[i + j * 3] = nx; nor[i + j * 3 + 1] = ny; nor[i + j * 3 + 2] = nz; }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  // mostly-triangulated models opt out of quad pairing (see put())
  geo.userData.forceTri = quadFaces < triFaces;
  geo.userData.faceGroup = Int32Array.from(faceGroup);
  geo.userData.groupMtl = gMtl;
  return geo;
}

function finishScene() {
  const { merged, mergedGlass, lineGeom, stats } = mergeBagArray(bag);
  bag = [];
  glassVertCount = stats.glassVerts;
  triCount = stats.tris;
  edgeCount = stats.edges;
  regionCount = stats.regions;
  lineVertCount = stats.lineVerts;
  hasGlow = stats.hasGlow;
  merged.computeBoundingSphere();
  sceneSphere = merged.boundingSphere;   // drives the adaptive far plane
  if (glassVertCount) {                  // expand it to cover the glass mesh
    mergedGlass.computeBoundingSphere();
    const gs = mergedGlass.boundingSphere;
    if (merged.attributes.position.count === 0) sceneSphere = gs;
    else {
      const reach = sceneSphere.center.distanceTo(gs.center) + gs.radius;
      if (reach > sceneSphere.radius) sceneSphere.radius = reach;
    }
  }
  sceneRoot = new THREE.Mesh(merged, idMaterial);
  sceneRoot.frustumCulled = false;
  scene.add(sceneRoot);
  glassRoot = new THREE.Mesh(mergedGlass, idMaterial);
  glassRoot.frustumCulled = false;
  scene.add(glassRoot);
  lineSegs = new THREE.LineSegments(lineGeom, lineMaterial);
  lineSegs.frustumCulled = false;
  lineSegs.visible = false;
  scene.add(lineSegs);
  markDirty();
}

/* ============================================================
   Player + hoverbike: dynamic actors on top of the merged scene.
   Actors are built with put() so they carry the baked face-ID /
   size / paint attributes idMaterial needs, then merged into their
   OWN mesh and moved as normal Object3Ds — the shaders transform by
   modelViewMatrix, so only the scene merge required world-space
   baking, not the materials.
   ============================================================ */
// ---- ground query: swappable flat-vs-raycast implementations ----
let groundDatum = 0;               // per-scene walk height, set by buildScene()
const _rayDown = new THREE.Vector3(0, -1, 0);
const _rayOrg = new THREE.Vector3(), _rayDir = new THREE.Vector3();
const _ray = new THREE.Raycaster();
function groundHeightFlat(x, z, curY) { return groundDatum; }
// full collision: rays against the merged scene mesh. O(triangles) per ray
// (no BVH), so it's opt-in; this hook is the seam where a baked heightfield
// or three-mesh-bvh drops in if it ever gets too slow.
function groundHeightRay(x, z, curY) {
  if (!sceneRoot) return groundDatum;
  _ray.set(_rayOrg.set(x, curY + 2.5, z), _rayDown);
  const hit = _ray.intersectObject(sceneRoot, false)[0];
  return hit ? hit.point.y : groundDatum;
}
let groundHeight = groundHeightFlat;
function resolveMoveFree(pos, dx, dz, out) { return out.set(dx, 0, dz); }
function resolveMoveBlocked(pos, dx, dz, out) {
  out.set(dx, 0, dz);
  const len = Math.hypot(dx, dz);
  if (!sceneRoot || len < 1e-6) return out;
  // knee-height ray along the move: stop at walls and machinery
  _ray.set(_rayOrg.set(pos.x, pos.y + 0.45, pos.z),
           _rayDir.set(dx / len, 0, dz / len));
  _ray.far = len + 0.4;
  const hit = _ray.intersectObject(sceneRoot, false)[0];
  _ray.far = Infinity;
  if (hit) out.set(0, 0, 0);
  return out;
}
let resolveMove = resolveMoveFree;
function swapGroundImpl() {
  groundHeight = P.collision ? groundHeightRay : groundHeightFlat;
  resolveMove = P.collision ? resolveMoveBlocked : resolveMoveFree;
}

// ---- dynamic actor factory ----
const actors = [];
function buildActor(builderFn, seed) {
  // swap the merge globals out so the scene's bag/crng/paint streams
  // are untouched no matter when an actor gets built
  const prevBag = bag, prevCrng = crng;
  const pc = currentPaint, pa = currentAlpha, pg = currentGlow;
  const ps = currentSoft, pk = currentContour, pb = currentPBlend;
  const pu = currentUnlit, pn = currentNoCast;
  bag = []; crng = mulberry32(seed);
  builderFn();
  const mine = bag;
  bag = prevBag; crng = prevCrng;
  currentPaint = pc; currentAlpha = pa; currentGlow = pg;
  currentSoft = ps; currentContour = pk; currentPBlend = pb;
  currentUnlit = pu; currentNoCast = pn;
  const { merged, mergedGlass, lineGeom } = mergeBagArray(mine, { timing: false });
  mergedGlass.dispose();               // actors are opaque-only
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(merged, idMaterial);
  mesh.frustumCulled = false;
  // vector-mode line verts intentionally uncounted in the budget meter
  const lines = new THREE.LineSegments(lineGeom, lineMaterial);
  lines.frustumCulled = false;
  lines.visible = false;
  group.add(mesh, lines);
  scene.add(group);
  const a = { group, mesh, lines };
  actors.push(a);
  return a;
}

// ---- the two actors + their state ----
// player state machine: 'onFoot' <-> 'riding', transitions only in
// tryMountToggle(). yaw 0 faces -z, matching the fly convention.
const player = { state: 'onFoot', pos: new THREE.Vector3(6, 0, 8), yaw: 0, speed: 0, bobT: 0 };
const bike = { pos: new THREE.Vector3(10, 0, 2), yaw: 0.6, speed: 0, hoverT: 0 };
let playerActor = null, bikeActor = null;
const _mv = new THREE.Vector3(), _seat = new THREE.Vector3();
const UP_Y = new THREE.Vector3(0, 1, 0);
const BIKE_HOVER = 0.55;

// primitive placeholder robot: ~1.8 units tall, feet at y=0, facing -z
function buildPlayerGeom() {
  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  withPaint(PAL.slate, () => {

  g.applyMatrix4(new THREE.Matrix4().makeScale(0.28, 0.28, 0.28));

function applyActorTransforms() {
  if (!playerActor) return;
  bikeActor.group.position.copy(bike.pos);
  bikeActor.group.rotation.set(0, bike.yaw, 0);
  if (player.state === 'riding') {
    _seat.set(0, 0.85, 0.35).applyAxisAngle(UP_Y, bike.yaw);
    playerActor.group.position.copy(bike.pos).add(_seat);
    playerActor.group.rotation.set(0, bike.yaw, 0);
  } else {
    const bob = Math.sin(player.bobT * 8) * 0.05 * Math.min(1, player.speed / 2);
    playerActor.group.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
    playerActor.group.rotation.set(0, player.yaw, 0);
  }
}

// the greebled scenes have machinery on many plates and the layout moves
// with the seed, so no fixed spawn is safe: spiral outward probing with a
// down-ray until the probe lands at walk height instead of on a roof.
// One-time cost (spawn / rebuild only) — never per frame.
function findClearSpot(x, z) {
  for (let ring = 0; ring < 6; ring++) {
    const n = Math.max(1, ring * 8);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const cx = x + Math.cos(a) * ring * 4.75, cz = z + Math.sin(a) * ring * 4.75;
      if (groundHeightRay(cx, cz, 40) <= groundDatum + 0.3) return { x: cx, z: cz };
    }
  }
  return { x, z };
}

function placeActorsAtSpawn() {
  const ps = findClearSpot(6, 8);
  player.pos.set(ps.x, groundDatum, ps.z);
  player.state = 'onFoot';
  const bs = findClearSpot(ps.x + 4.75, ps.z - 4.75);
  bike.pos.set(bs.x, groundDatum + BIKE_HOVER, bs.z);
  bike.speed = 0;
  bike.yaw = Math.atan2(-(bs.x - ps.x), -(bs.z - ps.z)) + Math.PI / 2; // parked side-on
  applyActorTransforms();
  shadowDirty = true;
}

function regroundActors() {
  if (!playerActor) return;
  // scene changed under us: if the old spot is now inside machinery,
  // respawn somewhere clear; otherwise just re-seat on the new datum
  // while riding, player.pos is stale (transforms come from the bike) —
  // keep the pair together before probing
  if (player.state === 'riding') { player.pos.x = bike.pos.x; player.pos.z = bike.pos.z; }
  if (groundHeightRay(player.pos.x, player.pos.z, 40) > groundDatum + 0.3) {
    placeActorsAtSpawn();               // respawns on foot at a clear spot
    return;
  }
  if (player.state !== 'riding' &&
      groundHeightRay(bike.pos.x, bike.pos.z, 40) > groundDatum + 0.3) {
    const bs = findClearSpot(player.pos.x + 4.75, player.pos.z - 4.75);
    bike.pos.set(bs.x, groundDatum + BIKE_HOVER, bs.z);
  }
  player.pos.y = groundHeight(player.pos.x, player.pos.z, player.pos.y + 1);
  bike.speed = 0;
  bike.pos.y = groundHeight(bike.pos.x, bike.pos.z, bike.pos.y + 1) + BIKE_HOVER;
  applyActorTransforms();
  shadowDirty = true;
}

function spawnActors() {
  if (playerActor) return;
  playerActor = buildActor(buildPlayerGeom, 0xB0B0 ^ P.seed);
  bikeActor = buildActor(buildBikeGeom, 0x51CE ^ P.seed);
  placeActorsAtSpawn();
}

function tryMountToggle() {
  if (!playerActor) return;
  if (player.state === 'riding') {
    player.state = 'onFoot';
    // dismount to the bike's right side
    player.pos.set(bike.pos.x + Math.cos(bike.yaw) * 2, 0,
                   bike.pos.z - Math.sin(bike.yaw) * 2);
    player.pos.y = groundHeight(player.pos.x, player.pos.z, bike.pos.y);
    player.yaw = bike.yaw;
    player.speed = 0;
  } else if (player.pos.distanceTo(bike.pos) < 3.5) {
    player.state = 'riding';
  }
  applyActorTransforms();
  shadowDirty = true;
  markDirty();
}

/* ============================================================
   Render targets: ID color + depth in one, view normals in another
   ============================================================ */
// TWO target sets: a 1x set for interactive frames and (when
// supersample > 1) a full-scale set for refined stills. Keeping both
// alive means switching costs nothing per frame — no pass logic or
// shader behavior changes between them, only buffer size.
let targetsLo = null, targetsHi = null, rtScreen = null;
let rtEdges = null, rtWeights = null;   // smaa intermediates, screen res
// dropdown string -> hardware sample count (three clamps to the device max)
const msaaSamples = () => ({ off: 0, '4x': 4, '8x': 8 })[P.msaa] || 0;
function makeTargetSet(scale) {
  const s = renderer.getPixelRatio() * scale;
  const w = Math.floor(innerWidth * s);
  const h = Math.floor(innerHeight * s);
  const depthTexture = new THREE.DepthTexture(w, h);
  depthTexture.type = THREE.UnsignedIntType;
  const glassDepth = new THREE.DepthTexture(w, h);
  glassDepth.type = THREE.UnsignedIntType;
  return {
    scale,
    // MRT: attachment 0 = face-ID + size, attachment 1 = paint (watercolor).
    // WebGLMultipleRenderTargets is the r160 API (pinned by the importmap);
    // WebGLRenderTarget({count: 2}) is the newer form and silently yields
    // zero textures on r160 — do not switch until three is upgraded.
    rtID: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture, depthBuffer: true,
      samples: msaaSamples(),
    }),
    // the translucent layer: same shape, its OWN depth so the compose
    // step can decide per pixel whether glass sits in front
    rtGlass: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture: glassDepth, depthBuffer: true,
      samples: msaaSamples(),
    }),
    // glass again with front faces culled: the nearest BACK faces, so
    // interior edges can be drawn through the glass
    rtGlassBack: new THREE.WebGLMultipleRenderTargets(w, h, 2, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthTexture: (() => { const d = new THREE.DepthTexture(w, h); d.type = THREE.UnsignedIntType; return d; })(),
      depthBuffer: true,
      samples: msaaSamples(),
    }),
    rtNormal: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    }),
    rtInk: new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      // vector mode draws real line geometry into rtInk, where hardware
      // MSAA earns its keep; the raster path only ever renders a
      // fullscreen quad here, so skip the 4-8x memory then
      samples: P.vectorMode ? msaaSamples() : 0,
    }),
    // quarter-res ping-pong pair for the emissive halo blur
    rtGlowA: new THREE.WebGLRenderTarget(w >> 2, h >> 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    }),
    rtGlowB: new THREE.WebGLRenderTarget(w >> 2, h >> 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    }),
    // half-res ping-pong pair for the cast-shadow silhouette smoothing
    // (mask -> blur -> re-threshold); linear filter so the main pass
    // upsamples the final field smoothly
    rtMaskA: new THREE.WebGLRenderTarget(w >> 1, h >> 1, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    }),
    rtMaskB: new THREE.WebGLRenderTarget(w >> 1, h >> 1, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    }),
  };
}
function disposeSet(t) {
  if (t) {
    t.rtID.dispose(); t.rtGlass.dispose(); t.rtGlassBack.dispose();
    t.rtNormal.dispose(); t.rtInk.dispose(); t.rtGlowA.dispose(); t.rtGlowB.dispose();
    t.rtMaskA.dispose(); t.rtMaskB.dispose();
  }
}
function makeTargets() {
  disposeSet(targetsLo); disposeSet(targetsHi);
  if (rtScreen) rtScreen.dispose();
  if (rtEdges) rtEdges.dispose();
  if (rtWeights) rtWeights.dispose();
  targetsLo = makeTargetSet(1);
  targetsHi = P.superSample > 1 ? makeTargetSet(P.superSample) : null;
  const sw = Math.floor(innerWidth * renderer.getPixelRatio());
  const sh = Math.floor(innerHeight * renderer.getPixelRatio());
  // screen-res intermediate so post AA can run AFTER the downsample
  rtScreen = new THREE.WebGLRenderTarget(sw, sh, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  });
  // smaa's two intermediates, also screen res (edge flags, blend weights)
  const smaaOpts = {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false,
  };
  rtEdges = new THREE.WebGLRenderTarget(sw, sh, smaaOpts);
  rtWeights = new THREE.WebGLRenderTarget(sw, sh, smaaOpts);
  markDirty();

makeTargets();

// cast-shadow map: screen-resolution independent, cached until
// shadowDirty. Depth-only content; the color attachment is unused.
let rtShadow = null;
function makeShadowTarget() {
  if (rtShadow) rtShadow.dispose();
  const res = +P.shadowRes;
  const d = new THREE.DepthTexture(res, res);
  d.type = THREE.UnsignedIntType;
  // compare mode + linear filtering = hardware PCF: each lookup is a
  // bilinear 4-tap depth comparison (sampler2DShadow in the post shader)
  d.compareFunction = THREE.LessCompare;
  d.minFilter = THREE.LinearFilter;
  d.magFilter = THREE.LinearFilter;
  rtShadow = new THREE.WebGLRenderTarget(res, res, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    depthTexture: d, depthBuffer: true,
  });
  shadowDirty = true;
  markDirty();
}
makeShadowTarget();
const lightCam = new THREE.OrthographicCamera();
const lightVPmat = new THREE.Matrix4();
// shadow-pass depth material: no-cast geometry (ID blue bit 1) is
// discarded so it casts no shadow, without leaving the merged mesh
const depthOnlyMat = new THREE.ShaderMaterial({
  vertexColors: true, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying float vNoCast;
    void main() {
      vNoCast = mod(floor(floor(color.b * 255.0 + 0.5) / 2.0), 2.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vNoCast;
    void main() {
      if (vNoCast > 0.5) discard;
      gl_FragColor = vec4(1.0);
    }`,
});

/* ============================================================
   Post pass — where the ink happens
   ============================================================ */
const post = new THREE.ShaderMaterial({
  uniforms: {
    tID:        { value: null },
    tNormal:    { value: null },
    tDepth:     { value: null },
    resolution: { value: new THREE.Vector2() },
    cameraNear: { value: camera.near },
    cameraFar:  { value: camera.far },
    lightDir:   { value: new THREE.Vector3() },
    inkColor:   { value: new THREE.Color(P.inkColor) },
    paperColor: { value: new THREE.Color(P.paperColor) },
    idThreshold: { value: 0 },
    lineWidth: { value: 0 }, distanceFalloff: { value: 0 },
    wobbleAmp: { value: 0 }, wobbleFreq: { value: 0 },
    hatchOn: { value: 1 }, hatchThreshold: { value: 0 }, crossThreshold: { value: 0 },
    hatchSpacing: { value: 0 }, hatchWidth: { value: 0 }, hatchAngle: { value: 0 },
    hatchNoise: { value: 0 }, hatchNoiseScale: { value: 1 }, hatchBreak: { value: 0 },
    shadeMode: { value: 0 }, shadowAmount: { value: 0 },
    shadowLine: { value: 0 }, shadowLineWidth: { value: 1 },
    paperGrain: { value: 0 }, oneSided: { value: 0 }, coverage: { value: 0 },
    edgeToAlpha: { value: 0 }, softContact: { value: 0 }, groundY: { value: 0 },
    minFeature: { value: 0 }, invFovScale: { value: 1 }, keepSil: { value: 0 },
    // watercolor
    tPaint:     { value: null },
    skyColor:   { value: new THREE.Color(P.skyColor) },
    colorOn:    { value: 1 },
    washAmount: { value: 0 }, washScale: { value: 1 }, poolAmount: { value: 0 },
    inkTint: { value: 0 }, aerialFade: { value: 0 },
    invViewProj: { value: new THREE.Matrix4() },
    viewToWorldN: { value: new THREE.Matrix3() },
    // glass & glow
    tGlassID: { value: null }, tGlassPaint: { value: null }, tGlassDepth: { value: null },
    tGlassBackID: { value: null }, tGlassBackDepth: { value: null },
    tGlow: { value: null },
    glassTint: { value: 0 }, glassLine: { value: 0 }, glassBackLine: { value: 0 },
    glowLift: { value: 0 }, haloStrength: { value: 0 },
    contourLine: { value: 0 }, contourCos: { value: 0 },
    tShadow: { value: null }, lightVP: { value: new THREE.Matrix4() },
    castOn: { value: 0 }, shadowBias: { value: 0 },
    shadowWobUv: { value: new THREE.Vector2() },
    tCastMask: { value: null }, castSmoothOn: { value: 0 }, castBand: { value: 0.2 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tID, tNormal, tDepth;
    uniform vec2 resolution;
    uniform float cameraNear, cameraFar;
    uniform vec3 lightDir, inkColor, paperColor;
    uniform float idThreshold, lineWidth, distanceFalloff,
                  wobbleAmp, wobbleFreq, hatchOn, hatchThreshold, crossThreshold,
                  hatchSpacing, hatchWidth, hatchAngle, hatchNoise, hatchNoiseScale,
                  hatchBreak, shadeMode, shadowAmount, shadowLine, shadowLineWidth,
                  paperGrain, oneSided, coverage, minFeature, invFovScale, keepSil,
                  edgeToAlpha, softContact, groundY;
    uniform sampler2D tPaint;
    uniform vec3 skyColor;
    uniform float colorOn, washAmount, washScale, poolAmount, inkTint, aerialFade;
    uniform mat4 invViewProj;
    uniform mat3 viewToWorldN;
    uniform sampler2D tGlassID, tGlassPaint, tGlassDepth, tGlow;
    uniform sampler2D tGlassBackID, tGlassBackDepth;
    uniform float glassTint, glassLine, glassBackLine, glowLift, haloStrength;
    uniform float contourLine, contourCos;
    uniform highp sampler2DShadow tShadow;
    uniform mat4 lightVP;
    uniform float castOn, shadowBias;
    uniform vec2 shadowWobUv;   // wobble amplitude: fixed world size -> window UV
    uniform sampler2D tCastMask;            // blurred + re-thresholded shadow mask
    uniform float castSmoothOn, castBand;

    // ---- helpers -------------------------------------------------
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float vnoise(vec2 p) {              // value noise, for wobble + grain
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
                 mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
    }
    float hash3(vec3 p) {
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
    }
    float vnoise3(vec3 p) {             // 3D value noise, for world-anchored pigment
      vec3 i = floor(p), f = fract(p);
      vec3 u = f * f * (3.0 - 2.0 * f);
      float a = mix(mix(hash3(i), hash3(i + vec3(1,0,0)), u.x),
                    mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), u.x), u.y);
      float b = mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), u.x),
                    mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), u.x), u.y);
      return mix(a, b, u.z);
    }
    // world position from the depth buffer — pigment must live ON the
    // surfaces, not on the picture plane, or it swims when the camera moves
    vec3 worldAt(vec2 uv) {
      float z = texture2D(tDepth, uv).x;
      vec4 w = invViewProj * vec4(uv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
      return w.xyz / w.w;
    }
    // one octave of zero-mean pigment noise, faded out once its features
    // shrink below a few pixels so distant surfaces don't shimmer
    float pigment(vec3 wp, float freq, float wpx) {
      return (vnoise3(wp * freq) - 0.5) *
             smoothstep(3.0, 10.0, 1.0 / max(freq * wpx, 1e-6));
    }
    float linDepth(vec2 uv) {           // linear view-space distance
      float z = texture2D(tDepth, uv).x;
      float ndc = z * 2.0 - 1.0;
      return (2.0 * cameraNear * cameraFar) /
             (cameraFar + cameraNear - ndc * (cameraFar - cameraNear));
    }
    vec3 normalAt(vec2 uv) { return texture2D(tNormal, uv).xyz * 2.0 - 1.0; }
    float linDepthG(vec2 uv) {          // same, for the glass layer's depth
      float z = texture2D(tGlassDepth, uv).x;
      float ndc = z * 2.0 - 1.0;
      return (2.0 * cameraNear * cameraFar) /
             (cameraFar + cameraNear - ndc * (cameraFar - cameraNear));
    }
    float linDepthGB(vec2 uv) {         // and the glass BACK-face layer

    }

    // color-step test (no LOD/one-sided/coverage — glass linework is
    // sparse enough that the full machinery isn't worth its taps)
    float glassInk(vec2 p, vec2 o) {
      vec3 c = texture2D(tGlassID, p).rgb;
      float d =        distance(c, texture2D(tGlassID, p + vec2(o.x, 0.)).rgb);
      d = max(d, distance(c, texture2D(tGlassID, p - vec2(o.x, 0.)).rgb));
      d = max(d, distance(c, texture2D(tGlassID, p + vec2(0., o.y)).rgb));
      d = max(d, distance(c, texture2D(tGlassID, p - vec2(0., o.y)).rgb));
      return smoothstep(idThreshold, idThreshold * 3.0, d);
    }
    float glassInkB(vec2 p, vec2 o) {   // same test on the back-face layer
      vec3 c = texture2D(tGlassBackID, p).rgb;
      float d =        distance(c, texture2D(tGlassBackID, p + vec2(o.x, 0.)).rgb);
      d = max(d, distance(c, texture2D(tGlassBackID, p - vec2(o.x, 0.)).rgb));
      d = max(d, distance(c, texture2D(tGlassBackID, p + vec2(0., o.y)).rgb));
      d = max(d, distance(c, texture2D(tGlassBackID, p - vec2(0., o.y)).rgb));
      return smoothstep(idThreshold, idThreshold * 3.0, d);
    }
    // coverage versions: same 4-sub-pixel averaging the main detector
    // uses — a wobble-induced miss becomes partial ink instead of a gap
    // RGSS: rotated-grid sub-pixel offsets — resolves the near-horizontal
    // and near-vertical staircases an axis-aligned quad misses, same 4 taps
    #define RG1 vec2(-0.375, -0.125)
    #define RG2 vec2( 0.125, -0.375)
    #define RG3 vec2( 0.375,  0.125)
    #define RG4 vec2(-0.125,  0.375)
    float glassInkC(vec2 p, vec2 o, vec2 px) {
      if (coverage < 0.5) return glassInk(p, o);
      return 0.25 * (glassInk(p + px * RG1, o) + glassInk(p + px * RG2, o)
                   + glassInk(p + px * RG3, o) + glassInk(p + px * RG4, o));
    }
    float glassInkBC(vec2 p, vec2 o, vec2 px) {
      if (coverage < 0.5) return glassInkB(p, o);
      return 0.25 * (glassInkB(p + px * RG1, o) + glassInkB(p + px * RG2, o)
                   + glassInkB(p + px * RG3, o) + glassInkB(p + px * RG4, o));

    // the ID buffer's alpha carries each shape's world size (log

    // size as a FRACTION of screen height — not pixels, so the
    // result is identical in the interactive 1x frame and the
    // refined supersampled one.
    float lodGain(float enc, float dist) {
      if (minFeature <= 0.0) return 1.0;
      float frac = exp2(enc * 15.0 - 7.0) * invFovScale / max(dist, 1e-4);
      return smoothstep(minFeature, minFeature * 2.0, frac);
    }

    // ink contributed toward ONE neighbor. In one-sided mode the line
    // only draws on the NEARER surface (or, for coplanar seams, on the
    // arbitrarily-but-consistently brighter face) — halving line width
    // for free. The LOD gain uses the SMALLER of the two shapes the
    // edge separates, so a shrinking detail fades away completely
    // rather than leaving an outline around nothing.
    float dirInk(vec4 c, vec2 uv, vec2 su, float dC, float gC, vec3 nC) {
      vec4 cn = texture2D(tID, su);
      float diff = distance(c.rgb, cn.rgb);
      if (diff <= 0.0) return 0.0;
      float ink = smoothstep(idThreshold, idThreshold * 1.8, diff);
      if (ink <= 0.0) return 0.0;

      // flag (ID red LSB), predict the neighbor's depth from this
      // pixel's tangent plane and fade the line where actual depth
      // matches the prediction — surfaces in geometric contact lose
      // their line, true occlusion silhouettes keep it. The tolerance
      // scales with depth and slope, so unlike a raw depth threshold

      if (softContact > 0.0) {
