<div id="app"></div>
<div id="sceneMenu"><h1>SCENES</h1><div id="sceneList"></div></div>
<div id="panel"><h1>MOEBIUS LINES</h1></div>
<div id="budget"><h1>BUDGET</h1><div id="budgetList"></div><details id="budgetAdv"><summary>advanced</summary><div id="budgetAdvList"></div></details></div>
<div id="debugbar"><span class="lab">debug</span></div>
<div id="hint">drag&nbsp;=&nbsp;orbit&nbsp;&nbsp;·&nbsp;&nbsp;shift-drag&nbsp;=&nbsp;pan&nbsp;&nbsp;·&nbsp;&nbsp;wheel&nbsp;=&nbsp;zoom&nbsp;&nbsp;·&nbsp;&nbsp;drop&nbsp;.obj&nbsp;to&nbsp;load</div>

{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Params — everything the control panel drives
   ============================================================ */
const P = {
  // edge extraction — face-ID only: every face boundary is a line
  idThreshold: 0.005,
  // soft-rooted geometry: contact-line fade strength (0 = off).
  // Scale-invariant plane test, not a raw depth threshold.
  softContact: 1,
  // region grouping: neighbors that share a color draw no line between them
  regionGroup: true, similarity: 0.25,
  // self-overlap contours from the normal buffer: ink where visible
  // surface orientation jumps discontinuously (a fold crossing itself),
  // which the ID detector can't see inside a single region. 0 = off.
  contourLine: 1, contourAngle: 80,
  // debug: draw the face-ID buffer itself instead of the ink
  showIDs: false,
  // debug: raw triangle wireframe on paper (ink-colored lines)
  wireframe: false,
  // procedural skybox: horizon tint of the gradient, cloud coverage,
  // and scattered pale ovals on the ground plane (all shader noise)
  skyHorizon: '#f4d9c8', clouds: 0.55, groundSpeckle: 1,
  // sky gradient height (elevation where horizon tint gives way to sky),
  // cloud mass scale + horizon fade-in band, speckle size multiplier
  // (1 = the old hardcoded look) and distance-fade STRENGTH: 0 = never
  // fade (default), 1 = the old ramp, higher pulls the fade closer
  // cloudFade 0 = clouds wrap all the way around/below the horizon;
  // raise it to fade them out toward the horizon line instead.
  // cloudStretch elongates cloud shapes along cloudStretchDir (deg).
  skyGradHeight: 1, cloudScale: 5.5, cloudFade: 0,
  cloudStretch: 1, cloudStretchDir: 0,
  speckleSize: 1, speckleFade: 0,
  // emissive sun disc drawn at the LIGHT direction (size in degrees,
  // 0 = off). Its bloom rides the shared lamp glow pipeline at full
  // emissive strength — halo/haloSize are the only bloom controls.
  sunSize: 15, sunColor: '#f7c948',
  // how far the hot core pushes from sunColor toward white (the halo
  // itself goes through the emissive glow pipeline, sized by haloSize)
  sunCore: 0.4,
  // feature LOD: fade a line when the shapes it separates are small on screen.
  // minFeature is a % of screen height; 0 disables the whole feature.
  // the raster detector's lodGain is GRAZING-AWARE (divides distance by
  // the facet's view-space |n.z|): a grate slat viewed at a glancing
  // angle compresses sub-pixel long before its radial distance says so,
  // and without the projection term its ink collapsed into shimmer.
  // 'thin' would also fix grates but strips railing/cable ink scene-wide.
  minFeature: 0.4, lodMetric: 'area', lodUnit: 'region', keepSilhouettes: false,
  // near plane as a fraction of the orbit distance — raise it to buy depth
  // precision (less z-fighting), lower it if close geometry starts clipping
  nearFactor: 0.02,
  // drop loaded-model faces sealed inside another part (assembled models)
  cullBuried: false,
  // line look
  lineWidth: 0.5, distanceFalloff: 1.25,
  wobbleAmp: 0, wobbleFreq: 0.08,
  // shading: the lambert term darkens the fill, never strokes it
  shadeOn: true, shadeThreshold: 0.18, coreThreshold: 0.02,
  // cast shadows: one directional sun, drawn as per-triangle depth-fail
  // stencil shadow volumes — pixel-exact hard silhouettes, no map
  // resolution, no depth bias, no fitted light window to fall out of.
  // Orbit animates the azimuth.
  castShadow: true, lightAzimuth: 303, lightElevation: 50,
  // shadowSmoothPx simplifies the shadow silhouette: the shadow mask
  // is blurred and re-thresholded at 50%, twice — features smaller than
  // the radius vanish and corners round into painted lobes. The radius
  // is one flat value in world units (slider/10); in hard shade mode the
  // lambert terminator melts too, at slider/20. 0 = exact geometry
  // (single-tap path). The melt only acts on ORGANIC receivers (blue
  // bit 2) — hard-surface pixels get radius 0, so machinery's shadows
  // stay crisp at any setting.
  lightOrbit: false, orbitLightSpeed: 12, shadowSmoothPx: 0,
  // shade-boundary breakup: displacement noise amount (it pushes the
  // lit/shade boundary and the cast-shadow lookup around) and the
  // world-space feature size of that noise.
  shadeNoise: 0, shadeNoiseScale: 1,
  // shading style: 'hard' = flat cel step, 'soft' = smooth ramp. Both
  // reuse the shade thresholds — core adds a deeper second level — and
  // both take the noise sliders.
  shadeStyle: 'hard', shadowAmount: 0.22,
  // shade from crease-limited smoothed normals: the lit/shade boundary
  // sweeps across low-poly facets instead of staircasing along their
  // edges (ink and contours still see the flat facets). Pure texture
  // swap — toggling costs nothing and needs no rebuild.
  smoothShade: true,
  // per-class shade-field blur (screen px, before the hard threshold):
  // organic surfaces (withOrganic / blue bit 2, which also get PN
  // quadratic shade normals) melt generously; hard-surface machinery
  // defaults to none so mechanical detail stays crisp. Ignored while
  // the melt owns the terminator (shadow smooth > 0).
  organicBlurPx: 1.5, hardBlurPx: 1,
  // debug bar (top of screen): 'off' = normal render; 'classes' paints
  // organic green / hard orange; the rest blit individual render passes
  debugView: 'off',
  // ink along shadow boundaries (0 = off) and its width as a multiple
  // of the regular line radius
  // shadow outlines at FULL ink strength and shared width by default:
  // every line in the scene is the same pen (lower shadowLine to make
  // shadow outlines read lighter than geometry lines)
  shadowLine: 1.0, shadowLineWidth: 1.0,
  // colors
  inkColor: '#1d1a17', paperColor: '#f6f2e6', paperGrain: 0, grainScale: 1,
  // paper material model: pressed-felt fiber strength and granule flecks
  paperFiber: 0.35, paperFleck: 0.5,
  // watercolor (raster mode only): per-kind fills baked at rebuild,
  // wash/pooling/tint/fade applied in the compose step. colorOn off
  // must render pixel-identical to the pre-color build.
  colorOn: true, skyColor: '#d8efec',
  washAmount: 0, washScale: 3.05, poolAmount: 0, inkTint: 0, aerialFade: 0.81,
  // edge-pooling band width (× line radius) and the aerial fade ramp
  // endpoints as fractions of the camera far plane
  poolRadius: 3.5, aerialNear: 0.18, aerialFar: 1.5,
  // per-region value drift baked into aPaint — adjacent panels read as
  // separately mixed brush pools (rebuilds on change)
  regionJitter: 0.07,
  // glass & glow: translucent-layer fill/line strength, emissive
  // brightness lift, and the halo bleeding past lamp silhouettes
  glassTint: 0.51, glassLine: 1, glassBackLine: 1, glowLift: 0.5,
  haloStrength: 0.85, haloSize: 3.75,
  // thin lines & AA
  oneSided: false, coverageAA: true, superSample: 1,
  aaMode: 'smaa', progressive: false,
  // camera: orbit around a target, or free-floating WASD/QE flight
  flyMode: false, flySpeed: 1,
  // player: third-person character + rideable hoverbike
  playerMode: false, walkSpeed: 1, driveSpeed: 1,
  camDist: 9, camHeight: 1.6, collision: false,
  // scene
  scene: 'showcase', perQuad: false, autoRotate: false, rotateSpeed: 7.5, seed: 7,
};

/* ============================================================
   Seeded RNG
   ============================================================ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(P.seed);
// Face colors draw from their OWN stream, separate from the scene stream,
// so that any option changing how many colors get rolled — per-quad,
// region grouping, similarity — only ever changes color.
let crng = mulberry32(P.seed ^ 0x9e3779b9);
// Paint jitter draws from a THIRD stream: it must consume neither rng
// (scene layout) nor crng (ID colors), or adding color would reshuffle
// the scene and break the colorOn-off pixel-identity guarantee.
let prng = mulberry32(P.seed ^ 0x5f356495);

/* ============================================================
   Watercolor palette — sampled from reference-watercolor.png
   ============================================================ */
// RAW hex bytes, deliberately bypassing THREE.Color: ColorManagement
// would convert to linear-sRGB, but the post shader writes its output
// unencoded, so raw display bytes are what come back out of the screen
// unchanged. (Verified: routing through THREE.Color renders the sky
// visibly darker/more saturated than the palette hex.)
const hex2u8 = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
// same raw-byte semantics as hex2u8 (deliberately bypassing the linear
// conversion .set(hex) would do) but writes straight into an existing
// THREE.Color, so the per-frame uniform updates allocate nothing
const setRawHex = (c, h) => {
  const n = parseInt(h.slice(1), 16);
  return c.setRGB(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
};
const PAL = {
  sky:       hex2u8('#D8EFEC'),  // pale ice — aerial fade target
  sand:      hex2u8('#EDE6D4'),  // cream — ground, plates, dishes
  pink:      hex2u8('#E0B4B0'),  // dusty pink — plinths, distance
  rose:      hex2u8('#C98F94'),
  mauve:     hex2u8('#C090A8'),  // tanks, soft forms
  peri:      hex2u8('#8F9AC8'),  // periwinkle — machine bodies
  slate:     hex2u8('#7890A8'),  // vents, grates, hardware
  deepSlate: hex2u8('#7880B0'),  // rivets, bolts
  cyan:      hex2u8('#6FBEDC'),  // secondary accent — portholes, glass
  celadon:   hex2u8('#9CC4A4'),  // pipes
  mint:      hex2u8('#BFD8B4'),  // AC boxes
  red:       hex2u8('#C94F4A'),  // THE accent — one hero object per scene
  shadow:    hex2u8('#4A4C6E'),  // cables, railings, ladders
  amber:     hex2u8('#E8A33D'),  // emissive — lamps, glow, embers
  emerald:   hex2u8('#5FD98A'),  // emissive — reactors, power cells
};
// imported models: usemtl (or o/g) names -> material, keyword match
// first. Entries are {c, a?, e?}: a < 1 routes to the translucent
// layer, e > 0 marks emissive (translucent + emissive unsupported —
// the keyword sets are kept disjoint on purpose).
const MTL_PAINT = [
  [/glow|ember|neon|lamp/i,                      { c: PAL.amber, e: 1 }],
  [/phosphor|crt|screen/i,                       { c: PAL.cyan, e: 1 }],
  [/energy|reactor|plasma|fusion|cell/i,         { c: PAL.emerald, e: 1 }],
  [/glass|window|canopy/i,                       { c: PAL.cyan, a: 0.45 }],
  [/wood|plank|floor|linen|plaster|paper|card/i, { c: PAL.sand }],
  [/cloth|velour|sofa|jacket|fabric|curtain/i,   { c: PAL.mauve }],
  [/duct|steel|iron|metal|fitting|pipe|vent/i,   { c: PAL.slate }],
  [/cable|wire|rubber|tire|shadow/i,             { c: PAL.shadow }],
  [/armor|plate|hull|panel/i,                    { c: PAL.peri }],
  [/skin|face|hand|flesh/i,                      { c: PAL.pink }],
  [/plant|leaf|moss|grass/i,                     { c: PAL.celadon }],
  [/sky|city|backdrop/i,                         { c: PAL.sky }],
];
// hash fallback cycles the quiet hues only — red and cyan stay rare
const MTL_FALLBACK = [PAL.pink, PAL.rose, PAL.mauve, PAL.peri,
                      PAL.slate, PAL.celadon, PAL.mint, PAL.sand];
function paintForName(name) {
  for (const [re, m] of MTL_PAINT) if (re.test(name)) return m;
  let h = 5381;
  for (let i = 0; i < name.length; i++) h = (h * 33 ^ name.charCodeAt(i)) >>> 0;
  return { c: MTL_FALLBACK[h % MTL_FALLBACK.length] };
}
// deterministic per-region wash drift in [-1, 1) — an integer hash, not
// a stream, so it can never disturb the rng/crng call ordering
function washJitter(i) {
  let x = (i + Math.imul(P.seed, 131071) + 1) | 0;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return ((x >>> 0) / 4294967296) * 2 - 1;
}

// dirty-flag rendering: frames only render when something changed
// (camera, sliders, rebuilds). Lets progressive supersampling slot
// in a refined frame when you stop moving, and idles the GPU at rest.
let dirty = true;
let idleRefreshes = 0;            // bounded idle safety refreshes, reset on change
function markDirty() { dirty = true; idleRefreshes = 0; }
// stencil-shadow-volume geometry mirrors the merged mesh + actors;
// rebuilt lazily when this is set (scene rebuilds, actor builds).
// Declared up here because buildScene() runs before the volume
// machinery below is initialized.
let volDirty = true;

// the OBJ model scene's current model (starts as the embedded speeder;
// replaced when the user drops or loads an .obj)
// SMAA lookup textures (area + search), from three.js r160 SMAAPass (MIT),

/* ============================================================
   The model library — ALL scene geometry lives here.
   Nothing is generated procedurally: every shape on screen is an
   .obj file from models/, registered in models/manifest.json.
   The loader below fills this in; scenes read it.
   ============================================================ */
// one entry per model: { file, name, organic, scale, text }
let models = [];
// a dragged-in / picked .obj, shown by the 'drop' scene. Same shape as
// a manifest entry, so the scene builders treat it identically.
let droppedObj = null;
// raw text of one library model, by filename — the hoverbike actor's
// mesh comes from here rather than from a second embedded copy
function modelText(file) {
  const m = models.find(e => e.file === file);
  return m ? m.text : null;
}

/* ============================================================
   Face-ID coloring — YOUR technique:
   random color per face -> edge detect the color buffer.
   perQuad=true colors triangle *pairs* (most three.js primitives
   emit quads as consecutive tri pairs) so quads don't get a
   diagonal seam. perQuad=false shows every triangle.
   ============================================================ */
/* ------------------------------------------------------------
   Region grouping — the ID-map idea, applied to line control.
   Rather than one random color per face, adjacent faces are
   flood-filled into REGIONS and each region gets ONE color.
   Since the detector only inks where the color steps, a region's
   interior falls silent: a smooth sphere collapses to a single
   region and draws just its silhouette, while a cube still keeps
   its six faces. Two neighbors join when their face normals agree
   to within `similarity` (1 = coplanar only, lower tolerates more
   curvature) and nothing explicit separates them — an OBJ
   o/g/usemtl change always forces a boundary.
   ------------------------------------------------------------ */
function computeRegions(g, stride, similarity, triGroups) {
  const p = g.attributes.position.array;
  const nVert = g.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const triPerFace = stride / 3;

  // weld by quantized position: toNonIndexed() split the shared
  // vertices apart, but neighbors have to agree on vertex identity
  // 1e-4 is deliberately tight. Loosening it does NOT join parts that merely
  // butt together — it welds unrelated vertices, which collapses faces and
  // breaks the edge topology, so *fewer* neighbours pair up and regions go up.
  const tw0 = performance.now();
  const weld = new Map(), vid = new Int32Array(nVert);
  for (let i = 0; i < nVert; i++) {
    const b = i * 3;
    const k = Math.round(p[b] * 1e4) + '_' + Math.round(p[b + 1] * 1e4) +
              '_' + Math.round(p[b + 2] * 1e4);
    let id = weld.get(k);
    if (id === undefined) { id = weld.size; weld.set(k, id); }
    vid[i] = id;
  }
  const tr0 = performance.now(); tWeld += tr0 - tw0;

  // per face: area-weighted normal + its boundary edges. An edge used
  // twice *inside* one face is the quad's diagonal, not a boundary.
  const fn = new Float32Array(nFace * 3);
  const faceEdges = new Array(nFace);
  const owner = new Map();              // edge key -> first face, -1 once paired
  const pairs = [], pairKeys = [];      // faces meeting across a shared edge
  const seen = new Map();
  for (let f = 0; f < nFace; f++) {
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    let ax = 0, ay = 0, az = 0;
    seen.clear();
    for (let t = 0; t + 3 <= vN; t += 3) {
      const i0 = v0 + t, b0 = i0 * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      // cross product length is 2x area, so summing weights by area
      ax += uy * wz - uz * wy; ay += uz * wx - ux * wz; az += ux * wy - uy * wx;
      for (let e = 0; e < 3; e++) {
        const s = i0 + e, d = i0 + (e + 1) % 3, a = vid[s], c = vid[d];
        const key = a < c ? a + '_' + c : c + '_' + a;
        const prev = seen.get(key);
        if (prev) prev.n++; else seen.set(key, { n: 1, i: s, j: d });
      }
    }
    const l = Math.hypot(ax, ay, az) || 1;
    fn[f * 3] = ax / l; fn[f * 3 + 1] = ay / l; fn[f * 3 + 2] = az / l;
    const bnd = [];
    for (const [key, v] of seen) {
      if (v.n !== 1) continue;                      // internal diagonal
      bnd.push(key, v.i, v.j);
      const o = owner.get(key);
      if (o === undefined) owner.set(key, f);
      else if (o >= 0) { pairs.push(o, f); pairKeys.push(key); owner.set(key, -1); }
    }
    faceEdges[f] = bnd;
  }

  // union neighbors whose normals agree and that nothing separates
  const parent = new Int32Array(nFace);
  for (let f = 0; f < nFace; f++) parent[f] = f;
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  for (let i = 0; i < pairs.length; i += 2) {
    const a = pairs[i], b = pairs[i + 1];
    if (triGroups && triGroups[a * triPerFace] !== triGroups[b * triPerFace]) continue;
    if (fn[a * 3] * fn[b * 3] + fn[a * 3 + 1] * fn[b * 3 + 1] +
        fn[a * 3 + 2] * fn[b * 3 + 2] < similarity) continue;
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent[rb] = ra;
  }

  const region = new Int32Array(nFace), remap = new Map();
  for (let f = 0; f < nFace; f++) {
    const r = find(f);
    let id = remap.get(r);
    if (id === undefined) { id = remap.size; remap.set(r, id); }
    region[f] = id;
  }
  // edges with the same region on both sides are the lines that go
  // away; region adjacency drives color separation below
  const silent = new Set(), nbr = new Array(remap.size);
  for (let i = 0; i < remap.size; i++) nbr[i] = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const ra = region[pairs[i]], rb = region[pairs[i + 1]];
    if (ra === rb) silent.add(pairKeys[i >> 1]);
    else { nbr[ra].push(rb); nbr[rb].push(ra); }
  }
  tRegion += performance.now() - tr0;
  return { region, count: remap.size, nFace, faceEdges, silent, nbr };
}

/* ------------------------------------------------------------
   Feature size — how big a shape is, for screen-relative LOD.
   `similarity` is baked and view-independent, so it can decide a
   sphere is smooth but never that the sphere is 8px tall. This
   measures each shape in world units; the shaders divide by
   distance to get its apparent size and fade small stuff out.

   Three metrics, because which one reads best depends on how thin
   shapes like pipes and masts should behave — all are baked so
   the dropdown switches with no rebuild.
   ------------------------------------------------------------ */
const LOD_METRICS = ['area', 'diagonal', 'thin'];
const LOD_UNITS = ['region', 'object'];

// log encode into one byte: covers ~0.01 to 200 world units at ~4%
// relative precision, which is all an 8-bit alpha channel can carry
function encodeSize(s) {
  const t = (Math.log2(Math.max(s, 1e-3)) + 7) / 15;
  return Math.max(0, Math.min(255, Math.round(t * 255)));
}

function sizeMetrics(geom, stride, regionOf, nUnit) {
  const p = geom.attributes.position.array;
  const nVert = geom.attributes.position.count;
  const nFace = Math.ceil(nVert / stride);
  const area = new Float64Array(nUnit), bb = new Float64Array(nUnit * 6);
  for (let u = 0; u < nUnit; u++) {
    bb[u * 6] = bb[u * 6 + 1] = bb[u * 6 + 2] = Infinity;
    bb[u * 6 + 3] = bb[u * 6 + 4] = bb[u * 6 + 5] = -Infinity;
  }
  let oArea = 0;
  const ob = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
  for (let f = 0; f < nFace; f++) {
    const u = regionOf ? regionOf[f] : f;
    const v0 = f * stride, vN = Math.min(stride, nVert - v0);
    for (let t = 0; t + 3 <= vN; t += 3) {
      const b0 = (v0 + t) * 3, b1 = b0 + 3, b2 = b0 + 6;
      const ux = p[b1] - p[b0], uy = p[b1 + 1] - p[b0 + 1], uz = p[b1 + 2] - p[b0 + 2];
      const wx = p[b2] - p[b0], wy = p[b2 + 1] - p[b0 + 1], wz = p[b2 + 2] - p[b0 + 2];
      const a = Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) * 0.5;
      area[u] += a; oArea += a;
    }
    for (let i = v0; i < v0 + vN; i++) {
      const b = i * 3;
      for (let k = 0; k < 3; k++) {
        const x = p[b + k];
        if (x < bb[u * 6 + k]) bb[u * 6 + k] = x;
        if (x > bb[u * 6 + 3 + k]) bb[u * 6 + 3 + k] = x;
        if (x < ob[k]) ob[k] = x;
        if (x > ob[3 + k]) ob[3 + k] = x;
      }
    }
  }
  // "thin" is the MIDDLE bbox extent, not the smallest: the smallest is
  // 0 for any flat patch, which would make every panel read as a sliver
  const metrics = (ar, dx, dy, dz) => {
    const s = [dx, dy, dz].sort((a, b) => a - b);
    return [Math.sqrt(ar), Math.hypot(dx, dy, dz), s[1]];
  };
  const enc = new Uint8Array(nUnit * 3);
  for (let u = 0; u < nUnit; u++) {
    const m = metrics(area[u],
      Math.max(0, bb[u * 6 + 3] - bb[u * 6]),
      Math.max(0, bb[u * 6 + 4] - bb[u * 6 + 1]),
      Math.max(0, bb[u * 6 + 5] - bb[u * 6 + 2]));
    for (let k = 0; k < 3; k++) enc[u * 3 + k] = encodeSize(m[k]);
  }
  const om = metrics(oArea, Math.max(0, ob[3] - ob[0]),
    Math.max(0, ob[4] - ob[1]), Math.max(0, ob[5] - ob[2]));
  return { enc, obj: om.map(encodeSize) };
}

function faceIdColors(geometry, perQuad, variation = 1.0, paintCol = null,
                      matAlpha = 1, matGlow = 0, soft = 0, contour = 0, pblend = null,
                      unlit = 0, nocast = 0, organic = 0) {
  const geom = geometry.index ? geometry.toNonIndexed() : geometry;
  const count = geom.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const step = perQuad ? 6 : 3;
  const paint = (from, to, r, g, b) => {
    for (let i = from; i < to && i < count; i++) {
      colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
    }
  };

  if (!P.regionGroup) {
    for (let i = 0; i < count; i += step)
      paint(i, i + step, .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation,
                         .5 + (crng() - .5) * variation);
  } else {
    const R = computeRegions(geom, step, P.similarity, geometry.userData.faceGroup);
    // one color per region. Each is rolled a few times and the roll
    // landing furthest from the neighbors already placed wins — two
    // near-identical colors across a boundary are an edge the
    // detector would miss, i.e. a hole in the linework.
    const rc = new Float32Array(R.count * 3), done = new Uint8Array(R.count);

    for (let r = 0; r < R.count; r++) {
      let best = -1, br = .5, bg = .5, bb = .5;
      for (let k = 0; k < 4; k++) {
        const cr = .5 + (crng() - .5) * variation;
        const cg = .5 + (crng() - .5) * variation;
        const cb = .5 + (crng() - .5) * variation;
        let near = Infinity;
        for (const n of R.nbr[r]) {
          if (!done[n]) continue;
          const dr = cr - rc[n * 3], dg = cg - rc[n * 3 + 1], db = cb - rc[n * 3 + 2];
          near = Math.min(near, dr * dr + dg * dg + db * db);
        }
        if (near > best) { best = near; br = cr; bg = cg; bb = cb; }
        if (near === Infinity) break;      // nothing placed nearby yet
      }
      rc[r * 3] = br; rc[r * 3 + 1] = bg; rc[r * 3 + 2] = bb;
      done[r] = 1;
    }
    for (let f = 0; f < R.nFace; f++) {
      const r = R.region[f];
      paint(f * step, f * step + step, rc[r * 3], rc[r * 3 + 1], rc[r * 3 + 2]);
    }
    geom.userData.regions = R;            // the merge counts regions/edges from it
  }
  // per-object flags ride the low bits of the ID color bytes: the
  // colors are random anyway, so a stolen bit costs no detection
  // entropy, and the post pass can read per-pixel which surfaces opted
  // in. Red LSB = soft-root contact suppression, green LSB =
  // self-overlap contours, blue LSB = unlit (no shading; cast shadows
  // still land), blue bit 1 = casts no shadow. Unflagged geometry is
  // forced to zero bits so the flags read reliably.
  const rLsb = soft ? 1 : 0, gLsb = contour ? 1 : 0;
  // blue bit 2 = organic (shade class); see withOrganic
  const bBits = (unlit ? 1 : 0) | (nocast ? 2 : 0) | (organic ? 4 : 0);
  for (let i = 0; i < count; i++) {
    const br = Math.round(colors[i * 3] * 255);
    colors[i * 3] = ((br & ~1) | rLsb) / 255;
    const bg = Math.round(colors[i * 3 + 1] * 255);
    colors[i * 3 + 1] = ((bg & ~1) | gLsb) / 255;
    const bb = Math.round(colors[i * 3 + 2] * 255);
    colors[i * 3 + 2] = ((bb & ~7) | bBits) / 255;
  }
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // ---- watercolor paint + material properties -------------------
  // Display color rides its own RGBA attribute: the ID colors above
  // are detection-only. The A byte's meaning depends on which mesh
  // the face lands in — translucent faces carry blend alpha, opaque
  // faces carry 255 - glow*255. faceTrans records the routing, since the
  // byte alone can't distinguish glass from glow.
  const pnt = new Uint8Array(count * 4);
  const pp = geom.attributes.position.array;   // for height-based paint blend
  const nFacePaint = Math.ceil(count / step);
  const faceTrans = new Uint8Array(nFacePaint);
  const gm = geometry.userData.groupMtl, fgp = geometry.userData.faceGroup;
  let paintOf = null;
  if (!paintCol && gm && fgp) {
    const cache = [], tpf = step / 3;      // faceGroup entries are per-triangle
    paintOf = f => cache[fgp[f * tpf]] ||
      (cache[fgp[f * tpf]] = paintForName(gm[fgp[f * tpf]] || ''));
  }
  // per-region wash drift: every region reads as its own brush pool.
  // Keyed on region id, so all faces of a region agree; a region never
  // spans OBJ material groups, so the cache stays color-consistent.
  const regJ = geom.userData.regions;
  const jAmt = P.regionJitter, jCache = new Map();
  for (let f = 0; f < nFacePaint; f++) {
    let c, ma, mg;
    if (paintOf) {
      const m = paintOf(f);
      c = m.c; ma = m.a !== undefined ? m.a : 1; mg = m.e || 0;
    } else {
      c = paintCol || PAL.sand; ma = matAlpha; mg = matGlow;
    }
    if (jAmt > 0) {
      const u = regJ ? regJ.region[f] : f;
      let jc = jCache.get(u);
      if (!jc) { jc = tint(c, washJitter(u) * jAmt); jCache.set(u, jc); }
      c = jc;
    }
    const trans = ma < 1;
    faceTrans[f] = trans ? 1 : 0;
    const ab = trans ? Math.round(ma * 255) : 255 - Math.round(mg * 255);
    for (let j = 0; j < step; j++) {
      const i = f * step + j;
      if (i >= count) break;
      let r = c[0], g2 = c[1], b2 = c[2];
      if (pblend) {
        // per-vertex smoothstep by local height; the rasterizer
        // interpolates the bytes, so the fade is per-pixel smooth
        let t = (pp[i * 3 + 1] - pblend.h0) / (pblend.h1 - pblend.h0);
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const w = 1 - t * t * (3 - 2 * t);
        r = Math.round(r + (pblend.c[0] - r) * w);
        g2 = Math.round(g2 + (pblend.c[1] - g2) * w);
        b2 = Math.round(b2 + (pblend.c[2] - b2) * w);
        // NOTE: deliberately no normal bending here. An earlier version
        // bent root normals toward up to match the ground's shading,
        // but that poisons the soft-contact plane test (it predicts
        // contact by extending the TRUE surface plane) and brought the
        // root ink lines back. Objects that blend into the ground
        // should pair this with withUnlit, which removes the shading
        // seam the bend was for in the first place.
      }
      pnt[i * 4] = r; pnt[i * 4 + 1] = g2;
      pnt[i * 4 + 2] = b2; pnt[i * 4 + 3] = ab;
    }
  }
  geom.userData.faceTrans = faceTrans;
  geom.userData.step = step;             // mergeBag re-walks faces with this
  geom.setAttribute('aPaint', new THREE.BufferAttribute(pnt, 4, true));

  // ---- feature-LOD sizes ----------------------------------------
  // One size per unit, where a unit is a region (or a bare face when
  // grouping is off) plus the whole geometry as the "object" unit.
  // Both go out as normalized bytes: the value lands in an 8-bit
  // alpha channel anyway, so floats would just waste bandwidth.
  const nFace = Math.ceil(count / step);
  const R = geom.userData.regions;
  const regionOf = R ? R.region : null;
  const SM = sizeMetrics(geom, step, regionOf, R ? R.count : nFace);
  const szR = new Uint8Array(count * 3), szO = new Uint8Array(count * 3);
  for (let f = 0; f < nFace; f++) {
    const u = regionOf ? regionOf[f] : f;
    for (let j = 0; j < step; j++) {
      const i = f * step + j;
      if (i >= count) break;
      szR[i * 3] = SM.enc[u * 3]; szR[i * 3 + 1] = SM.enc[u * 3 + 1]; szR[i * 3 + 2] = SM.enc[u * 3 + 2];
      szO[i * 3] = SM.obj[0]; szO[i * 3 + 1] = SM.obj[1]; szO[i * 3 + 2] = SM.obj[2];
    }
  }
  geom.setAttribute('aSizeRegion', new THREE.BufferAttribute(szR, 3, true));
  geom.setAttribute('aSizeObject', new THREE.BufferAttribute(szO, 3, true));

  geom.userData.sizes = SM;
  return geom;
}

/* ============================================================
   Renderer / scene bootstrap
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({
  // no antialias: nothing but fullscreen quads ever reaches the default
  // framebuffer, so an MSAA backbuffer costs memory and a resolve blit per
  // present for zero benefit -- all the AA happens in the passes above it.
  // no preserveDrawingBuffer: it forces a copy instead of a swap on every
  // present; 'export png' re-renders and reads back in one task instead.
  powerPreference: 'high-performance',   // request the discrete GPU on dual-GPU laptops
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);

// shared "ID" material — the scene is *rendered as* its face colors,
// with the selected feature size riding in the alpha channel (the ID
// target is RGBA already, so this costs no extra pass or buffer).
// DoubleSide so user-loaded OBJ models render regardless of winding.
const idMaterial = new THREE.ShaderMaterial({
  vertexColors: true,                     // makes three declare `in vec3 color`
  side: THREE.DoubleSide,
  glslVersion: THREE.GLSL3,               // MRT needs layout(location=N) outputs
  uniforms: { uMetric: { value: 0 }, uUnit: { value: 0 } },
  vertexShader: /* glsl */`
    in vec3 aSizeRegion;
    in vec3 aSizeObject;
    in vec4 aPaint;
    uniform float uMetric, uUnit;
    out vec3 vCol;
    out vec4 vPaint;
    out float vSize;
    void main() {
      vCol = color;
      vPaint = aPaint;
      vec3 s = uUnit < 0.5 ? aSizeRegion : aSizeObject;
      vSize = uMetric < 0.5 ? s.x : (uMetric < 1.5 ? s.y : s.z);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    in vec3 vCol;
    in vec4 vPaint;
    in float vSize;
    layout(location = 0) out vec4 outID;     // ID color + encoded feature size
    layout(location = 1) out vec4 outPaint;  // color + alpha/glow byte
    void main() {
      outID = vec4(vCol, vSize);
      outPaint = vPaint;
    }`,
});
// normal pass, two attachments: [0] flat facet normals (ink / contour /
// soft-contact detectors), [1] shade normals (the lighting term only).
// ORGANIC surfaces (ID blue bit 2) evaluate a QUADRATIC PN-triangle
// normal field per pixel from the baked corner + mid-edge coefficients:
// the shade value curves inside every triangle instead of being
// piecewise-linear, killing terminator plateaus at the source, view-
// independently. Hard surfaces keep plain linear interpolation. On a
// flat triangle every PN coefficient equals the face normal and the
// quadratic collapses to a constant, so misflagged flat geometry is
// mathematically unaffected. All view-space, *0.5+0.5.
const normalMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  vertexColors: true,                   // for the organic flag bit
  glslVersion: THREE.GLSL3,
  vertexShader: /* glsl */`
    in vec3 aSNormal;
    in vec4 aSNA; in vec4 aSNB; in vec4 aSNC;
    in vec4 aSM0; in vec4 aSM1; in vec4 aSM2;
    out vec3 vN; out vec3 vSN;
    out vec3 vNA; out vec3 vNB; out vec3 vNC;
    out vec3 vM0; out vec3 vM1; out vec3 vM2;
    out vec3 vBary;
    out float vOrg;
    void main() {
      vN = normalMatrix * normal;
      vSN = normalMatrix * aSNormal;
      vNA = normalMatrix * aSNA.xyz; vNB = normalMatrix * aSNB.xyz; vNC = normalMatrix * aSNC.xyz;
      vM0 = normalMatrix * aSM0.xyz; vM1 = normalMatrix * aSM1.xyz; vM2 = normalMatrix * aSM2.xyz;
      int c = gl_VertexID % 3;
      vBary = vec3(c == 0 ? 1.0 : 0.0, c == 1 ? 1.0 : 0.0, c == 2 ? 1.0 : 0.0);
      vOrg = mod(floor(color.b * 255.0 + 0.5) / 4.0, 2.0) >= 1.0 ? 1.0 : 0.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    in vec3 vN; in vec3 vSN;
    in vec3 vNA; in vec3 vNB; in vec3 vNC;
    in vec3 vM0; in vec3 vM1; in vec3 vM2;
    in vec3 vBary;
    in float vOrg;
    layout(location = 0) out vec4 oFlat;
    layout(location = 1) out vec4 oSmooth;
    void main() {
      float s = gl_FrontFacing ? 1.0 : -1.0;   // DoubleSide flip, like MeshNormalMaterial
      oFlat = vec4(normalize(vN) * s * 0.5 + 0.5, 1.0);
      vec3 sn = vSN;
      if (vOrg > 0.5) {
        vec3 b = vBary;
        sn = b.x * b.x * vNA + b.y * b.y * vNB + b.z * b.z * vNC
           + 2.0 * (b.x * b.y * vM0 + b.y * b.z * vM1 + b.z * b.x * vM2);
      }
      oSmooth = vec4(normalize(sn) * s * 0.5 + 0.5, 1.0);
    }`,
});
// debug wireframe view: every raw triangle edge, ink on paper
const wireMat = new THREE.MeshBasicMaterial({ color: 0x1d1a17, wireframe: true });

/* ============================================================
   ALL DETAIL IS IN THE GEOMETRY.
   No ink textures, no drawn detail: every line comes from a real
   face boundary in a loaded model. However many models a scene
   places, they are baked into ONE merged mesh (one draw call), so
   a whole showcase renders like a single object.
   ============================================================ */
let sceneRoot = null, sceneSphere = null;
let glassRoot = null, glassVertCount = 0, hasGlow = false;
let triCount = 0, edgeCount = 0, regionCount = 0;
// declared here, not with the budget meters: buildScene() runs at module
// top-level well before that point and would hit the temporal dead zone
let lastBuildMs = 0, lastFrameMs = 0;
// where the rebuild actually goes — welding, region flood-fill, edge
// extraction. Rebuild is the binding constraint, so the split is what
// makes it actionable rather than just a number.
let tWeld = 0, tRegion = 0, tEdges = 0;

// ---- watercolor kind -> color --------------------------------
// Builders set this before their put() calls; nested helpers inherit
// the caller's paint unless they set their own. null falls through to
// material-name lookup (imports) or sand.
let currentPaint = null;
const setPaint = c => { currentPaint = c; };
function withPaint(c, fn) {
  const prev = currentPaint; currentPaint = c; fn(); currentPaint = prev;
}
// mix a palette byte triple toward white (k > 0) or black (k < 0)
const tint = (c, k) => c.map(v => Math.max(0, Math.min(255,
  Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)))));
// material properties riding alongside currentPaint: alpha < 1 routes
// geometry to the translucent layer, glow > 0 marks it emissive
let currentAlpha = 1, currentGlow = 0;
function withMat(c, alpha, glow, fn) {
  const pc = currentPaint, pa = currentAlpha, pg = currentGlow;
  currentPaint = c; currentAlpha = alpha; currentGlow = glow;
  fn();
  currentPaint = pc; currentAlpha = pa; currentGlow = pg;
}
// soft-rooted geometry (grass, stems) drops its ink line where it
// meets another surface without a depth break, so it reads as growing
// out of the ground instead of pasted onto it. The flag rides the LSB
// of the ID red byte — see faceIdColors and the dirInk plane test.
let currentSoft = 0, hasSoftRoot = false;
function withSoftRoot(fn) {
  const p = currentSoft; currentSoft = 1; hasSoftRoot = true;
  fn();
  currentSoft = p;
}
// self-overlap contour lines are OPT-IN per object: flat-sided parts
// don't need them (their orientation jumps are real face boundaries the
// ID detector already inks), so the fold detector only runs where a
// caller asks for it — every loaded model does, the ground sheet does
// not. Flag rides the LSB of the ID green byte, same trick as soft
// roots in red.
let currentContour = 0;
function withContours(fn) {
  const p = currentContour; currentContour = 1;
  fn();
  currentContour = p;
}
// blend baked paint toward a target color by LOCAL height: below h0 a

// smooth ramp between. Pair with withUnlit for a seamless ground
// transition — shading keys off the normal, so a lit object still
// shows a lighting step at the contact even when the colors match.
// Runs on the pre-transform geometry, so height is measured from the
// object's own origin regardless of placement.
let currentPBlend = null;
function withPaintBlend(c, h0, h1, fn) {
  const p = currentPBlend; currentPBlend = { c, h0, h1 };
  fn();
  currentPBlend = p;
}
// unlit objects (ID blue LSB): no normal-driven shading — but CAST

// catching shadows from lit casters.
let currentUnlit = 0;
function withUnlit(fn) {
  const p = currentUnlit; currentUnlit = 1;
  fn();
  currentUnlit = p;
}
// no-cast objects (ID blue bit 1 — the LSBs are all spent, so flags

// discards them, so they throw no shadows. Independent of withUnlit —
// any combination of lit/unlit x casting/non-casting works.
let currentNoCast = 0;
function withNoCast(fn) {
  const p = currentNoCast; currentNoCast = 1;
  fn();
  currentNoCast = p;
}
// organic surfaces (ID blue bit 2): the shade classes. Organic gets PN
// quadratic shade normals plus the 'organic smooth px' field blur —
// aggressive, view-independent terminator smoothing for plants,
// terrain and rocks. Unflagged (hard-surface) geometry keeps linear
// interpolation and its own (default 0) blur, so detailed mechanical
// parts stay crisp.
let currentOrganic = 0;
function withOrganic(fn) {
  const p = currentOrganic; currentOrganic = 1;
  fn();
  currentOrganic = p;
}
// filename/material keyword classifier for imported models
const organicName = s =>
  /terrain|hill|ground|mound|arch|root|shrub|leaf|lily|puff|coral|rock|cairn|reed|tube|mushroom|plant|tree|bulb|organic/i.test(s || '');

// ---- merge machinery -----------------------------------------
let bag = [];
const _one = new THREE.Vector3(1, 1, 1);
function frameOf(x, y, z, rx = 0, ry = 0, rz = 0) {
  return new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), _one);
}
// place a geometry inside a frame (or chain of frames)
function put(frame, geom, x, y, z, rx = 0, ry = 0, rz = 0, variation = 1) {
  // triangulated imports opt out of quad pairing (blind pairing on a
  // tri mesh merges unrelated triangles and eats their shared edges)
  const g = faceIdColors(geom, P.perQuad && !geom.userData.forceTri, variation,
                         currentPaint, currentAlpha, currentGlow, currentSoft, currentContour,
                         currentPBlend, currentUnlit, currentNoCast, currentOrganic);
  g.applyMatrix4(frameOf(x, y, z, rx, ry, rz));
  if (frame) g.applyMatrix4(frame);
  bag.push(g);
  return g;
}
// count the boundary edges a geometry contributes — the scene-
// complexity number behind the "edges" meter. These are exactly the
// boundaries the face-ID detector inks: in per-quad mode a consecutive
// triangle PAIR counts as one face (the shared, duplicated vertices are
// its diagonal, so only the other four edges count), and where region
// grouping ran, edges interior to a region carry no color step and are
// skipped. Degenerate edges never make a line, so they never count.
function countEdges(g, perQuad) {

  // which of them are interior. Boundary edges still count once per
  // adjoining face, matching how many times the detector sees them.

  }

}

          go = g.attributes.aSizeObject.array, ga = g.attributes.aPaint.array;

      d.col.set(gc.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.szR.set(gr.subarray(v0 * 3, v1 * 3), d.o * 3);
      d.szO.set(go.subarray(v0 * 3, v1 * 3), d.o * 3);

/* ============================================================
   SCENES — laid out from loaded models, never generated.
   The showcase puts one of every library model on the ground in
   a grid; each model also gets a solo scene, and a dropped .obj
   gets its own. The single ground sheet below is the only piece
   of geometry this file builds: cast shadows need something to
   land on and player mode needs a floor.

// Every model is normalized to this many world units on its longest
// axis. The library runs from a palm-sized lily pad to a 16-unit
// speeder, and at true scale the small pieces are specks next to the
// big ones — a showcase has to show each one. `scale` in the manifest

// model — framing on that would park the camera in the sky. Builders
// set this; frameScene() below reads it.
// { y: what the camera looks at, radius: what has to fit, fit: how
// hard to crop }. fit is per-scene because the two scene shapes frame
// nothing alike: a showcase is a FLAT field seen from a shallow angle
// and never uses its bounding sphere's full height, while a solo model
// is genuinely tall and needs a real sphere fit plus margin.

  put(null, new THREE.PlaneGeometry(size, size, seg, seg), 0, -0.02, 0, -Math.PI / 2, 0, 0, 0.10);
  setPaint(null);   // models color themselves from their material names
}

// Parse one entry and stand it on the ground at (x, z). Models are
// authored around wildly different origins and units, so the geometry
// is normalized before placement: scale the longest axis to
// DISPLAY_SIZE, centre the footprint, then drop the base to y = 0.
// Returns the PLACED size (so a caller can frame the camera on it), or
// null if the file won't parse — one bad model must not take the whole
// scene down with it.

  _mBox.getCenter(_mCtr);

            Math.max(_mSize.x, _mSize.y, _mSize.z, 1e-6);

  // falling back to the filename classifier for dropped files

/* ---- the showcase: one of every model, in a grid ---- */
function buildShowcase(list) {
  const cols = Math.max(1, Math.ceil(Math.sqrt(list.length)));
  const rows = Math.max(1, Math.ceil(list.length / cols));
  const gap = DISPLAY_SIZE * 1.7;

  // near the horizon rather than reading as a slab the models stand on
  groundSheet(Math.hypot((cols - 1) * gap, (rows - 1) * gap) + 200);
  list.forEach((entry, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    // a per-slot yaw so neighbouring copies of similar shapes don't
    // line up into a false pattern
    placeModel(entry, (col - (cols - 1) / 2) * gap,

  // outermost slot centres
  sceneFocus = {
    y: DISPLAY_SIZE * 0.4,
    radius: Math.hypot((cols - 1) * gap, (rows - 1) * gap) / 2 + DISPLAY_SIZE * 0.6,
    fit: 0.72,
  };
}

/* ---- one model, centred and alone ---- */
// A lone model is framed from what it ACTUALLY measures once placed:
// normalizing the longest axis says nothing about the other two, and a
// wide flat slab and a tall thin column want very different distances.

    ? { y: sz.y * 0.5,
        radius: Math.max(0.5 * Math.hypot(sz.x, sz.y, sz.z), DISPLAY_SIZE * 0.3),
        fit: 1.15 }

  currentAlpha = 1; currentGlow = 0;
  currentSoft = 0; hasSoftRoot = false; currentContour = 0; currentPBlend = null;
  currentUnlit = 0; currentNoCast = 0; currentOrganic = 0;

  else if (P.scene.startsWith('model:') && models[+P.scene.slice(6)])

  // Scenes now range from one palm-sized model to a whole grid, so a fixed

function parseOBJ(text) {

  // never merge into one region no matter how well their normals agree

      faceList.push({
        idx: t.slice(1).map(s => {
          const i = parseInt(s.split('/')[0], 10);
          return i < 0 ? vs.length + i : i - 1;

        // authored normal refs (v/vt/vn or v//vn); -1 when absent

  // half their faces can sit *inside* a neighbouring part. A solid
  // renderer never shows those, but this one draws edges from every
  // face, so they surface as scribble wherever they poke through.

  // faces over <=8 corners), which is exactly the primitive-assembly

    `cull buried: dropped ${culled} of ${faceList.length} faces (${(100*culled/faceList.length).toFixed(0)}%) inside other parts`);

  for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) {
